<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic Finance · Hephzibah Academy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2213%22%20fill%3D%22%23f1efe9%22%2F%3E%3Cpath%20d%3D%22M10%2022h11v12h17V12h13v41H38V42H21v11H10z%22%20fill%3D%22%23111a2e%22%2F%3E%3C%2Fsvg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Hephzibah Academy — shared design system */
:root {
  --paper: #f1efe9;
  --paper-2: #e7e4dc;
  --ink: #111a2e;
  --ink-2: #3a4256;
  --muted: #6b7183;
  --rule: #111a2e;
  --hair: rgba(17, 26, 46, 0.14);
  --accent: #f2c230;
  --ok: #1f9d55;
  --radius: 6px;
  --gutter: clamp(16px, 4.2vw, 64px);
  --font: "Plus Jakarta Sans", "Noto Sans KR", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
img, svg { display: block; max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 var(--gutter); }

/* ---------- Header ---------- */
.site-header { border-bottom: 1px solid var(--rule); }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 104px; }
.brand { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 52px; height: 52px; flex: none; }
.brand-name { display: flex; flex-direction: column; line-height: 1; }
.brand-name b { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.brand-name span { font-size: 18px; font-weight: 600; letter-spacing: 0.22em; margin-top: 6px; }
.nav { display: flex; align-items: center; gap: clamp(20px, 3.6vw, 56px); font-size: 17px; font-weight: 500; }
.nav a { text-decoration: none; padding: 6px 0; border-bottom: 1.5px solid transparent; }
.nav a:hover, .nav a[aria-current="page"] { border-bottom-color: var(--ink); }
.nav .divider { width: 1px; height: 28px; background: var(--ink); }
.nav .login { display: inline-flex; align-items: center; gap: 8px; }
.arrow { width: 0.9em; height: 0.9em; flex: none; }
.menu-btn { display: none; background: none; border: 1px solid var(--hair); border-radius: var(--radius); padding: 8px 12px; cursor: pointer; }

@media (max-width: 760px) {
  .site-header .wrap { min-height: 76px; }
  .brand-mark { width: 38px; height: 38px; }
  .brand-name b { font-size: 22px; }
  .brand-name span { font-size: 13px; }
  .menu-btn { display: block; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 76px; flex-direction: column; align-items: stretch; gap: 0;
    background: var(--paper); border-bottom: 1px solid var(--rule); padding: 8px var(--gutter) 16px; z-index: 10; }
  .nav.open { display: flex; }
  .nav a { padding: 14px 0; border-bottom: 1px solid var(--hair); }
  .nav .divider { display: none; }
  .site-header { position: relative; }
}

/* ---------- Type ---------- */
.eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; margin: 0 0 28px; }
.display { font-size: clamp(46px, 8.2vw, 122px); line-height: 0.98; letter-spacing: -0.045em; font-weight: 800; margin: 0; }
.h2 { font-size: clamp(32px, 4.4vw, 60px); line-height: 1.05; letter-spacing: -0.035em; font-weight: 800; margin: 0; }
.h3 { font-size: clamp(22px, 2.2vw, 30px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 700; margin: 0; }
.lead { font-size: clamp(19px, 2vw, 30px); line-height: 1.4; color: var(--ink); margin: 28px 0 0; font-weight: 400; }
.muted { color: var(--muted); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 36px; border-radius: var(--radius);
  background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600; font-size: 18px; border: 1px solid var(--ink);
  cursor: pointer; transition: transform .15s ease, background .15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--paper-2); }
.btn.small { padding: 11px 20px; font-size: 15px; }

/* ---------- Hero ---------- */
.hero .wrap { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 40px; padding-top: clamp(56px, 10vh, 120px); padding-bottom: clamp(56px, 12vh, 128px); }
.hero .vertical { writing-mode: vertical-rl; font-size: 14px; letter-spacing: 0.34em; font-weight: 600; border-left: 1px solid var(--ink);
  padding-left: 28px; align-self: start; height: 384px; display: flex; align-items: center; }
.hero .cta { margin-top: 52px; }
@media (max-width: 760px) { .hero .vertical { display: none; } .hero .wrap { grid-template-columns: 1fr; } }

/* ---------- Pillars ---------- */
.pillars { border-top: 1px solid var(--rule); }
.pillars .wrap { display: grid; grid-template-columns: repeat(3, 1fr); }
.pillar { padding: 28px 24px 32px 0; display: flex; gap: 22px; align-items: baseline; }
.pillar .num { font-size: 16px; font-weight: 600; letter-spacing: 0.18em; }
.pillar h3 { font-size: clamp(24px, 2.4vw, 34px); letter-spacing: -0.02em; margin: 0; font-weight: 700; }
.pillar p { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; max-width: 30ch; }
@media (max-width: 760px) { .pillars .wrap { grid-template-columns: 1fr; } .pillar { border-bottom: 1px solid var(--hair); } }

/* ---------- Sections ---------- */
.section { border-top: 1px solid var(--rule); padding: clamp(56px, 9vw, 120px) 0; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 48px; }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(32px, 6vw, 96px); }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
.prose p { font-size: 19px; line-height: 1.65; margin: 0 0 18px; color: var(--ink-2); max-width: 62ch; }
.quote { font-size: clamp(22px, 2.4vw, 32px); line-height: 1.35; letter-spacing: -0.015em; font-weight: 500; margin: 0; }
.quote cite { display: block; margin-top: 18px; font-style: normal; font-size: 14px; letter-spacing: 0.24em; text-transform: uppercase; font-weight: 600; }

/* ---------- Lecture cards ---------- */
.tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; padding: 6px 10px;
  border: 1px solid var(--ink); border-radius: 999px; }
.tag.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: 1px; }
.card { display: grid; grid-template-columns: auto 1fr auto; gap: clamp(20px, 4vw, 56px); align-items: start; padding: 36px 0;
  border-top: 1px solid var(--rule); text-decoration: none; color: inherit; }
.card:last-child { border-bottom: 1px solid var(--rule); }
.card .num { font-size: 16px; font-weight: 600; letter-spacing: 0.18em; padding-top: 10px; }
.card h3 { font-size: clamp(30px, 3.6vw, 52px); letter-spacing: -0.035em; line-height: 1.05; margin: 12px 0 10px; font-weight: 800; }
.card p { margin: 0; color: var(--ink-2); max-width: 60ch; font-size: 17px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 18px; font-size: 14px; color: var(--muted); font-weight: 500; }
.card .go { width: 56px; height: 56px; border: 1px solid var(--ink); border-radius: 50%; display: grid; place-items: center; transition: background .15s, color .15s; }
a.card:hover .go { background: var(--ink); color: var(--paper); }
.card.disabled { opacity: .5; }
@media (max-width: 760px) { .card { grid-template-columns: 1fr; } .card .go { display: none; } }

.tabs { display: flex; gap: 10px; flex-wrap: wrap; }
.tabs button { background: transparent; border: 1px solid var(--ink); border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 15px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tabs button:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- Footer ---------- */
.site-footer { border-top: 1px solid var(--rule); }
.site-footer .wrap { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-top: 28px; padding-bottom: 32px;
  font-size: 14px; letter-spacing: 0.1em; font-weight: 500; }
.site-footer .right { letter-spacing: 0.22em; text-transform: uppercase; }

/* ---------- Forms ---------- */
.field { display: block; margin-bottom: 18px; }
.field > span { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px; }
.input, textarea.input { width: 100%; background: #fff; border: 1px solid var(--hair); border-radius: var(--radius); padding: 14px 16px; font-size: 17px; }
.input:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px rgba(17,26,46,.12); }
textarea.input { resize: vertical; min-height: 104px; line-height: 1.45; }
.error { color: #b42318; font-size: 15px; margin: 10px 0 0; min-height: 1.4em; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* Instrument badge (score abbreviation, tinted by family) */
.avatar { --size: 44px; width: var(--size); height: var(--size); border-radius: 50%; flex: none; display: inline-grid; place-items: center; background: var(--ink); color: var(--paper); line-height: 1;
  font-weight: 700; font-size: calc(var(--size) * 0.38); letter-spacing: -0.01em; font-style: italic; font-family: Georgia, "Times New Roman", serif; }
.avatar[data-family="strings"] { background: #1d3a6b; }
.avatar[data-family="woodwinds"] { background: #2f6b4f; }
.avatar[data-family="brass"] { background: #a8741a; }
.avatar[data-family="percussion"] { background: #8e3b2e; }

/* Light and Salt */
.verse p { margin: 0; }
.salt-light { display: grid; grid-template-columns: 1fr 1fr; margin-top: 40px; border-top: 1px solid var(--rule); }
.salt-light > div { padding: 22px 24px 0 0; }
.salt-light .num { font-size: 13px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
.salt-light p { margin: 8px 0 0; color: var(--ink-2); font-size: 16px; max-width: 34ch; }
@media (max-width: 600px) { .salt-light { grid-template-columns: 1fr; } }
.hero-ref { margin: 28px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
.hero-ref a { text-decoration: none; border-bottom: 1px solid currentColor; }
.card[hidden] { display: none; }

/* Hephzibah × Beulah lockup */
.lockup { display: flex; align-items: center; gap: clamp(18px, 3vw, 36px); flex-wrap: wrap; }
.lk { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.lk-mark { width: 30px; height: 30px; flex: none; }
.lk-name { display: flex; flex-direction: column; line-height: 1; }
.lk-name b { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.lk-name span { font-size: 10px; font-weight: 600; letter-spacing: 0.22em; margin-top: 4px; }
.lk-sep { width: 1px; height: 30px; background: var(--ink); }
.lockup.big .lk-mark { width: 48px; height: 48px; }
.lockup.big .lk-name b { font-size: 28px; }
.lockup.big .lk-name span { font-size: 13px; margin-top: 6px; }
.lockup.big .lk-sep { height: 48px; }
.site-footer .footer-brands { padding-top: 32px; padding-bottom: 0; }

/* Town on a hill illustration */
.hill-art { width: 100%; max-width: 420px; height: auto; color: var(--ink); margin-top: clamp(28px, 4vw, 48px); overflow: visible; }
.hill-art .glow { transform-origin: 240px 132px; animation: glow 4.5s ease-in-out infinite; }
.hill-art .rays { animation: rays 4.5s ease-in-out infinite; }
@keyframes glow { 50% { transform: scale(1.12); opacity: .75; } }
@keyframes rays { 50% { opacity: .2; } }
.mission { margin: 24px 0 0; font-size: clamp(18px, 1.6vw, 22px); line-height: 1.5; color: var(--ink-2); max-width: 36ch; }
.mission b { color: var(--ink); }

/* Yellow light accents */
.brand-mark .lamp, .lk-mark .lamp { fill: var(--accent); filter: drop-shadow(0 0 2.5px rgba(214, 235, 0, 0.95)); }
.spark { display: inline-block; width: 0.13em; height: 0.13em; margin-left: 0.12em; border-radius: 50%;
  background: var(--accent); animation: blink 3s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

/* Hephzibah & Beulah names (Isaiah 62:4) */
.names2 { margin: 8px 0 0; border-top: 1px solid var(--rule); }
.names2 > div { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: baseline; gap: 24px; padding: clamp(18px, 3vw, 36px) 0; border-bottom: 1px solid var(--rule); }
.names2 dt { font-size: clamp(52px, 9vw, 140px); font-weight: 800; letter-spacing: -0.05em; line-height: 0.95; }
.names2 dd { margin: 0; font-size: clamp(18px, 2vw, 28px); color: var(--ink-2); letter-spacing: -0.01em; }
.names2-verse { margin: 28px 0 0; max-width: 60ch; color: var(--muted); font-size: 16px; }
.names2-verse cite { font-style: normal; font-weight: 700; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; margin-left: 8px; }
@media (max-width: 640px) { .names2 > div { grid-template-columns: 1fr; gap: 8px; } }
.names2 .heb { display: block; margin-top: 12px; font-size: 18px; font-weight: 500; letter-spacing: 0; color: var(--muted); font-family: "Noto Sans Hebrew", "Arial Hebrew", "David", var(--font); direction: rtl; text-align: left; unicode-bidi: isolate; }
.names2-lead { margin: 32px 0 0; font-size: clamp(20px, 2vw, 28px); font-weight: 700; letter-spacing: -0.02em; }
.names2-lead + .names2-verse { margin-top: 10px; }
.spark.sm { width: 0.45em; height: 0.45em; margin-left: 0; vertical-align: 0.05em; }

/* Language toggle */
.lang-btn { background: transparent; border: 1px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.lang-btn:hover { background: var(--ink); color: var(--paper); }
html[lang="ko"] body { word-break: keep-all; }
@media (max-width: 760px) { .nav .lang-btn { margin-top: 12px; align-self: flex-start; } }
.names2-lead { max-width: 40ch; }

/* Navigation: tighter on mid widths, collapse to the Menu button below 1080px */
.nav a { white-space: nowrap; }
@media (max-width: 1320px) { .nav { gap: 24px; font-size: 16px; } }
@media (max-width: 1080px) {
  .site-header { position: relative; }
  .menu-btn { display: block; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; align-items: stretch; gap: 0;
    background: var(--paper); border-bottom: 1px solid var(--rule); padding: 8px var(--gutter) 16px; z-index: 10; }
  .nav.open { display: flex; }
  .nav a { padding: 14px 0; border-bottom: 1px solid var(--hair); }
  .nav .divider { display: none; }
  .nav .lang-btn { margin-top: 12px; align-self: flex-start; }
}
.later { margin: 14px 0 0; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.card:has(+ .later) { border-bottom: 1px solid var(--rule); }

/* About: Hephzibah + Beulah pairing */
.names2 dd { display: grid; gap: 6px; }
.names2 .nm-mean { font-size: clamp(20px, 2vw, 28px); color: var(--ink); letter-spacing: -0.01em; }
.names2 .nm-tag { font-size: 16px; color: var(--ink-2); }
.names2 .nm-role { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.names2 > .names2-plus { display: block; border-bottom: 0; padding: 0; margin: -14px 0; font-size: 28px; font-weight: 300; color: var(--muted); line-height: 1; }
.names2 > .names2-plus { display: grid; place-items: center; width: 34px; height: 34px; margin: -17px 0; position: relative; z-index: 1;
  border: 1px solid var(--rule); border-radius: 50%; background: var(--paper); font-size: 20px; font-weight: 400; color: var(--ink); }
.names2 > .names2-plus { grid-template-columns: 1fr; gap: 0; padding: 0; line-height: 1; }
.avatar[data-family="bible"] { background-color: var(--paper-2); background-size: 400% 300%; background-repeat: no-repeat; border: 1px solid var(--hair); }

[hidden] { display: none !important; }

/* ---------- Presenter stage ---------- */
body.stage-body { height: 100vh; height: 100dvh; overflow: hidden; }
body.stage-body #app { height: 100%; display: flex; flex-direction: column; }
.topbar, .bottombar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 clamp(16px, 2.6vw, 40px); flex: none; }
.topbar { height: 64px; border-bottom: 1px solid var(--rule); }
.bottombar { height: 60px; border-top: 1px solid var(--rule); font-size: 14px; }
.topbar .brand-mark { width: 30px; height: 30px; }
.topbar .brand-name b { font-size: 18px; }
.topbar .brand-name span { font-size: 10px; margin-top: 3px; }
.joinline { font-size: clamp(14px, 1.3vw, 20px); font-weight: 500; text-align: center; }
.joinline b { font-weight: 800; letter-spacing: 0.14em; background: var(--ink); color: var(--paper); padding: 2px 10px; border-radius: 4px; margin-left: 6px; }
.count { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(31,157,85,.15); }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
.ctl { background: transparent; border: 1px solid var(--hair); border-radius: var(--radius); padding: 7px 12px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; }
.ctl:hover { border-color: var(--ink); }
.ctl[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ctl .badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: #c2410c; color: #fff; font-size: 12px; margin-left: 4px; }
.progress { position: relative; height: 2px; background: var(--hair); flex: 1; max-width: 260px; }
.progress i { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.slide-pos { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: 0.12em; }

.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.slide { position: absolute; inset: 0; padding: clamp(28px, 5vh, 72px) clamp(24px, 5vw, 96px); display: grid; animation: slideIn .45s ease both; }
@keyframes slideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.slide .eyebrow { font-size: clamp(12px, 1.1vw, 16px); margin-bottom: clamp(16px, 3vh, 36px); }
.slide .title { font-size: clamp(36px, 6.2vw, 112px); line-height: 1.02; letter-spacing: -0.045em; font-weight: 800; margin: 0; }
.slide.compact .title { font-size: clamp(30px, 4.2vw, 76px); }
.slide .subtitle { font-size: clamp(17px, 1.9vw, 32px); line-height: 1.35; margin: clamp(16px, 3vh, 32px) 0 0; color: var(--ink-2); max-width: 40ch; }
.slide .content { align-self: center; min-width: 0; }
.slide .accent { width: 120px; height: 3px; background: var(--ink); margin-top: clamp(20px, 4vh, 44px); }

.blist { list-style: none; padding: 0; margin: clamp(20px, 4vh, 48px) 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); border-top: 1px solid var(--rule); }
.blist li { padding: 18px 20px 18px 0; display: flex; gap: 16px; align-items: baseline; font-size: clamp(17px, 1.7vw, 28px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
.blist li span { font-size: 0.6em; letter-spacing: 0.16em; font-weight: 600; color: var(--muted); }
.reframe { margin-top: clamp(20px, 4vh, 48px); border-top: 1px solid var(--rule); }
.reframe div { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--hair); font-size: clamp(18px, 2vw, 34px); font-weight: 600; letter-spacing: -0.015em; }
.reframe .from { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.photo-slot { border: 1px dashed var(--muted); border-radius: var(--radius); display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); min-height: 40vh; }

/* Split layout: prompt + live wall */
.slide.split-live { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.25fr); gap: clamp(24px, 4vw, 72px); }
.wall-wrap { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--rule); padding-left: clamp(20px, 3vw, 48px); }

}

body.phone { min-height: 100dvh; }

 소유하는가?","하나님의 청지기 — 누구의 뜻대로 사용하는가?","헌금과 나눔 — 맡겨진 것으로 사람을 돌보기","다시 요셉 — 왜 맡기셨을까?","시간·물질·달란트 — 지금 받은 것을 어떻게 사용하는가?"]},"slides":[{"id":"f01","section":"Start","kind":"cover","eyebrow":"HEPHZIBAH ACADEMY","title":"Basic Finance:\nliving as God’s steward.","subtitle":"How am I using the time, money and abilities entrusted to me?","body":["Basic Finance"],"notes":["The heart of this lecture: acknowledge the life we received from God, and use what is entrusted to us according to the Owner’s will."],"ko":{"section":"시작","eyebrow":"HEPHZIBAH ACADEMY","title":"기초재정 —\n하나님의 청지기로 살아가기","subtitle":"내게 맡겨진 시간과 물질과 능력을 어떻게 사용하고 있는가","body":["기초재정"],"notes":["이 강의의 중심은 하나님께 받은 삶을 인정하고, 맡겨진 것을 주인의 뜻에 따라 사용하는 것입니다."]}},{"id":"f02","section":"Start","kind":"statement","eyebrow":"Giving starts somewhere else","title":"Not “How much good did\nI do with my money?”","subtitle":"But “How did I respond to God’s will with what He entrusted to me?”","body":["Earning, caring for family, paying taxes, preparing for the future, and how we treat employees and customers all belong to this question."],"notes":["Giving doesn’t start from self-evaluation: “I’m a Christian, so I do good things.”","It starts from responsibility: as people who received God’s love and grace, we are stewards and agents managing what belongs to God."],"ko":{"section":"시작","eyebrow":"헌금과 나눔의 출발점","title":"“내 돈으로 얼마나\n좋은 일을 했는가?”보다","subtitle":"“하나님이 맡기신 것으로 그분의 뜻에 어떻게 응답했는가?”","body":["나눔뿐 아니라 돈을 버는 과정, 가족을 돌보는 일, 납세, 미래 준비, 직원과 고객을 대하는 태도까지 모두 이 질문 안에 들어갑니다."],"notes":["헌금과 나눔도 “나는 기독교인이니까 좋은 일을 한다”는 자기평가에서 출발하지 않습니다.","하나님께 사랑과 은혜를 받은 사람으로서, 하나님의 것을 맡아 관리하는 청지기이자 대리인이라는 책임에서 출발합니다."]}},{"id":"f49","section":"Start","kind":"statement","eyebrow":"The center of this lecture","title":"Why do I believe in God?","subtitle":"To get my money problems solved, or to know God and live with Him?","body":["What we seek is not only the money God might give, but God Himself."],"notes":["God gives us eternal life, and He knows our daily needs.","But if we see our relationship with God only as “He supplies the money I need,” we trust Him when money comes and doubt Him when it runs short.","This doesn’t mean daily needs don’t matter. We bring the hardship of not having enough to God, and we carry our responsibility for the finances entrusted to us."],"ko":{"section":"시작","eyebrow":"이 강의의 중심","title":"하나님을 믿는 목적은\n무엇인가?","subtitle":"돈의 문제를 해결받는 데 있는가, 하나님을 알고 그분과 함께 살아가는 데 있는가?","body":["우리가 구하는 것은 하나님이 주실 돈만이 아니라, 하나님 자신입니다."],"notes":["하나님은 우리에게 영생을 주시는 분입니다. 우리의 먹고사는 필요도 아십니다.","그러나 하나님과의 관계를 ‘필요한 돈을 채워주시는 관계’로만 이해하면, 돈이 생길 때는 믿고 부족할 때는 하나님을 의심하게 됩니다.","그렇다고 생활의 필요가 중요하지 않다는 뜻은 아닙니다. 돈이 부족한 어려움도 하나님께 아뢰면서, 내게 맡겨진 재정을 돌볼 책임을 감당하는 것입니다."]}},{"id":"f50","section":"Start","kind":"list","eyebrow":"Trust and responsibility","title":"Trust God.\nManage what’s entrusted, responsibly.","subtitle":"Like health: because God gave it, we don’t skip the doctor. We exercise, prepare and take care of it.","body":["Working, building skills, checking spending, paying off debt and preparing for the future are all part of faith","“God provides” is not a reason to put off preparing","But I also don’t think I can control every result by my own strength","As stewards, we let money flow to where it’s needed","Knowing God, and faithfully caring for the life He allowed and the finances entrusted to us: we teach both together"],"notes":[],"ko":{"section":"시작","eyebrow":"신뢰와 책임","title":"하나님을 신뢰하며,\n맡겨진 돈은 책임 있게 관리한다.","subtitle":"건강처럼: 하나님이 주셨기에 병원에 안 가는 것이 아니라, 허락하신 것을 잘 대비하고 운동하고 관리합니다.","body":["일하고 역량을 기르고, 지출을 확인하고, 빚을 갚고, 미래를 준비하는 일도 신앙과 연결됩니다","하나님이 채우신다는 고백이 준비를 미루는 이유가 되지는 않습니다","동시에 모든 결과를 내 힘으로 통제할 수 있다고 생각하지도 않습니다","청지기로서 맡겨주신 재정을 잘 관리해 필요한 곳에 흘려보냅니다","하나님을 알아가며, 허락하신 삶과 맡겨진 재정을 성실히 돌보는 것. 이 두 가지를 함께 가르칩니다"],"notes":[]}},{"id":"f03","section":"Start","kind":"path","eyebrow":"How we’ll work","title":"Question first.\nThen Scripture.","subtitle":"Scripture notes are summaries. Modern finance and math are applications.","body":["Question","My answer","Guess vs. actual","Scripture","Application"],"notes":[],"ko":{"section":"시작","eyebrow":"진행 방식","title":"질문으로 시작해\n말씀으로 갑니다.","subtitle":"성경 설명은 본문의 요약이며, 현대 금융제도와 계산은 적용으로 구분합니다.","body":["질문","개인 응답","예상과 실제 비교","성경 본문","적용"],"notes":[]}},{"id":"f04","section":"Start","kind":"privacy","eyebrow":"Before we start","title":"Scan, get a name,\nanswer privately.","subtitle":"Income, assets and debt are answered as ranges. You can skip any question.","body":["Each person gets a random Bible-character name and portrait","Only totals are shown, never individual finances","Research use and future counseling contact are separate, optional choices"],"notes":["Have everyone scan the QR code. They can roll again before confirming their name; confirmed names appear on the presenter screen."],"ko":{"section":"시작","eyebrow":"시작 전 — 참여 준비","title":"QR로 접속하고,\n가명으로 참여해요.","subtitle":"소득·자산·부채는 범위로 응답하며 건너뛸 수 있습니다.","body":["성경 인물 가명과 그림을 무작위로 배정받아요","개별 재정 내용은 공개하지 않고 집계만 보여줘요","연구 활용과 향후 상담 연락은 각각 선택 동의예요"],"notes":["QR 코드로 접속해 정보 이용 안내를 확인하고, 가명을 배정받습니다. 재추첨 후 이름을 확정하면 진행자 화면에 접속 상태가 표시됩니다."]}},{"id":"f05","section":"01 Salary and real life","kind":"choice","eyebrow":"Question one","title":"If your salary doubled,\nwould money worry halve?","subtitle":"Choose your income range. You can skip.","body":[],"interaction":{"type":"choice","prompt":"My yearly income (range)","options":[{"value":"u30","label":"Under $30,000"},{"value":"30-60","label":"$30,000–60,000"},{"value":"60-100","label":"$60,000–100,000"},{"value":"100-200","label":"$100,000–200,000"},{"value":"200p","label":"$200,000+"},{"value":"na","label":"Prefer not to say"}]},"notes":[],"ko":{"section":"01 연봉과 실제 생활","eyebrow":"첫 번째 질문","title":"연봉이 두 배가 되면,\n돈 걱정도 절반으로 줄어들까요?","subtitle":"소득 범위를 선택해 주세요. 건너뛰어도 괜찮아요.","notes":[],"body":[],"interaction":{"prompt":"나의 연 소득 (범위)","options":{"u30":"$30,000 미만","30-60":"$30,000–60,000","60-100":"$60,000–100,000","100-200":"$100,000–200,000","200p":"$200,000 이상","na":"답하지 않을래요"}}}},{"id":"f06","section":"01 Salary and real life","kind":"choice","eyebrow":"Right now","title":"How is your month,\nhonestly?","subtitle":"Only totals appear on screen.","body":[],"interaction":{"type":"choice","prompt":"My monthly situation","options":[{"value":"room","label":"There’s room"},{"value":"tight","label":"It’s tight"},{"value":"short","label":"Short every month"},{"value":"unsure","label":"I don’t really know"}]},"notes":["You may know your salary but not what’s actually left.","Let’s check: is income too low, are essential costs too high, or are we spending more than we think?"],"ko":{"section":"01 연봉과 실제 생활","eyebrow":"지금 나의 생활","title":"솔직히, 요즘 한 달은\n어떤가요?","subtitle":"화면에는 집계만 보여요.","notes":["“연봉은 알아도, 실제로 얼마가 남는지는 모를 수 있습니다.","소득이 부족한 것인지, 필수비용이 큰 것인지, 생각보다 많이 쓰고 있는 것인지부터 확인해보겠습니다.”"],"body":[],"interaction":{"prompt":"나의 한 달 형편","options":{"room":"여유가 있다","tight":"빠듯하다","short":"매달 적자다","unsure":"잘 모르겠다"}}}},{"id":"f07","section":"01 Salary and real life","kind":"path","eyebrow":"Where did the money go?","title":"From gross pay\nto what’s left.","subtitle":"","body":["Gross pay","Taxes & deductions","Take-home pay","Living costs & debt payments","Saving, giving & choices"],"notes":[],"ko":{"section":"01 연봉과 실제 생활","eyebrow":"돈은 어디 갔을까?","title":"총급여에서\n남는 돈까지.","subtitle":"","body":["총급여","세금·공제","실수령액","생활비·부채상환","저축·나눔·선택지출"],"notes":[]}},{"id":"f08","section":"01 Salary and real life","kind":"estimate","eyebrow":"Guess, then check","title":"What do you spend\nin a month on…","subtitle":"Guess first. Then compare with your real statements on your phone. This stays private.","body":["What did I spend the most on?","How much spending don’t I remember?","Do my spending and what I say I value match?"],"interaction":{"type":"estimate","prompt":"Monthly spending: guess vs. actual","categories":[{"id":"delivery","label":"Delivery"},{"id":"dining","label":"Eating out"},{"id":"shopping","label":"Shopping"},{"id":"subs","label":"Subscriptions"}]},"notes":["Don’t blame every financial struggle on spending habits. Look at real income and essential costs together."],"ko":{"section":"01 연봉과 실제 생활","eyebrow":"예상하고, 확인하기","title":"한 달에 이것들에\n얼마를 쓸까요?","subtitle":"먼저 예상하고, 휴대폰에서 실제 내역과 비교해요. 나만 볼 수 있어요.","body":["무엇에 가장 많이 썼는가?","기억하지 못하는 지출은 얼마인가?","내가 소중하다고 말하는 것과 사용처가 일치하는가?"],"notes":["경제적 어려움을 모두 소비 습관 탓으로 돌리지 않습니다. 실제 소득과 필수비용을 함께 봅니다."],"interaction":{"prompt":"한 달 지출: 예상 vs 실제","categories":{"delivery":"배달","dining":"외식","shopping":"쇼핑","subs":"구독"}}}},{"id":"f09","section":"01 Salary and real life","kind":"scripture","eyebrow":"Genesis 39:2, 21–23 · summary","title":"Joseph: God was with him\nas a slave and in prison.","subtitle":"God’s presence didn’t begin when Joseph became prime minister.","body":["The numbers we look at today help me understand my situation. They don’t decide my worth before God."],"notes":[],"ko":{"section":"01 연봉과 실제 생활","eyebrow":"창세기 39:2, 21–23 · 요약","title":"요셉은 종의 자리와 감옥에서도\n하나님이 함께하셨습니다.","subtitle":"총리가 된 뒤에야 하나님의 함께하심이 시작된 것은 아닙니다.","body":["오늘 살펴볼 숫자는 내 형편을 이해하기 위한 것입니다. 하나님 앞에서 내 가치를 결정하는 숫자는 아닙니다."],"notes":[]}},{"id":"f10","section":"02 How much is enough?","kind":"choice","eyebrow":"Question two","title":"How much would\nbe enough?","subtitle":"Pick the number closest to your gut answer.","body":[],"interaction":{"type":"choice","prompt":"Enough would be…","options":[{"value":"100k","label":"$100,000 a year"},{"value":"200k","label":"$200,000 a year"},{"value":"1b","label":"₩1 billion in assets"},{"value":"2b","label":"₩2 billion in assets"},{"value":"none","label":"Hard to put a number on it"}]},"notes":[],"ko":{"section":"02 얼마면 충분할까?","eyebrow":"두 번째 질문","title":"얼마면\n충분할까?","subtitle":"마음속에 떠오르는 숫자에 가까운 것을 골라 보세요.","notes":[],"body":[],"interaction":{"prompt":"충분한 건…","options":{"100k":"연봉 $100,000","200k":"연봉 $200,000","1b":"자산 10억 원","2b":"자산 20억 원","none":"숫자로 말하기 어렵다"}}}},{"id":"f11","section":"02 How much is enough?","kind":"text-input","eyebrow":"What money promises","title":"If you had that money,\nwhat do you hope would change?","subtitle":"One line. No names on screen.","body":[],"interaction":{"type":"text","prompt":"If I had that money, I hope…","placeholder":"e.g. I wouldn’t worry about my parents’ health costs","maxLength":180},"notes":[],"ko":{"section":"02 얼마면 충분할까?","eyebrow":"돈이 내게 약속하는 것","title":"그 돈이 생기면\n무엇이 달라지길 바라나요?","subtitle":"한 줄이면 충분해요. 이름은 나오지 않아요.","notes":[],"body":[],"interaction":{"prompt":"그 돈이 생기면, 나는…","placeholder":"예: 부모님 병원비 걱정을 안 했으면 좋겠어요"}}},{"id":"f12","section":"02 How much is enough?","kind":"list","eyebrow":"“I don’t have money” can mean…","title":"Not all “no money”\nis the same.","subtitle":"","body":["Basic living costs aren’t covered","Debt and fixed costs leave nothing","No room to prepare for the future","I can’t spend at the level I want"],"notes":[],"ko":{"section":"02 얼마면 충분할까?","eyebrow":"‘돈이 없다’의 의미","title":"‘돈이 없다’도\n다 같지 않아요.","subtitle":"","body":["기본생활비가 부족하다","부채와 고정비 때문에 남지 않는다","미래를 준비할 여유가 없다","원하는 수준의 소비가 어렵다"],"notes":[]}},{"id":"f13","section":"02 How much is enough?","kind":"questions","eyebrow":"The heart behind the choice","title":"Why do I want\na new car?","subtitle":"We’re not judging cars or houses. We’re looking at what moves the choice.","body":["If I earned more, why would I want to change my car?","Is changing houses about my family’s needs, or feeling successful?","Where did “I should have at least this much” come from?"],"notes":[],"ko":{"section":"02 얼마면 충분할까?","eyebrow":"선택을 움직이는 마음","title":"돈을 더 벌면\n왜 차를 바꾸고 싶을까요?","subtitle":"차와 집 자체를 판단하기보다, 선택을 움직이는 마음을 살펴봅니다.","body":["돈을 더 벌면 왜 차를 바꾸고 싶을까요?","집을 바꾸는 이유는 가족의 필요인가요, 성공했다는 느낌인가요?","‘이 정도는 가져야 한다’는 기준은 어디서 왔나요?"],"notes":[]}},{"id":"f14","section":"02 How much is enough?","kind":"statement","eyebrow":"Building wealth","title":"Then who is\nthat money for?","subtitle":"Earn more. Spend less than you earn. Build assets that create lasting income.","body":["And then always ask: who is it for?"],"notes":[],"ko":{"section":"02 얼마면 충분할까?","eyebrow":"부를 쌓는 기본 방향","title":"그렇게 모은 돈은\n누구를 위한 것인가?","subtitle":"소득을 늘리고, 버는 것보다 적게 쓰며, 지속적인 소득을 만들 자산을 준비합니다.","body":["그다음 반드시 묻습니다. 누구를 위한 것인가?"],"notes":[]}},{"id":"f15","section":"02 How much is enough?","kind":"scripture","eyebrow":"Mark 10:17–27 · Matthew 13:44–46 · summary","title":"The rich young man,\nand the treasure in the field.","subtitle":"One went away sad, unable to let go. One sold everything with joy.","body":["Do I treasure the gospel that much?","Do I believe God is good, yet think money will protect me more surely?","Also: Matthew 6:24 · Proverbs 30:7–9 · 1 Timothy 6:6–10"],"notes":["This is not a formula that giving up wealth saves you. It asks what we hold onto as master."],"ko":{"section":"02 얼마면 충분할까?","eyebrow":"마가복음 10:17–27 · 마태복음 13:44–46 · 요약","title":"부자 청년과\n밭의 보화","subtitle":"부자 청년은 재산을 놓기 어려워 슬퍼했고, 보화를 발견한 사람은 기뻐하며 가진 것을 팔았습니다.","body":["나는 복음을 그만큼 귀하게 여기고 있나요?","하나님이 선하시다고 믿으면서, 돈이 나를 더 확실하게 지켜준다고 생각하지 않나요?","연결 본문: 마태복음 6:24 · 잠언 30:7–9 · 디모데전서 6:6–10"],"notes":["재산을 포기하면 구원받는다는 공식이 아니라, 무엇을 주인으로 붙잡고 있는가를 묻는 시간입니다."]}},{"id":"f16","section":"03 Card debt, interest, taxes, house, car","kind":"statement","eyebrow":"How money works","title":"Money is hard.\nSo let’s learn it.","subtitle":"Instead of vague fear, learn what results our choices create.","body":[],"notes":[],"ko":{"section":"03 카드빚·복리·세금·집·차·절세","eyebrow":"돈의 구조 이해하기","title":"돈이 어렵다는 것을\n이해합니다.","subtitle":"막연히 두려워하기보다, 내 선택이 어떤 결과를 만드는지 배워야 합니다.","body":[],"notes":[]}},{"id":"f17","section":"03 Card debt, interest, taxes, house, car","kind":"calculator","eyebrow":"Card debt & compound interest · Proverbs 22:7","title":"“I learned compound interest\nthrough credit card debt.”","subtitle":"Check: total balance, APR, due date, minimum payment, what you can really pay.","body":["Paying in full vs. carrying a balance","How long minimum payments take","A plan you can keep, alongside basic living costs"],"interaction":{"type":"calculator","prompt":"Card payoff calculator"},"notes":["Proverbs 22:7: debt binds our future choices."],"ko":{"section":"03 카드빚·복리·세금·집·차·절세","eyebrow":"카드빚과 복리 · 잠언 22:7","title":"“나는 카드빚을 통해\n복리를 배웠습니다.”","subtitle":"확인할 것: 전체 잔액·이자율·결제일·최소 납부액·실제 상환 가능액","body":["전액 결제와 잔액 이월 구분하기","최소 납부액만 낼 때 상환기간","기본생활비를 고려한, 지킬 수 있는 상환 계획"],"notes":["잠언 22:7: 부채가 미래의 선택을 묶는 문제를 생각합니다."],"interaction":{"prompt":"카드빚 상환 계산기"}}},{"id":"f18","section":"03 Card debt, interest, taxes, house, car","kind":"list","eyebrow":"Taxes · Romans 13:6–7","title":"Pay honestly.\nPrepare wisely.","subtitle":"Not avoiding taxes, but paying what’s owed and using allowed tools to prepare for the future.","body":["Tax brackets: each layer of income is taxed at its own rate","Deductions lower taxable income; credits lower the tax itself","401(k) and IRA encourage retirement saving, but not every benefit has the same purpose"],"notes":[],"ko":{"section":"03 카드빚·복리·세금·집·차·절세","eyebrow":"세금과 절세 · 로마서 13:6–7","title":"낼 세금은 정직하게,\n미래는 지혜롭게.","subtitle":"세금을 내지 말자는 것이 아니라, 허용된 제도로 미래의 책임도 준비하자는 것입니다.","body":["구간별 과세: 소득 구간마다 다른 세율","소득공제는 과세 소득을, 세액공제는 세금 자체를 줄여요","401(k)·IRA는 은퇴 준비를 장려하는 장치. 모든 혜택의 목적이 같지는 않아요"],"notes":[]}},{"id":"f19","section":"03 Card debt, interest, taxes, house, car","kind":"list","eyebrow":"House, car & deductions","title":"If it’s deductible, is the\nmore expensive one a win?","subtitle":"Count every cost, then see what’s actually left.","body":["House: interest, property tax, insurance, repairs, transaction costs","Car: financing, insurance, maintenance, parking, depreciation"],"notes":[],"ko":{"section":"03 카드빚·복리·세금·집·차·절세","eyebrow":"집·차·절세","title":"공제가 되면 더 비싼 것을\n사도 이득일까요?","subtitle":"세금이 줄었다는 사실보다, 모든 비용을 계산한 뒤 무엇이 남는지 확인합시다.","body":["집: 이자·재산세·보험·수리·거래비용","차: 금융비용·보험·정비·주차·가치 하락"],"notes":[]}},{"id":"f20","section":"04 Living to 80, 90, 100","kind":"list","eyebrow":"Section four","title":"Am I ready to live\nto 80, 90, 100?","subtitle":"Retiring at 65, how many years do I need to prepare for?","body":["To 80 · 15 years","To 90 · 25 years","To 100 · 35 years"],"notes":[],"ko":{"section":"04 80·90·100세의 나","eyebrow":"네 번째 · 책임 있는 미래 준비","title":"나는 80·90·100세까지\n살 준비가 되어 있는가?","subtitle":"65세에 은퇴한다면, 준비할 기간은?","body":["80세까지 · 15년","90세까지 · 25년","100세까지 · 35년"],"notes":[]}},{"id":"f30","section":"04 Living to 80, 90, 100","kind":"statement","eyebrow":"After the paycheck","title":"Your paycheck stops.\nYour needs don’t.","subtitle":"Housing, food, medicine and care, caregiving, and the cost of relationships.","body":["Compare today’s living costs with future needs, including inflation."],"notes":[],"ko":{"section":"04 80·90·100세의 나","eyebrow":"급여가 멈춘 뒤","title":"급여가 멈춰도\n필요한 것은 남습니다.","subtitle":"집, 먹을 것, 약과 의료, 돌봄, 관계를 위한 비용입니다.","body":["인플레이션을 반영해 현재의 생활비와 미래의 필요를 비교합니다."],"notes":[]}},{"id":"f31","section":"04 Living to 80, 90, 100","kind":"list","eyebrow":"401(k) · IRA","title":"Retirement accounts,\nexplained.","subtitle":"","body":["Workplace retirement plans and personal retirement accounts","How Traditional and Roth are taxed","Company match, eligibility to contribute, withdrawal rules","The assets you actually invest in inside the account"],"notes":[],"ko":{"section":"04 80·90·100세의 나","eyebrow":"401(k) · IRA","title":"은퇴계좌,\n이렇게 다릅니다.","subtitle":"","body":["직장 은퇴제도와 개인 은퇴계좌","Traditional과 Roth의 세금 처리","회사 매칭·납입 자격·인출 조건","계좌 안에서 실제로 투자하는 자산"],"notes":[]}},{"id":"f32","section":"04 Living to 80, 90, 100","kind":"compound","eyebrow":"Compound growth activity","title":"Change when you start,\nhow long, and how much.","subtitle":"Assumed returns aren’t guaranteed. Think about taxes, fees and inflation too.","body":[],"interaction":{"type":"compound","prompt":"Compound growth"},"notes":[],"ko":{"section":"04 80·90·100세의 나","eyebrow":"복리 활동","title":"시작 시점·기간·납입액을\n바꿔봅니다.","subtitle":"가정 수익률은 보장되지 않으며 세금·수수료·물가를 함께 고려합니다.","body":[],"notes":[],"interaction":{"prompt":"복리 계산"}}},{"id":"f33","section":"04 Living to 80, 90, 100","kind":"scripture","eyebrow":"Genesis 41:33–36, 47–57 · summary","title":"Joseph didn’t assume\nthe good years would last.","subtitle":"He prepared for the famine.","body":[],"notes":[],"ko":{"section":"04 80·90·100세의 나","eyebrow":"창세기 41:33–36, 47–57 · 요약","title":"요셉은 풍년이 계속될 것으로\n여기지 않았습니다.","subtitle":"흉년을 준비했습니다.","body":[],"notes":[]}},{"id":"f34","section":"04 Living to 80, 90, 100","kind":"scripture","eyebrow":"Philippians 4:11–13 · summary","title":"Where is my\nultimate security?","subtitle":"Paul learned contentment in need and in plenty, full and hungry.","body":["The strength Christ gives is not a promise that I’ll get the wealth I want. It’s strength to live in very different circumstances."],"notes":[],"ko":{"section":"04 80·90·100세의 나","eyebrow":"빌립보서 4:11–13 · 요약","title":"미래를 준비하면서도\n내 궁극적인 안전을 어디에 두고 있나요?","subtitle":"바울은 궁핍과 풍부, 배부름과 배고픔 속에서 자족하는 법을 배웠다고 말합니다.","body":["그리스도가 주시는 힘은 원하는 부를 반드시 얻는다는 약속보다, 서로 다른 형편 속에서도 살아가는 문맥입니다."],"notes":[]}},{"id":"f51","section":"04 Living to 80, 90, 100","kind":"questions","eyebrow":"Philippians 4:11–13, again","title":"In plenty and in need,\nam I getting to know God?","subtitle":"Paul’s confession is about strength to live in Christ, not only in plenty but also in need.","body":["Am I trying to get money through God, or trying to know God whether I have money or not?","While saying “I leave it to God,” am I putting off the responsibility that is mine?"],"notes":[],"ko":{"section":"04 80·90·100세의 나","eyebrow":"다시, 빌립보서 4:11–13","title":"풍부할 때도 궁핍할 때도\n하나님을 알아가는가?","subtitle":"바울의 고백은 풍부할 때뿐 아니라 궁핍할 때도 그리스도 안에서 살아갈 힘에 관한 것입니다.","body":["나는 하나님을 통해 돈을 얻으려 하는가, 돈이 있는 때에도 없는 때에도 하나님을 알아가려 하는가?","하나님께 맡긴다고 말하면서, 내가 감당할 책임은 미루고 있지 않은가?"],"notes":[]}},{"id":"f35","section":"04 Living to 80, 90, 100","kind":"statement","eyebrow":"Don’t only sacrifice today","title":"The years you spend earning\nare your life too.","subtitle":"While preparing for your future self, are you caring for today’s health and relationships?","body":[],"notes":[],"ko":{"section":"04 80·90·100세의 나","eyebrow":"현재를 희생하기만 하지 않습니다","title":"돈을 버는 시간도\n내 인생입니다.","subtitle":"“돈이 생기면 살겠다고 생각하지만, 미래의 나를 준비하면서 오늘의 건강과 관계도 돌보고 있나요?”","body":[],"notes":[]}},{"id":"f25","section":"05 Work and starting a business","kind":"statement","eyebrow":"Section five · work and starting a business","title":"Whose life got better\nbecause of my work?","subtitle":"“I worked hard, so I deserve better treatment.” Then how did my effort make someone’s life better?","body":[],"notes":[],"ko":{"section":"05 직업과 창업","eyebrow":"다섯 번째 · 직업과 창업","title":"나의 수고로 누구의 삶이\n어떻게 좋아졌을까요?","subtitle":"“열심히 일했으니 더 좋은 대우를 받아야 한다고 생각합니다. 그렇다면…”","body":[],"notes":[]}},{"id":"f36","section":"05 Work and starting a business","kind":"text-input","eyebrow":"One recent example","title":"Write one thing\nyour work made better.","subtitle":"","body":["Solved a customer’s problem","Saved a coworker time","Cut mistakes and rework","Built trust"],"interaction":{"type":"text","prompt":"One recent example","placeholder":"e.g. I fixed a billing error that saved a customer hours","maxLength":180},"notes":[],"ko":{"section":"05 직업과 창업","eyebrow":"최근 사례 하나","title":"내 일로 나아진 것\n하나를 적어 보세요.","subtitle":"","body":["고객의 문제를 해결한 일","동료의 시간을 줄여준 일","실수와 재작업을 줄인 일","신뢰를 만든 일"],"notes":[],"interaction":{"prompt":"최근 사례 하나","placeholder":"예: 고객의 청구 오류를 바로잡아 몇 시간을 아껴 드렸어요"}}},{"id":"f37","section":"05 Work and starting a business","kind":"list","eyebrow":"Starting a business","title":"Is it what I want to make,\nor what they actually need?","subtitle":"","body":["Salary and human dignity are different things. Capable people can still lose their jobs.","Am I building skills and trust I can explain outside my job title?","Mission is not a word to justify unfair treatment. Ask what value you give the company, and how the company treats its people."],"notes":[],"ko":{"section":"05 직업과 창업","eyebrow":"창업","title":"내가 만들고 싶은 것인가요,\n상대가 실제로 필요로 하는 것인가요?","subtitle":"","body":["연봉과 사람의 존엄은 구분합니다. 역량이 있어도 실직할 수 있습니다.","직함 밖에서도 설명할 수 있는 역량과 신뢰를 준비하고 있나요?","사명은 부당한 대우를 정당화하는 말이 아닙니다. 회사에 주는 가치와 함께 회사가 직원을 어떻게 대하는지도 묻습니다."],"notes":[]}},{"id":"f26","section":"06 Stocks and cash flow","kind":"list","eyebrow":"Section six · stocks and cash flow","title":"Why did I buy\nthis stock?","subtitle":"A stock is owning part of a company. Its price is the market’s view, not always its real value or its goodness.","body":["Whose problem does the company solve?","How does it make a profit?","Does it treat employees, customers and suppliers fairly?","Do its strengths and my reason to invest still hold?","Are the price and the risk reasonable?"],"notes":[],"ko":{"section":"06 주식과 현금흐름","eyebrow":"여섯 번째 · 주식과 현금흐름","title":"나는 왜 이 주식을\n샀는가?","subtitle":"주식은 기업의 일부를 소유하는 것입니다. 주가는 시장의 평가이며, 실제 가치나 도덕적 선함과 항상 일치하지는 않습니다.","body":["누구의 어떤 문제를 해결하는 기업인가?","어떻게 이익을 남기는가?","직원·고객·협력업체를 공정하게 대하는가?","경쟁력과 투자 이유가 유지되는가?","가격과 위험은 적절한가?"],"notes":[]}},{"id":"f38","section":"06 Stocks and cash flow","kind":"choice","eyebrow":"Be honest","title":"How many times a day\ndo you check your stocks?","subtitle":"Not the count, but the reason: information, or anxiety, comparison and hurry?","body":[],"interaction":{"type":"choice","prompt":"Times a day I check stocks","options":[{"value":"0","label":"I don’t own stocks"},{"value":"1","label":"Rarely / once"},{"value":"2-5","label":"2–5 times"},{"value":"6-20","label":"6–20 times"},{"value":"20p","label":"More than 20"}]},"notes":["Does my account balance decide today’s gratitude and mood?"],"ko":{"section":"06 주식과 현금흐름","eyebrow":"솔직하게","title":"하루에 주식창을\n몇 번 보는가?","subtitle":"횟수보다 이유를 묻습니다. 필요한 정보인가요, 불안·비교·조급함인가요?","notes":["계좌 잔액이 오늘의 감사와 기분을 결정하나요?"],"body":[],"interaction":{"prompt":"하루에 주식창을 보는 횟수","options":{"0":"주식이 없어요","1":"거의 안 봄 / 한 번","2-5":"2–5번","6-20":"6–20번","20p":"20번 이상"}}}},{"id":"f39","section":"06 Stocks and cash flow","kind":"list","eyebrow":"Beyond the number","title":"If my stocks hit\n₩1–2 billion…","subtitle":"Separate what’s on the screen from what you can actually use.","body":["Market value · cost basis · gain","Taxes · costs · money you can actually use","Cash flow from a job, business, rental or investment: compare management, risk and net profit, not just income"],"notes":[],"ko":{"section":"06 주식과 현금흐름","eyebrow":"숫자 너머","title":"주식이 10억·20억 원이\n되었을 때도","subtitle":"화면의 숫자와 실제로 쓸 수 있는 돈을 구분합니다.","body":["평가액 · 취득원가 · 차익","세금 · 비용 · 사용 가능한 금액","직업·사업·임대·투자의 현금흐름은 수입뿐 아니라 관리·위험·순수익까지 비교합니다"],"notes":[]}},{"id":"f40","section":"06 Stocks and cash flow","kind":"choice","eyebrow":"Emergency check","title":"If your paycheck stopped tomorrow,\nhow many months could you last?","subtitle":"Only totals are shown.","body":[],"interaction":{"type":"choice","prompt":"Months I could last","options":[{"value":"lt1","label":"Less than 1"},{"value":"1-3","label":"1–3 months"},{"value":"3-6","label":"3–6 months"},{"value":"6-12","label":"6–12 months"},{"value":"12p","label":"12 months or more"},{"value":"unsure","label":"I don’t know"}]},"notes":["2 Thessalonians 3:6–13 warns against being unwilling to work while burdening the community. Don’t use it to call every investment return speculation."],"ko":{"section":"06 주식과 현금흐름","eyebrow":"비상 점검","title":"내일부터 급여가 멈추면\n몇 개월을 버틸 수 있나요?","subtitle":"화면에는 집계만 보여요.","notes":["데살로니가후서 3:6–13은 일할 의사가 없으면서 공동체에 부담을 주는 태도를 경계하는 문맥입니다. 모든 투자수익을 투기로 규정하는 근거로 사용하지 않습니다."],"body":[],"interaction":{"prompt":"버틸 수 있는 기간","options":{"lt1":"1개월 미만","1-3":"1–3개월","3-6":"3–6개월","6-12":"6–12개월","12p":"12개월 이상","unsure":"잘 모르겠다"}}}},{"id":"f27","section":"07 God’s steward","kind":"scripture","eyebrow":"Section seven · Psalm 50:9–15 · 1 Chronicles 29:14","title":"Does God really\nneed my money?","subtitle":"God isn’t someone whose lack we must fill. We give from what we received.","body":[],"notes":[],"ko":{"section":"07 하나님의 청지기","eyebrow":"일곱 번째 · 시편 50:9–15 · 역대상 29:14","title":"하나님이 과연\n내 돈을 필요로 하실까요?","subtitle":"하나님은 부족한 것을 우리가 채워드려야 하는 분이 아닙니다. 우리는 받은 것으로 드리고 살아갑니다.","body":[],"notes":[]}},{"id":"f41","section":"07 God’s steward","kind":"statement","eyebrow":"A steward’s question","title":"Not “What do I want to do\nwith this money?”","subtitle":"But “How will I respond to the will of the Owner who entrusted it to me?”","body":[],"notes":[],"ko":{"section":"07 하나님의 청지기","eyebrow":"청지기의 질문","title":"“이 돈으로 내가 무엇을\n하고 싶은가?”에서","subtitle":"“이 돈을 맡긴 주인의 뜻에 어떻게 응답할 것인가?”로","body":[],"notes":[]}},{"id":"f42","section":"07 God’s steward","kind":"questions","eyebrow":"“I’ll earn a lot for God’s kingdom.”","title":"Really?","subtitle":"","body":["Can I live for God’s kingdom even without money?","Am I postponing today’s love, saying I’ll give once I earn more?","Do I talk about big future gifts while neglecting fairness to my employees?","Will I stay honest and love people even if the business doesn’t grow?"],"notes":[],"ko":{"section":"07 하나님의 청지기","eyebrow":"“하나님 나라를 위해 돈을 많이 벌겠습니다.”","title":"정말 그런가요?","subtitle":"","body":["돈이 없어도 하나님 나라를 위해 살 수 있는가?","더 벌면 나누겠다고 하면서 오늘의 사랑을 미루고 있는가?","미래의 큰 헌금을 말하면서 직원에게 공정할 책임은 놓치고 있는가?","사업이 커지지 않아도 정직하고 사람을 사랑할 것인가?"],"notes":[]}},{"id":"f43","section":"07 God’s steward","kind":"list","eyebrow":"Three passages","title":"Faith, first fruits,\nand remembering.","subtitle":"","body":["Cain and Abel · Genesis 4:3–7, Hebrews 11:4: not just the price of the offering, but faith and life","First fruits · Proverbs 3:9–10: do I honor God to fill my barns, or give because I honor Him?","Remembering in plenty · Deuteronomy 8:11–18: do I remember God as my wealth grows, or think I earned it alone?"],"notes":[],"ko":{"section":"07 하나님의 청지기","eyebrow":"세 본문","title":"믿음, 첫 열매,\n그리고 기억","subtitle":"","body":["가인과 아벨 · 창세기 4:3–7, 히브리서 11:4: 제물의 가격만이 아니라 믿음과 삶","첫 열매 · 잠언 3:9–10: 창고를 채우기 위해 하나님을 공경하나요, 하나님을 공경하기 때문에 드리나요?","풍요 속의 기억 · 신명기 8:11–18: 재산이 늘 때 하나님을 기억하나요? 내 능력만으로 얻었다고 생각하지 않나요?"],"notes":[]}},{"id":"f44","section":"07 God’s steward","kind":"statement","eyebrow":"Wealth and poverty","title":"Whatever my situation,\nam I carrying my responsibility?","subtitle":"Wealth doesn’t prove God’s special favor. Poverty doesn’t automatically prove deeper faith.","body":["Simplicity can be contentment, but it’s different from handing my responsibilities to others. And the wealthy should ask whether others carry unfair burdens for their comfort."],"notes":[],"ko":{"section":"07 하나님의 청지기","eyebrow":"부와 가난","title":"어떤 형편이든, 맡겨진 책임을\n감당하고 있는가?","subtitle":"부는 하나님의 특별한 총애를 증명하지 않습니다. 가난도 더 높은 신앙을 자동으로 증명하지 않습니다.","body":["청빈은 자족하는 태도일 수 있지만, 감당할 책임을 다른 사람에게 넘기는 것과는 구분합니다. 부유한 사람에게도 자신의 풍요를 위해 다른 사람이 부당한 부담을 지고 있지 않은지 묻습니다."],"notes":[]}},{"id":"f28","section":"08 Offering and giving","kind":"statement","eyebrow":"Section eight · offering and giving","title":"Giving doesn’t prove\nI’m a good person.","subtitle":"It isn’t a fee for God’s approval. From the grace we received in Christ, as stewards of what is God’s, we care for the people He loves.","body":["Giving isn’t only for the wealthy. A good purpose isn’t enough: how it’s delivered and managed must be honest too."],"notes":[],"ko":{"section":"08 헌금과 나눔","eyebrow":"여덟 번째 · 헌금과 나눔","title":"헌금과 나눔은 내가 좋은 사람임을\n증명하는 일이 아닙니다.","subtitle":"하나님께 인정받기 위한 비용도 아닙니다. 그리스도 안에서 받은 은혜를 바탕으로, 하나님의 것을 맡은 사람으로서 그분이 사랑하시는 사람을 돌보는 일입니다.","body":["나눔은 부유한 사람만의 일이 아닙니다. 선한 목적만으로 충분하지 않고, 전달하고 관리하는 과정도 정직해야 합니다."],"notes":[]}},{"id":"f45","section":"08 Offering and giving","kind":"photo","eyebrow":"U.S. spending and Kenya","title":"One real case\nfrom Kenya.","subtitle":"Do I see the person receiving as the object of my good deed, or as someone God loves?","photo":{"label":"Your own example","note":"Compare a U.S. spending example with one support you actually gave in Kenya. Use verified costs and results only."},"body":[],"notes":[],"ko":{"section":"08 헌금과 나눔","eyebrow":"미국의 소비와 케냐","title":"케냐에서 실제 지원한\n사례 하나","subtitle":"나는 받는 사람을 내 선행의 대상으로 보나요, 하나님이 사랑하시는 한 사람으로 보고 있나요?","photo":{"label":"직접 지원한 사례","note":"미국에서의 소비와 케냐에서 실제 지원한 사례 하나를 비교합니다. 확인된 비용과 결과만 사용합니다."},"notes":[],"body":[]}},{"id":"f46","section":"08 Offering and giving","kind":"scripture","eyebrow":"Matthew 25:35–40 · 1 John 3:16–18","title":"Loving people means\nmeeting real needs.","subtitle":"Alongside wanting to share the gospel, we treat every person as precious, whatever their faith.","body":["Loving souls includes responding to needs for food, medical care, housing and care."],"notes":[],"ko":{"section":"08 헌금과 나눔","eyebrow":"마태복음 25:35–40 · 요한일서 3:16–18","title":"영혼을 사랑하는 일에는\n필요에 응답하는 행동도 포함됩니다.","subtitle":"복음을 전하고 싶은 마음과 함께, 신앙 유무와 상관없이 사람을 소중히 대합니다.","body":["식사·치료·주거·돌봄의 필요에 응답합니다."],"notes":[]}},{"id":"f29","section":"09 Joseph again","kind":"list","eyebrow":"Section nine · Joseph again","title":"Why did God\nentrust it to him?","subtitle":"","body":["Genesis 41:50–52 · Manasseh and Ephraim: names that confess recovery and fruit given in suffering","Genesis 45:5–8, 50:20 · Joseph saw his position as preserving the lives of his family and many people","Genesis 50:1 · When his father died, he wept and kissed him. Behind the prime minister was a son who loved his father."],"notes":[],"ko":{"section":"09 다시 요셉","eyebrow":"아홉 번째 · 다시 요셉","title":"왜 맡기셨을까?","subtitle":"","body":["창세기 41:50–52 · 므낫세와 에브라임: 고난 가운데 주신 회복과 열매에 대한 고백","창세기 45:5–8, 50:20 · 요셉은 자신의 자리를 가족과 많은 사람의 생명을 보존하는 일로 이해합니다","창세기 50:1 · 아버지가 죽자 얼굴에 엎드려 울며 입을 맞춥니다. 총리라는 지위 뒤에도 아버지를 사랑하는 아들이 있었습니다."],"notes":[]}},{"id":"f47","section":"09 Joseph again","kind":"statement","eyebrow":"Joseph’s story","title":"Because of what I’ve been entrusted,\nwhose life is getting better?","subtitle":"Who I am becoming matters as much as what I will become.","body":[],"notes":["Joseph’s story is not that everyone who endures suffering becomes rich. God was with him in prison.","He did the work in front of him, noticed the worries of the people beside him, and once he had authority, he cared for his family.","Who I am becoming matters as much as what I will become. Because of the money, time and abilities entrusted to me, whose life is getting better?"],"ko":{"section":"09 다시 요셉","eyebrow":"요셉의 이야기","title":"내게 맡겨진 것 때문에\n누구의 삶이 나아지고 있습니까?","subtitle":"무엇이 될 것인가만큼 어떤 사람이 되어가는지도 중요합니다.","body":[],"notes":["“요셉의 이야기는 고난을 견디면 모두 부자가 된다는 이야기가 아닙니다. 감옥에서도 하나님이 함께하셨습니다.","그는 맡은 일을 감당했고, 곁에 있는 사람의 근심을 알아보았고, 권한을 얻은 뒤에는 가족을 돌보았습니다.","무엇이 될 것인가만큼 어떤 사람이 되어가는지도 중요합니다. 내게 맡겨진 돈과 시간과 능력 때문에 누구의 삶이 나아지고 있습니까?”"]}},{"id":"f48","section":"10 Time, money, talents","kind":"scripture","eyebrow":"Section ten · Matthew 25:14–30","title":"Time, money, talents:\nhow am I using what I have now?","subtitle":"Faithfulness with what’s entrusted, not a formula for growing wealth. Apply it to time, abilities, relationships and opportunities.","body":["Time · Do I actually spend it on the people and work I say I value?","Money · Do I responsibly care for living needs, the future and my neighbors’ needs?","Abilities and experience · Do I solve others’ problems and help them grow?","Relationships and opportunities · Do I notice people and open doors for others too?"],"notes":[],"ko":{"section":"10 시간·물질·달란트","eyebrow":"열 번째 · 마태복음 25:14–30","title":"시간·물질·달란트 —\n지금 받은 것을 어떻게 사용하는가?","subtitle":"재산 증식의 공식으로 사용하지 않고, 맡겨진 것에 대한 신실함으로 시간·능력·관계·기회까지 적용합니다.","body":["시간 · 소중하다고 말하는 사람과 일에 실제로 쓰는가?","물질 · 생활·미래·이웃의 필요를 책임 있게 돌보는가?","능력과 경험 · 다른 사람의 문제를 해결하고 성장을 돕는가?","관계와 기회 · 사람을 알아보고 다른 사람에게도 길을 열어 주는가?"],"notes":[]}},{"id":"f21","section":"10 Time, money, talents","kind":"statement","eyebrow":"Using it well","title":"Using life well isn’t\nfilling every hour with output.","subtitle":"Resting, getting care, being with family, staying beside someone who grieves: this too is treasuring the life entrusted to us.","body":[],"notes":[],"ko":{"section":"10 시간·물질·달란트","eyebrow":"잘 사용한다는 것","title":"모든 시간을 성과로\n채우는 뜻이 아닙니다.","subtitle":"쉬고, 치료받고, 가족과 함께하고, 슬퍼하는 사람 곁에 머무는 것도 맡겨진 삶을 소중히 사용하는 일입니다.","body":[],"notes":[]}},{"id":"f22" // Shared helpers for the presenter and audience screens.

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error((data.error && data.error.message) || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

const getJson = (url) => Promise.resolve(__DATA[url]);

let instruments = null;
async function loadInstruments() {
  if (!instruments) {
    const [ins, bible] = await Promise.all([getJson("/data/instruments.json"), getJson("/data/bible.json").catch(() => [])]);
    instruments = [...ins, ...(bible || []).map((b) => ({ ...b, kind: "bible", family: "Bible", familyKo: "성경 인물" }))];
  }
  return instruments;
}
const instrumentById = (id) => (instruments || []).find((i) => i.id === id);

// Round "badge" for an instrument: score abbreviation (Vn, Ob, Hn…) tinted by family.
function avatar(id, size = 44) {
  const ins = instrumentById(id);
  const el = document.createElement("span");
  el.className = "avatar";
  el.dataset.family = ins ? ins.family.toLowerCase() : "";
  el.style.setProperty("--size", size + "px");
  if (ins && ins.kind === "bible") {
    el.dataset.family = "bible";
    el.style.backgroundImage = "url(/img/bible-avatars.png)";
    el.style.backgroundPosition = `${(ins.col / 3) * 100}% ${(ins.row / 2) * 100}%`;
  } else el.textContent = ins ? ins.abbr : "?";
  el.setAttribute("aria-hidden", "true");
  return el;
}

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}

// Multi-line title text ("\n") → spans with <br>, safely.
function lines(text) {
  const frag = document.createDocumentFragment();
  String(text).split("\n").forEach((line, i) => { if (i) frag.append(document.createElement("br")); frag.append(line); });
  return frag;
}

const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// Score the 20-question self-reflection. Answers: -1, 0, 1, or null (skipped).
function scorePersonality(data, answers) {
  const out = {};
  for (const dim of data.dimensions) {
    const items = data.items.filter((it) => it.dimension === dim.id);
    const vals = items.map((it) => answers[it.id]).map((v, i) => (v == null ? null : items[i].reverse ? -v : v)).filter((v) => v != null);
    if (vals.length < 2) { out[dim.id] = null; continue; }
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    out[dim.id] = mean < -0.25 ? "low" : mean > 0.25 ? "high" : "mid";
  }
  return out;
}

// ---------- Language (English / 한국어) ----------
let memLang = null;
function getLang() {
  if (memLang) return memLang;
  try { return localStorage.getItem("hz-lang") === "ko" ? "ko" : "en"; } catch { return "en"; }
}
function setLang(v) { memLang = v; try { localStorage.setItem("hz-lang", v); } catch {} document.documentElement.lang = v; }
const t = (en, ko) => (getLang() === "ko" ? ko : en);

// Slide in the current language (Korean fields live under slide.ko).
function tr(slide) {
  if (getLang() !== "ko" || !slide.ko) return slide;
  const k = slide.ko;
  const out = { ...slide, ...k };
  delete out.ko;
  if (slide.interaction) {
    const ki = k.interaction || {};
    out.interaction = { ...slide.interaction, ...ki };
    if (slide.interaction.options) out.interaction.options = slide.interaction.options.map((o) => ({ ...o, label: (ki.options && ki.options[o.value]) || o.label }));
    if (slide.interaction.categories) out.interaction.categories = slide.interaction.categories.map((c) => ({ ...c, label: (ki.categories && ki.categories[c.id]) || c.label }));
    if (slide.interaction.fields) out.interaction.fields = slide.interaction.fields.map((f) => ({ ...f, ...((ki.fields && ki.fields[f.id]) || {}) }));
  }
  return out;
}

// Instrument name / alias in the current language ("Cello 2" → "첼로 2").
function insName(id) { const i = instrumentById(id); return i ? t(i.name, i.ko) : ""; }
function insFamily(id) { const i = instrumentById(id); return i ? t(i.family, i.familyKo) : ""; }
function aliasText(alias, id) {
  const i = instrumentById(id);
  return i && alias ? alias.replace(i.name, t(i.name, i.ko)) : alias || t("Guest", "손님");
}

// ---------- Credit card payoff ----------
// Simulates month by month. Minimum payment = 1% of balance + that month's interest, at least $25.
function cardPayoff(balance, aprPct, payment) {
  const r = Math.max(0, aprPct) / 100 / 12;
  let bal = Math.max(0, balance), months = 0, interest = 0;
  while (bal > 0.005 && months < 1200) {
    const i = bal * r;
    const pay = payment == null ? Math.max(25, bal * 0.01 + i) : payment;
    if (pay <= i) return { months: Infinity, interest: Infinity };
    interest += i; bal = bal + i - pay; months++;
  }
  return { months, interest };
}

function calculator(t) {
  const money = (n) => (isFinite(n) ? "$" + Math.round(n).toLocaleString("en-US") : "—");
  const dur = (m) => !isFinite(m) ? t("Never (payment too small)", "갚을 수 없음 (납부액이 너무 적음)")
    : m >= 24 ? t(`${(m / 12).toFixed(1)} years`, `${(m / 12).toFixed(1)}년`) : t(`${m} months`, `${m}개월`);
  const field = (label, val, step) => {
    const input = h("input", { class: "input", type: "number", inputmode: "decimal", min: "0", step, value: String(val) });
    return [h("label", { class: "field" }, h("span", { text: label }), input), input];
  };
  const [fb, bal] = field(t("Card balance ($)", "카드 잔액 ($)"), 5000, "100");
  const [fa, apr] = field(t("Interest rate (APR %)", "연 이자율 (APR %)"), 24, "0.1");
  const [fp, pay] = field(t("What I can pay each month ($)", "매달 갚을 수 있는 금액 ($)"), 300, "10");
  const out = h("div", { class: "calc-out" });
  const run = () => {
    const b = +bal.value || 0, a = +apr.value || 0, p = +pay.value || 0;
    const mn = cardPayoff(b, a, null), fx = cardPayoff(b, a, p);
    out.replaceChildren(
      h("div", { class: "calc-row" }, h("span", { text: t("Minimum payments only", "최소 납부액만") }), h("b", { text: dur(mn.months) }), h("small", { text: t(`Interest ${money(mn.interest)}`, `이자 ${money(mn.interest)}`) })),
      h("div", { class: "calc-row strong" }, h("span", { text: t(`Paying ${money(p)} a month`, `매달 ${money(p)}씩`) }), h("b", { text: dur(fx.months) }), h("small", { text: t(`Interest ${money(fx.interest)}`, `이자 ${money(fx.interest)}`) })));
  };
  [bal, apr, pay].forEach((i) => i.addEventListener("input", run));
  run();
  return h("div", { class: "calc" }, h("div", { class: "calc-in" }, fb, fa, fp), out,
    h("p", { class: "calc-note", text: t("Minimum payment assumed: 1% of the balance plus interest, at least $25. Your card may differ.", "최소 납부액 가정: 잔액의 1% + 이자, 최소 $25. 카드사마다 다를 수 있어요.") }));
}

// ---------- Compound growth (retirement) ----------
function futureValue(monthly, annualPct, years) {
  const r = annualPct / 100 / 12, n = Math.max(0, Math.round(years * 12));
  return r === 0 ? monthly * n : monthly * ((Math.pow(1 + r, n) - 1) / r);
}

function compoundCalc(t) {
  const money = (n) => "$" + Math.round(n).toLocaleString("en-US");
  const field = (label, val, step) => {
    const input = h("input", { class: "input", type: "number", inputmode: "decimal", min: "0", step, value: String(val) });
    return [h("label", { class: "field" }, h("span", { text: label }), input), input];
  };
  const [f1, monthly] = field(t("Save each month ($)", "매달 저축 ($)"), 300, "50");
  const [f2, start] = field(t("Start age", "시작 나이"), 25, "1");
  const [f3, retire] = field(t("Retire at", "은퇴 나이"), 65, "1");
  const [f4, rate] = field(t("Yearly return (%)", "연 수익률 (%)"), 6, "0.5");
  const out = h("div", { class: "calc-out" });
  const run = () => {
    const m = +monthly.value || 0, s = +start.value || 0, rt = +retire.value || 0, r = +rate.value || 0;
    const yrs = Math.max(0, rt - s), late = Math.max(0, yrs - 10);
    const fv = futureValue(m, r, yrs), fvLate = futureValue(m, r, late);
    out.replaceChildren(
      h("div", { class: "calc-row strong" }, h("span", { text: t(`Start at ${s} · ${yrs} years`, `${s}세 시작 · ${yrs}년`) }), h("b", { text: money(fv) }),
        h("small", { text: t(`You put in ${money(m * yrs * 12)}; growth adds ${money(fv - m * yrs * 12)}`, `넣은 돈 ${money(m * yrs * 12)} · 불어난 돈 ${money(fv - m * yrs * 12)}`) })),
      h("div", { class: "calc-row" }, h("span", { text: t(`Start 10 years later (${s + 10}) · ${late} years`, `10년 늦게 시작 (${s + 10}세) · ${late}년`) }), h("b", { text: money(fvLate) }),
        h("small", { text: t(`You put in ${money(m * late * 12)}`, `넣은 돈 ${money(m * late * 12)}`) })));
  };
  [monthly, start, retire, rate].forEach((i) => i.addEventListener("input", run));
  run();
  return h("div", { class: "calc" }, h("div", { class: "calc-in", style: "grid-template-columns:repeat(4,minmax(0,1fr))" }, f1, f2, f3, f4), out,
    h("p", { class: "calc-note", text: t("Example only: assumes the same monthly amount and a steady yearly return, before taxes and inflation.", "예시일 뿐이에요: 매달 같은 금액, 일정한 수익률을 가정하며 세금과 인플레이션은 빼고 계산했어요.") }));
}

// A small Web Audio orchestra.
//
// Each instrument has its own part in one short, original 5-bar piece
// (D – Bm – G – A – D). Played alone, a part can sound simple; played
// together, the parts make a whole. Sounds are synthesized in the browser,
// so no audio files are required.
//
// Want real recordings instead? Drop licensed clips into /public/audio/
// named after the instrument id (e.g. audio/oboe.mp3, audio/tuba.m4a).
// When a file exists it is used instead of the synthesizer.

const BPM = 84;
const BEAT = 60 / BPM;
const CHORDS = [[50, 54, 57], [47, 50, 54], [43, 47, 50], [45, 49, 52], [50, 54, 57]]; // D Bm G A D
const MELODY = [
  [66, 69, 74, 69], [71, 69, 66, 62], [67, 71, 74, 76], [73, 71, 69, 73],
];

// Notes are [startBeat, lengthInBeats, midi, velocity]
function part(id) {
  const n = [];
  const bars = (fn) => CHORDS.forEach((c, b) => fn(c, b * 4, b));
  const melody = (shift = 0, from = 0) => {
    MELODY.forEach((bar, b) => { if (b >= from) bar.forEach((m, i) => n.push([b * 4 + i, 1, m + shift, 0.8])); });
    n.push([16, 4, 74 + shift, 0.8]);
  };
  switch (id) {
    case "violin": melody(0); break;
    case "oboe": melody(0); break;
    case "flute": melody(12, 2); break;
    case "trumpet":
      n.push([7, 1, 66, 0.6], [15, 1, 69, 0.7], [16, 4, 74, 0.8]); break;
    case "viola": bars((c, s) => { for (let i = 0; i < 8; i++) n.push([s + i / 2, 0.5, (i % 2 ? c[2] : c[1]) + 12, 0.45]); }); break;
    case "clarinet": bars((c, s) => n.push([s, 2, c[1] + 12, 0.5], [s + 2, 2, c[2] + 12, 0.5])); break;
    case "horn": bars((c, s) => n.push([s, 4, c[2], 0.5])); break;
    case "trombone": bars((c, s) => n.push([s, 4, c[1], 0.45])); break;
    case "cello": bars((c, s) => n.push([s, 2, c[0] - 12, 0.6], [s + 2, 2, c[2] - 12, 0.55])); break;
    case "bassoon": bars((c, s) => { for (let i = 0; i < 4; i++) n.push([s + i, 0.9, (i % 2 ? c[2] : c[0]) - 12, 0.5]); }); break;
    case "bass": bars((c, s) => n.push([s, 4, low(c[0]), 0.7])); break;
    case "tuba": bars((c, s, b) => { if (b % 2 === 0) n.push([s, 4, low(c[0]), 0.6]); }); break;
    case "timpani": bars((c, s, b) => { n.push([s, 2, c[0] - 12 < 38 ? c[0] : c[0] - 12, 0.9]); if (b < 4) n.push([s + 2, 2, 45, 0.6]); }); break;
    case "harp": bars((c, s, b) => {
      const arp = [c[0], c[1], c[2], c[0] + 12, c[1] + 12, c[2] + 12, c[0] + 24, c[2] + 12];
      if (b === 4) { [c[0], c[1], c[2], c[0] + 12, c[1] + 12, c[2] + 12].forEach((m, i) => n.push([s + i * 0.12, 4, m + 12, 0.5])); return; }
      arp.forEach((m, i) => n.push([s + i / 2, 1.5, m + 12, 0.45]));
    }); break;
  }
  return n;
}

// Bass register: one or two octaves down, staying around D1–D2.
function low(m) { m -= 12; return m > 40 ? m - 12 : m; }

const freq = (m) => 440 * Math.pow(2, (m - 69) / 12);

function env(g, t, a, peak, d, rel) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.setValueAtTime(peak, t + Math.max(a, d - rel));
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
}

function vibrato(ctx, osc, t, f, depth = 0.004, rate = 5.4) {
  const lfo = ctx.createOscillator(), lg = ctx.createGain();
  lfo.frequency.value = rate;
  lg.gain.setValueAtTime(0, t);
  lg.gain.linearRampToValueAtTime(f * depth, t + 0.35);
  lfo.connect(lg).connect(osc.frequency);
  return lfo; // started together with the voice's other nodes
}

let noiseBuf = null;
function noise(ctx) {
  if (noiseBuf) return noiseBuf;
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}

function voice(ctx, out, id, midi, t, dur, vel) {
  const f = freq(midi);
  const g = ctx.createGain();
  g.connect(out);
  const nodes = [];
  const osc = (type, fr, detune = 0) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = fr; o.detune.value = detune; nodes.push(o); return o; };
  const filter = (type, fr, q = 0.7) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = fr; b.Q.value = q; return b; };
  const v = vel * 0.22;

  if (["violin", "viola", "cello", "bass"].includes(id)) {
    const lp = filter("lowpass", Math.min(f * 7, 6000), 0.9);
    const o1 = osc("sawtooth", f, -6), o2 = osc("sawtooth", f, 7);
    o1.connect(lp); o2.connect(lp); lp.connect(g);
    nodes.push(vibrato(ctx, o1, t, f), vibrato(ctx, o2, t, f));
    env(g, t, id === "bass" ? 0.12 : 0.09, v * (id === "bass" ? 1.2 : 0.8), dur, 0.18);
  } else if (id === "harp") {
    const o1 = osc("triangle", f), o2 = osc("sine", f * 2);
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o1.connect(g); o2.connect(g2).connect(g);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v * 1.1, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(dur, 2.2));
  } else if (id === "flute") {
    const o = osc("sine", f), o2 = osc("triangle", f);
    const g2 = ctx.createGain(); g2.gain.value = 0.18;
    o.connect(g); o2.connect(g2).connect(g); nodes.push(vibrato(ctx, o, t, f, 0.005, 5));
    const n = ctx.createBufferSource(); n.buffer = noise(ctx); n.loop = true;
    const bp = filter("bandpass", f * 2, 1.5), ng = ctx.createGain(); ng.gain.value = 0.05;
    n.connect(bp).connect(ng).connect(g); nodes.push(n);
    env(g, t, 0.06, v * 0.9, dur, 0.12);
  } else if (id === "oboe") {
    const o = osc("sawtooth", f);
    const bp = filter("bandpass", 1300, 1.6), hp = filter("highpass", f * 0.9);
    o.connect(hp).connect(bp).connect(g); nodes.push(vibrato(ctx, o, t, f, 0.003, 5.6));
    env(g, t, 0.04, v * 1.6, dur, 0.1);
  } else if (id === "clarinet") {
    const o = osc("square", f); const lp = filter("lowpass", f * 4);
    o.connect(lp).connect(g); env(g, t, 0.05, v * 0.55, dur, 0.12);
  } else if (id === "bassoon") {
    const o = osc("sawtooth", f); const lp = filter("lowpass", f * 3.2), bp = filter("peaking", 480, 2); bp.gain.value = 6;
    o.connect(lp).connect(bp).connect(g); env(g, t, 0.03, v * 0.8, dur, 0.08);
  } else if (["horn", "trumpet", "trombone", "tuba"].includes(id)) {
    const bright = { horn: 3, trumpet: 9, trombone: 5, tuba: 2.6 }[id];
    const o = osc("sawtooth", f); const lp = filter("lowpass", f * 1.2, 1.2);
    lp.frequency.setValueAtTime(f * 1.2, t); lp.frequency.exponentialRampToValueAtTime(Math.min(f * bright, 9000), t + 0.09);
    lp.frequency.exponentialRampToValueAtTime(Math.min(f * bright * 0.7, 9000), t + 0.4);
    o.connect(lp).connect(g);
    if (id !== "tuba") nodes.push(vibrato(ctx, o, t, f, 0.002, 5));
    env(g, t, 0.05, v * (id === "trumpet" ? 0.75 : id === "tuba" ? 1.3 : 0.9), dur, 0.15);
  } else if (id === "timpani") {
    const o = osc("sine", f * 1.04);
    o.frequency.setValueAtTime(f * 1.04, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.15);
    o.connect(g);
    const n = ctx.createBufferSource(); n.buffer = noise(ctx);
    const lp = filter("lowpass", 900), ng = ctx.createGain();
    ng.gain.setValueAtTime(v * 1.2, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    n.connect(lp).connect(ng).connect(out); nodes.push(n);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v * 3, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    dur = 1.7;
  }
  nodes.forEach((n) => { n.start(t); n.stop(t + dur + 0.2); });
  return nodes;
}

function impulse(ctx, seconds = 2.4) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
  }
  return buf;
}

class Orchestra {
  constructor() { this.ctx = null; this.active = []; this.timer = null; this.files = {}; this.onend = null; }

  async init(ids) {
    // Optional recordings dropped into /public/audio/ (listed by the server).
    try {
      const files = [];
      for (const id of ids) { const f = files.find((n) => n.replace(/\.[^.]+$/, "") === id); if (f) this.files[id] = `/audio/${f}`; }
    } catch {}
  }

  setup() {
    if (this.ctx) return;
    const ctx = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = ctx.createGain(); this.master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    const verb = ctx.createConvolver(); verb.buffer = impulse(ctx);
    const wet = ctx.createGain(); wet.gain.value = 0.28;
    this.bus = ctx.createGain();
    this.bus.connect(this.master); this.bus.connect(verb).connect(wet).connect(this.master);
    this.master.connect(comp).connect(ctx.destination);
  }

  get duration() { return 20 * BEAT + 1.5; }

  stop() {
    clearTimeout(this.timer);
    for (const n of this.active) { try { n.stop ? n.stop() : n.pause(); } catch {} }
    this.active = [];
  }

  play(ids) {
    this.stop();
    this.setup();
    this.ctx.resume();
    const t0 = this.ctx.currentTime + 0.08;
    // In a full ensemble, quieten each part a little.
    const out = this.ctx.createGain(); out.gain.value = ids.length > 1 ? 0.55 : 1; out.connect(this.bus);
    for (const id of ids) {
      if (this.files[id]) {
        const a = new Audio(this.files[id]); a.play().catch(() => {}); this.active.push(a); continue;
      }
      for (const [beat, len, midi, vel] of part(id)) {
        this.active.push(...voice(this.ctx, out, id, midi, t0 + beat * BEAT, len * BEAT * 0.98, vel));
      }
    }
    this.timer = setTimeout(() => { this.active = []; this.onend && this.onend(); }, this.duration * 1000);
  }
}

function escape(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ---------------- Stage ----------------
function startStage() {
  document.body.className = "stage-body";
  document.title = `${t(deck.title, deck.ko.title)} · Hephzibah Academy`;
  app.innerHTML = `
  <header class="topbar">
    <a class="brand" href="#" title="Hephzibah Academy">${LOGO}<span class="brand-name"><b>Hephzibah</b><span>ACADEMY</span></span></a>
    <div class="joinline">${room ? `${t("Join at", "입장:")} <u>${escape(joinHost())}</u><b>${room.code}</b>` : `<span class="muted">${t("Arrow keys to move · N for notes · F for fullscreen", "화살표로 이동 · N 노트 · F 전체 화면")}</span>`}</div>
    <span class="count" id="count">${room ? `<span class="dot"></span><span>0 ${t("joined", "명 입장")}</span>` : ""}</span>
  </header>
  <div class="stage" id="stage"></div>
  <footer class="bottombar">
    <div style="display:flex;align-items:center;gap:16px;flex:1;min-width:0">
