<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My User Manual · Hephzibah Academy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2213%22%20fill%3D%22%23f8f7f3%22%2F%3E%3Cpath%20d%3D%22M10%2022h11v12h17V12h13v41H38V42H21v11H10z%22%20fill%3D%22%23111a2e%22%2F%3E%3C%2Fsvg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Hephzibah Academy — shared design system */
:root {
  --paper: #f8f7f3;
  --paper-2: #efede6;
  --ink: #111a2e;
  --ink-2: #3a4256;
  --muted: #6b7183;
  --rule: #111a2e;
  --hair: rgba(17, 26, 46, 0.14);
  --accent: #f2c230;
  --ok: #1f9d55;
  --radius: 6px;
  --gutter: clamp(16px, 4.2vw, 64px);
  --font: "Plus Jakarta Sans", "Noto Sans KR", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
img, svg { display: block; max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 var(--gutter); }

/* ---------- Header ---------- */
.site-header { border-bottom: 1px solid var(--rule); }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 104px; }
.brand { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 52px; height: 52px; flex: none; }
.brand-name { display: flex; flex-direction: column; line-height: 1; }
.brand-name b { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.brand-name span { font-size: 18px; font-weight: 600; letter-spacing: 0.22em; margin-top: 6px; }
.nav { display: flex; align-items: center; gap: clamp(20px, 3.6vw, 56px); font-size: 17px; font-weight: 500; }
.nav a { text-decoration: none; padding: 6px 0; border-bottom: 1.5px solid transparent; }
.nav a:hover, .nav a[aria-current="page"] { border-bottom-color: var(--ink); }
.nav .divider { width: 1px; height: 28px; background: var(--ink); }
.nav .login { display: inline-flex; align-items: center; gap: 8px; }
.arrow { width: 0.9em; height: 0.9em; flex: none; }
.menu-btn { display: none; background: none; border: 1px solid var(--hair); border-radius: var(--radius); padding: 8px 12px; cursor: pointer; }

@media (max-width: 760px) {
  .site-header .wrap { min-height: 76px; }
  .brand-mark { width: 38px; height: 38px; }
  .brand-name b { font-size: 22px; }
  .brand-name span { font-size: 13px; }
  .menu-btn { display: block; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 76px; flex-direction: column; align-items: stretch; gap: 0;
    background: var(--paper); border-bottom: 1px solid var(--rule); padding: 8px var(--gutter) 16px; z-index: 10; }
  .nav.open { display: flex; }
  .nav a { padding: 14px 0; border-bottom: 1px solid var(--hair); }
  .nav .divider { display: none; }
  .site-header { position: relative; }
}

/* ---------- Type ---------- */
.eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; margin: 0 0 28px; }
.display { font-size: clamp(46px, 8.2vw, 122px); line-height: 0.98; letter-spacing: -0.045em; font-weight: 800; margin: 0; }
.h2 { font-size: clamp(32px, 4.4vw, 60px); line-height: 1.05; letter-spacing: -0.035em; font-weight: 800; margin: 0; }
.h3 { font-size: clamp(22px, 2.2vw, 30px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 700; margin: 0; }
.lead { font-size: clamp(19px, 2vw, 30px); line-height: 1.4; color: var(--ink); margin: 28px 0 0; font-weight: 400; }
.muted { color: var(--muted); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 36px; border-radius: var(--radius);
  background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600; font-size: 18px; border: 1px solid var(--ink);
  cursor: pointer; transition: transform .15s ease, background .15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--paper-2); }
.btn.small { padding: 11px 20px; font-size: 15px; }

/* ---------- Hero ---------- */
.hero .wrap { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 40px; padding-top: clamp(56px, 10vh, 120px); padding-bottom: clamp(56px, 12vh, 128px); }
.hero .vertical { writing-mode: vertical-rl; font-size: 14px; letter-spacing: 0.34em; font-weight: 600; border-left: 1px solid var(--ink);
  padding-left: 28px; align-self: start; height: 384px; display: flex; align-items: center; }
.hero .cta { margin-top: 52px; }
@media (max-width: 760px) { .hero .vertical { display: none; } .hero .wrap { grid-template-columns: 1fr; } }

/* ---------- Pillars ---------- */
.pillars { border-top: 1px solid var(--rule); }
.pillars .wrap { display: grid; grid-template-columns: repeat(3, 1fr); }
.pillar { padding: 28px 24px 32px 0; display: flex; gap: 22px; align-items: baseline; }
.pillar .num { font-size: 16px; font-weight: 600; letter-spacing: 0.18em; }
.pillar h3 { font-size: clamp(24px, 2.4vw, 34px); letter-spacing: -0.02em; margin: 0; font-weight: 700; }
.pillar p { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; max-width: 30ch; }
@media (max-width: 760px) { .pillars .wrap { grid-template-columns: 1fr; } .pillar { border-bottom: 1px solid var(--hair); } }

/* ---------- Sections ---------- */
.section { border-top: 1px solid var(--rule); padding: clamp(56px, 9vw, 120px) 0; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 48px; }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(32px, 6vw, 96px); }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
.prose p { font-size: 19px; line-height: 1.65; margin: 0 0 18px; color: var(--ink-2); max-width: 62ch; }
.quote { font-size: clamp(22px, 2.4vw, 32px); line-height: 1.35; letter-spacing: -0.015em; font-weight: 500; margin: 0; }
.quote cite { display: block; margin-top: 18px; font-style: normal; font-size: 14px; letter-spacing: 0.24em; text-transform: uppercase; font-weight: 600; }

/* ---------- Lecture cards ---------- */
.tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; padding: 6px 10px;
  border: 1px solid var(--ink); border-radius: 999px; }
.tag.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: 1px; }
.card { display: grid; grid-template-columns: auto 1fr auto; gap: clamp(20px, 4vw, 56px); align-items: start; padding: 36px 0;
  border-top: 1px solid var(--rule); text-decoration: none; color: inherit; }
.card:last-child { border-bottom: 1px solid var(--rule); }
.card .num { font-size: 16px; font-weight: 600; letter-spacing: 0.18em; padding-top: 10px; }
.card h3 { font-size: clamp(30px, 3.6vw, 52px); letter-spacing: -0.035em; line-height: 1.05; margin: 12px 0 10px; font-weight: 800; }
.card p { margin: 0; color: var(--ink-2); max-width: 60ch; font-size: 17px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 18px; font-size: 14px; color: var(--muted); font-weight: 500; }
.card .go { width: 56px; height: 56px; border: 1px solid var(--ink); border-radius: 50%; display: grid; place-items: center; transition: background .15s, color .15s; }
a.card:hover .go { background: var(--ink); color: var(--paper); }
.card.disabled { opacity: .5; }
@media (max-width: 760px) { .card { grid-template-columns: 1fr; } .card .go { display: none; } }

.tabs { display: flex; gap: 10px; flex-wrap: wrap; }
.tabs button { background: transparent; border: 1px solid var(--ink); border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 15px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tabs button:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- Footer ---------- */
.site-footer { border-top: 1px solid var(--rule); }
.site-footer .wrap { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-top: 28px; padding-bottom: 32px;
  font-size: 14px; letter-spacing: 0.1em; font-weight: 500; }
.site-footer .right { letter-spacing: 0.22em; text-transform: uppercase; }

/* ---------- Forms ---------- */
.field { display: block; margin-bottom: 18px; }
.field > span { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px; }
.input, textarea.input { width: 100%; background: #fff; border: 1px solid var(--hair); border-radius: var(--radius); padding: 14px 16px; font-size: 17px; }
.input:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px rgba(17,26,46,.12); }
textarea.input { resize: vertical; min-height: 104px; line-height: 1.45; }
.error { color: #b42318; font-size: 15px; margin: 10px 0 0; min-height: 1.4em; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* Instrument badge (score abbreviation, tinted by family) */
.avatar { --size: 44px; width: var(--size); height: var(--size); border-radius: 50%; flex: none; display: inline-grid; place-items: center; background: var(--ink); color: var(--paper); line-height: 1;
  font-weight: 700; font-size: calc(var(--size) * 0.38); letter-spacing: -0.01em; font-style: italic; font-family: Georgia, "Times New Roman", serif; }
.avatar[data-family="strings"] { background: #1d3a6b; }
.avatar[data-family="woodwinds"] { background: #2f6b4f; }
.avatar[data-family="brass"] { background: #a8741a; }
.avatar[data-family="percussion"] { background: #8e3b2e; }

/* Light and Salt */
.verse p { margin: 0; }
.salt-light { display: grid; grid-template-columns: 1fr 1fr; margin-top: 40px; border-top: 1px solid var(--rule); }
.salt-light > div { padding: 22px 24px 0 0; }
.salt-light .num { font-size: 13px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
.salt-light p { margin: 8px 0 0; color: var(--ink-2); font-size: 16px; max-width: 34ch; }
@media (max-width: 600px) { .salt-light { grid-template-columns: 1fr; } }
.hero-ref { margin: 28px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
.hero-ref a { text-decoration: none; border-bottom: 1px solid currentColor; }
.card[hidden] { display: none; }

/* Hephzibah × Beulah lockup */
.lockup { display: flex; align-items: center; gap: clamp(18px, 3vw, 36px); flex-wrap: wrap; }
.lk { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.lk-mark { width: 30px; height: 30px; flex: none; }
.lk-name { display: flex; flex-direction: column; line-height: 1; }
.lk-name b { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.lk-name span { font-size: 10px; font-weight: 600; letter-spacing: 0.22em; margin-top: 4px; }
.lk-sep { width: 1px; height: 30px; background: var(--ink); }
.lockup.big .lk-mark { width: 48px; height: 48px; }
.lockup.big .lk-name b { font-size: 28px; }
.lockup.big .lk-name span { font-size: 13px; margin-top: 6px; }
.lockup.big .lk-sep { height: 48px; }
.site-footer .footer-brands { padding-top: 32px; padding-bottom: 0; }

/* Town on a hill illustration */
.hill-art { width: 100%; max-width: 420px; height: auto; color: var(--ink); margin-top: clamp(28px, 4vw, 48px); overflow: visible; }
.hill-art .glow { transform-origin: 240px 132px; animation: glow 4.5s ease-in-out infinite; }
.hill-art .rays { animation: rays 4.5s ease-in-out infinite; }
@keyframes glow { 50% { transform: scale(1.12); opacity: .75; } }
@keyframes rays { 50% { opacity: .2; } }
.mission { margin: 24px 0 0; font-size: clamp(18px, 1.6vw, 22px); line-height: 1.5; color: var(--ink-2); max-width: 36ch; }
.mission b { color: var(--ink); }

/* Yellow light accents */
.brand-mark .lamp, .lk-mark .lamp { fill: var(--accent); filter: drop-shadow(0 0 2.5px rgba(214, 235, 0, 0.95)); }
.spark { display: inline-block; width: 0.13em; height: 0.13em; margin-left: 0.12em; border-radius: 50%;
  background: var(--accent); animation: blink 3s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

/* Hephzibah & Beulah names (Isaiah 62:4) */
.names2 { margin: 8px 0 0; border-top: 1px solid var(--rule); }
.names2 > div { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: baseline; gap: 24px; padding: clamp(18px, 3vw, 36px) 0; border-bottom: 1px solid var(--rule); }
.names2 dt { font-size: clamp(52px, 9vw, 140px); font-weight: 800; letter-spacing: -0.05em; line-height: 0.95; }
.names2 dd { margin: 0; font-size: clamp(18px, 2vw, 28px); color: var(--ink-2); letter-spacing: -0.01em; }
.names2-verse { margin: 28px 0 0; max-width: 60ch; color: var(--muted); font-size: 16px; }
.names2-verse cite { font-style: normal; font-weight: 700; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; margin-left: 8px; }
@media (max-width: 640px) { .names2 > div { grid-template-columns: 1fr; gap: 8px; } }
.names2 .heb { display: block; margin-top: 12px; font-size: 18px; font-weight: 500; letter-spacing: 0; color: var(--muted); font-family: "Noto Sans Hebrew", "Arial Hebrew", "David", var(--font); direction: rtl; text-align: left; unicode-bidi: isolate; }
.names2-lead { margin: 32px 0 0; font-size: clamp(20px, 2vw, 28px); font-weight: 700; letter-spacing: -0.02em; }
.names2-lead + .names2-verse { margin-top: 10px; }
.spark.sm { width: 0.45em; height: 0.45em; margin-left: 0; vertical-align: 0.05em; }

/* Language toggle */
.lang-btn { background: transparent; border: 1px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.lang-btn:hover { background: var(--ink); color: var(--paper); }
html[lang="ko"] body { word-break: keep-all; }
@media (max-width: 760px) { .nav .lang-btn { margin-top: 12px; align-self: flex-start; } }
.names2-lead { max-width: 40ch; }

/* Navigation: tighter on mid widths, collapse to the Menu button below 1080px */
.nav a { white-space: nowrap; }
@media (max-width: 1320px) { .nav { gap: 24px; font-size: 16px; } }
@media (max-width: 1080px) {
  .site-header { position: relative; }
  .menu-btn { display: block; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; align-items: stretch; gap: 0;
    background: var(--paper); border-bottom: 1px solid var(--rule); padding: 8px var(--gutter) 16px; z-index: 10; }
  .nav.open { display: flex; }
  .nav a { padding: 14px 0; border-bottom: 1px solid var(--hair); }
  .nav .divider { display: none; }
  .nav .lang-btn { margin-top: 12px; align-self: flex-start; }
}
.later { margin: 14px 0 0; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.card:has(+ .later) { border-bottom: 1px solid var(--rule); }

/* About: Hephzibah + Beulah pairing */
.names2 dd { display: grid; gap: 6px; }
.names2 .nm-mean { font-size: clamp(20px, 2vw, 28px); color: var(--ink); letter-spacing: -0.01em; }
.names2 .nm-tag { font-size: 16px; color: var(--ink-2); }
.names2 .nm-role { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.names2 > .names2-plus { display: block; border-bottom: 0; padding: 0; margin: -14px 0; font-size: 28px; font-weight: 300; color: var(--muted); line-height: 1; }
.names2 > .names2-plus { display: grid; place-items: center; width: 34px; height: 34px; margin: -17px 0; position: relative; z-index: 1;
  border: 1px solid var(--rule); border-radius: 50%; background: var(--paper); font-size: 20px; font-weight: 400; color: var(--ink); }
.names2 > .names2-plus { grid-template-columns: 1fr; gap: 0; padding: 0; line-height: 1; }
.avatar[data-family="bible"] { background-color: var(--paper-2); background-size: 400% 300%; background-repeat: no-repeat; border: 1px solid var(--hair); }

/* ---------- Presenter stage ---------- */
body.stage-body { height: 100vh; height: 100dvh; overflow: hidden; }
body.stage-body #app { height: 100%; display: flex; flex-direction: column; }
.topbar, .bottombar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 clamp(16px, 2.6vw, 40px); flex: none; }
.topbar { height: 64px; border-bottom: 1px solid var(--rule); }
.bottombar { height: 60px; border-top: 1px solid var(--rule); font-size: 14px; }
.topbar .brand-mark { width: 30px; height: 30px; }
.topbar .brand-name b { font-size: 18px; }
.topbar .brand-name span { font-size: 10px; margin-top: 3px; }
.joinline { font-size: clamp(14px, 1.3vw, 20px); font-weight: 500; text-align: center; }
.joinline b { font-weight: 800; letter-spacing: 0.14em; background: var(--ink); color: var(--paper); padding: 2px 10px; border-radius: 4px; margin-left: 6px; }
.count { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(31,157,85,.15); }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
.ctl { background: transparent; border: 1px solid var(--hair); border-radius: var(--radius); padding: 7px 12px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; }
.ctl:hover { border-color: var(--ink); }
.ctl[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ctl .badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: #c2410c; color: #fff; font-size: 12px; margin-left: 4px; }
.progress { position: relative; height: 2px; background: var(--hair); flex: 1; max-width: 260px; }
.progress i { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.slide-pos { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: 0.12em; }

.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.slide { position: absolute; inset: 0; padding: clamp(28px, 5vh, 72px) clamp(24px, 5vw, 96px); display: grid; animation: slideIn .45s ease both; }
@keyframes slideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.slide .eyebrow { font-size: clamp(12px, 1.1vw, 16px); margin-bottom: clamp(16px, 3vh, 36px); }
.slide .title { font-size: clamp(36px, 6.2vw, 112px); line-height: 1.02; letter-spacing: -0.045em; font-weight: 800; margin: 0; }
.slide.compact .title { font-size: clamp(30px, 4.2vw, 76px); }
.slide .subtitle { font-size: clamp(17px, 1.9vw, 32px); line-height: 1.35; margin: clamp(16px, 3vh, 32px) 0 0; color: var(--ink-2); max-width: 40ch; }
.slide .content { align-self: center; min-width: 0; }
.slide .accent { width: 120px; height: 3px; background: var(--ink); margin-top: clamp(20px, 4vh, 44px); }

.blist { list-style: none; padding: 0; margin: clamp(20px, 4vh, 48px) 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); border-top: 1px solid var(--rule); }
.blist li { padding: 18px 20px 18px 0; display: flex; gap: 16px; align-items: baseline; font-size: clamp(17px, 1.7vw, 28px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
.blist li span { font-size: 0.6em; letter-spacing: 0.16em; font-weight: 600; color: var(--muted); }
.reframe { margin-top: clamp(20px, 4vh, 48px); border-top: 1px solid var(--rule); }
.reframe div { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--hair); font-size: clamp(18px, 2vw, 34px); font-weight: 600; letter-spacing: -0.015em; }
.reframe .from { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.photo-slot { border: 1px dashed var(--muted); border-radius: var(--radius); display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); min-height: 40vh; }

/* Split layout: prompt + live wall */
.slide.split-live { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.25fr); gap: clamp(24px, 4vw, 72px); }
.wall-wrap { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--rule); padding-left: clamp(20px, 3vw, 48px); }
.wall-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; padding-bottom: 14px; }
.wall { flex: 1; min-height: 0; overflow-y: auto; columns: 2 260px; column-gap: 16px; scrollbar-width: thin; padding-bottom: 12px; }
.msg { break-inside: avoid; background: #fff; border: 1px solid var(--hair); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; position: relative;
  animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: none; } }
.msg p { margin: 0 0 12px; font-size: clamp(17px, 1.55vw, 26px); line-height: 1.32; font-weight: 500; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.msg .who { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.msg .x { position: absolute; top: 8px; right: 8px; border: 0; background: var(--paper-2); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; opacity: 0; }
.msg:hover .x, .msg .x:focus-visible { opacity: 1; }
.wall-empty { color: var(--muted); font-size: clamp(16px, 1.4vw, 22px); padding: 40px 0; column-span: all; }

/* Poll */
.poll { display: grid; gap: clamp(10px, 1.6vh, 18px); }
.poll .opt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; font-size: clamp(16px, 1.6vw, 26px); font-weight: 600; }
.poll .bar { grid-column: 1 / -1; height: 12px; background: var(--paper-2); border-radius: 999px; overflow: hidden; }
.poll .bar i { display: block; height: 100%; background: var(--ink); border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.poll .num { font-variant-numeric: tabular-nums; color: var(--muted); }

/* Cover QR */
.qr-box { background: #fff; border: 1px solid var(--hair); border-radius: 14px; padding: 18px; width: min(34vh, 320px); }
.qr-box svg { width: 100%; height: auto; }
.qr-cap { text-align: center; margin-top: 12px; font-weight: 600; font-size: 15px; }
.qr-cap b { letter-spacing: 0.14em; }

/* Orchestra */
.orch { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: clamp(16px, 3vh, 32px); }
.inst { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #fff; border: 1px solid var(--hair); border-radius: 12px; cursor: pointer; text-align: left; transition: transform .15s, border-color .15s, box-shadow .15s; }
.inst:hover { border-color: var(--ink); transform: translateY(-2px); }
.inst.playing { border-color: var(--ink); box-shadow: 0 0 0 3px var(--ink); }
.inst.playing .avatar { animation: beat .71s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.12); } }
.inst b { display: block; font-size: 16px; }
.inst small { color: var(--muted); font-size: 12px; font-weight: 600; }
.orch-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

/* Video */
.slide.video { grid-template-rows: auto minmax(0, 1fr); gap: 16px; padding-top: clamp(16px, 3vh, 32px); padding-bottom: clamp(16px, 3vh, 32px); }
.video-frame { position: relative; min-height: 0; display: grid; place-items: center; }
.video-frame iframe { width: 100%; height: 100%; max-height: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; background: #000; }

/* Overlays / drawers */
.overlay { position: fixed; inset: 0; background: rgba(248,247,243,.97); display: grid; place-items: center; z-index: 30; }
.overlay[hidden], .drawer[hidden] { display: none; }
.overlay .big { display: grid; grid-template-columns: auto 1fr; gap: 6vw; align-items: center; padding: 5vw; }
.overlay .big .qr-box { width: min(60vh, 520px); }
.drawer { position: fixed; top: 64px; right: 0; bottom: 60px; width: min(460px, 92vw); background: var(--paper); border-left: 1px solid var(--rule); z-index: 20; overflow-y: auto; padding: 24px; box-shadow: -20px 0 40px rgba(17,26,46,.06); }
.drawer h3 { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; margin: 0 0 12px; }
.drawer .notes p { font-size: 17px; line-height: 1.55; margin: 0 0 14px; }
.drawer .pending .msg { animation: none; }
.drawer .pending .row { display: flex; gap: 8px; }

/* Setup screen */
.setup { max-width: 560px; margin: 0 auto; padding: 8vh var(--gutter); }

@media (max-width: 860px) {
  .slide.split-live { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .wall-wrap { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 16px; }
  .joinline { display: none; }
  .controls .hide-sm { display: none; }
}

/* ---------- Audience phone ---------- */
body.phone { min-height: 100dvh; }
.phone-head { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; }
.phone-head .me { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.phone-head .code { font-size: 12px; letter-spacing: 0.2em; font-weight: 700; color: var(--muted); }
.phone-main { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
.phone-main .eyebrow { font-size: 12px; margin-bottom: 12px; letter-spacing: .24em; }
.phone-title { font-size: 30px; line-height: 1.08; letter-spacing: -0.035em; font-weight: 800; margin: 0 0 10px; }
.phone-sub { color: var(--ink-2); margin: 0 0 22px; font-size: 16px; }
.panel { background: #fff; border: 1px solid var(--hair); border-radius: 14px; padding: 18px; margin-top: 18px; }
.panel h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: -0.01em; }
.panel p { margin: 0 0 12px; color: var(--ink-2); font-size: 15px; }
.stack { display: grid; gap: 10px; }
.choice { display: block; width: 100%; text-align: left; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--hair); background: #fff; font-size: 17px; font-weight: 600; cursor: pointer; }
.choice[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.full { width: 100%; }
.sent { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.sent li { font-size: 15px; background: var(--paper-2); border-radius: 10px; padding: 10px 12px; }
.sent li small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.reveal { text-align: center; padding: 6vh 0 2vh; }
.reveal .avatar { margin: 0 auto 22px; animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
.reveal h1 { font-size: 40px; letter-spacing: -0.04em; margin: 4px 0 6px; line-height: 1; }
.stars { display: flex; gap: 6px; }
.stars button { font-size: 32px; line-height: 1; border: 0; background: none; cursor: pointer; padding: 4px; color: #c9c7bf; }
.stars button.on { color: var(--ink); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-2); margin: 6px 0 16px; }
.check input { margin-top: 3px; width: 18px; height: 18px; flex: none; }
.result { border-top: 1px solid var(--hair); padding: 16px 0; }
.result:first-child { border-top: 0; padding-top: 0; }
.result .dim { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.result h4 { margin: 4px 0 6px; font-size: 20px; letter-spacing: -0.02em; }
.result dl { margin: 10px 0 0; display: grid; gap: 8px; }
.result dt { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
.result dd { margin: 0; font-size: 15px; color: var(--ink-2); }
.scale { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 8px; }
.scale-bar { position: relative; height: 4px; background: var(--paper-2); border-radius: 4px; margin-top: 6px; }
.scale-bar i { position: absolute; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transform: translateX(-50%); }
.steps-dots { display: flex; gap: 6px; margin-bottom: 18px; }
.steps-dots i { height: 3px; flex: 1; background: var(--hair); border-radius: 3px; }
.steps-dots i.on { background: var(--ink); }

/* Quiz (swipe cards) */
.quiz { position: fixed; inset: 0; background: var(--paper); z-index: 40; display: flex; flex-direction: column; }
.quiz[hidden] { display: none; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--hair); font-weight: 600; font-size: 14px; }
.quiz-top button { background: none; border: 0; font-weight: 600; cursor: pointer; padding: 6px; }
.quiz-progress { height: 3px; background: var(--hair); }
.quiz-progress i { display: block; height: 100%; background: var(--ink); transition: width .3s; }
.quiz-body { flex: 1; display: grid; place-items: center; padding: 20px 16px; overflow: hidden; }
.qcard { width: min(100%, 460px); min-height: 300px; background: #fff; border: 1px solid var(--hair); border-radius: 18px; padding: 28px 24px; box-shadow: 0 18px 40px rgba(17,26,46,.08);
  display: flex; flex-direction: column; justify-content: space-between; touch-action: pan-y; user-select: none; cursor: grab; position: relative; }
.qcard .qn { font-size: 12px; font-weight: 700; letter-spacing: .2em; color: var(--muted); }
.qcard .qt { font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: -0.02em; margin: 18px 0; }
.qcard .hint { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; }
.qcard .stamp { position: absolute; top: 18px; padding: 4px 10px; border: 2px solid; border-radius: 6px; font-weight: 800; letter-spacing: .1em; opacity: 0; font-size: 14px; }
.qcard .stamp.yes { right: 18px; color: var(--ok); }
.qcard .stamp.no { left: 18px; color: #b42318; }
.quiz-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px 16px 6px; max-width: 520px; margin: 0 auto; width: 100%; }
.quiz-actions button { padding: 14px 6px; border-radius: 12px; border: 1px solid var(--ink); background: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
.quiz-actions button.sel { background: var(--ink); color: var(--paper); }
.quiz-sub { display: flex; justify-content: space-between; padding: 6px 16px 18px; max-width: 520px; margin: 0 auto; width: 100%; }
.quiz-sub button { background: none; border: 0; color: var(--muted); font-weight: 600; cursor: pointer; padding: 8px 4px; text-decoration: underline; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 10px; font-size: 15px; z-index: 60; max-width: 90vw; }
.ctl .badge[hidden] { display: none; }
.orch { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); }
/* Fit a 16:9 player inside whatever space the slide leaves */
.video-frame { height: 100%; container-type: size; }
.video-frame iframe { width: min(100cqw, 100cqh * 16 / 9); height: min(100cqh, 100cqw * 9 / 16); max-height: none; aspect-ratio: auto; }

/* Card payoff calculator */
.calc { display: grid; gap: 14px; margin-top: 18px; max-width: 720px; }
.calc-in { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.calc-in .field { margin: 0; }
.calc-out { display: grid; gap: 8px; }
.calc-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 16px; padding: 14px 16px; border: 1px solid var(--hair); border-radius: 10px; background: #fff; }
.calc-row b { font-size: clamp(20px, 2vw, 30px); letter-spacing: -0.02em; text-align: right; }
.calc-row small { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
.calc-row.strong { border-color: var(--ink); }
.calc-note { margin: 0; color: var(--muted); font-size: 13px; }
@media (max-width: 640px) { .calc-in { grid-template-columns: 1fr; } }
.est { display: grid; gap: 10px; }
.est-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: center; }
.est-row.head { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.est-row .input { padding: 10px 12px; font-size: 16px; }
.est-diff { font-weight: 700; font-variant-numeric: tabular-nums; }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checks label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--hair); border-radius: 10px; background: #fff; cursor: pointer; }
.checks input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--ink); flex: none; }
.checks label:has(input:checked) span { text-decoration: line-through; color: var(--muted); }
@media (max-width: 900px) { .calc-in[style] { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }

":"choice","prompt":"What’s taking up most of your mind lately?","options":[{"value":"future","label":"My future & career"},{"value":"study","label":"School & grades"},{"value":"relationships","label":"Friends & relationships"},{"value":"money","label":"Money & stability"},{"value":"identity","label":"Who I really am"},{"value":"unsure","label":"I’m not sure yet"}]},"notes":["Tapping might feel easier than talking. Pick the one thing weighing on you most right now.","No names needed. “Not sure yet” is fine, and so is just thinking about it.","Read out two or three of the results. Don’t ask who picked what. Connect it: “I wrestled with that too.”"],"ko":{"section":"01 질문","eyebrow":"첫 번째 질문","title":"요즘 머릿속을\n가장 많이 차지하는 건?","subtitle":"정답 없이, 지금 내 마음에 가까운 것 하나.","body":[],"notes":["말하기보다 눌러 보는 게 조금 덜 부담스러울 수 있죠. 지금 가장 마음에 걸리는 것을 하나 골라 주세요.","이름을 적을 필요는 없습니다. 아직 잘 모르겠다는 답도 괜찮고, 그냥 생각만 해도 괜찮습니다.","공유된 답이 있으면 두세 가지만 읽습니다. 누가 어떤 답을 골랐는지 묻지 않습니다. '저도 이런 고민을 했어요'라고 연결합니다."],"interaction":{"prompt":"요즘 머릿속을 가장 많이 차지하는 건?","options":{"future":"진로와 미래","study":"공부와 성적","relationships":"친구와 관계","money":"돈과 안정","identity":"나는 어떤 사람인지","unsure":"아직 잘 모르겠어요"}}}},{"id":"s03","section":"01 Questions","kind":"intro","eyebrow":"Nice to meet you — I’m Joseph","title":"Pharmacist. Company.\nKenya. And a student again.","subtitle":"“So… what exactly do you do?”","body":["Pharmacist","10 years running a company","24 trips to Kenya","Back in school these days"],"notes":["I’m a pharmacist, and I’ve been running a company for ten years. I’ve been to Kenya 24 times, and these days I’m back in school.","You might be thinking, “What does this guy actually do?” [Pause] But all of these are connected by one question that started when I was in college.","Don’t present the numbers as achievements — keep it short, and make them curious about how different experiences connect."],"ko":{"section":"01 질문","eyebrow":"반가워요, 저는 손원규입니다","title":"약사. 회사. 케냐.\n그리고 다시 학생.","subtitle":"“도대체 뭐 하는 사람이에요?”","body":["약사","회사를 운영한 지 10년","케냐에 다녀온 횟수 24번","요즘은 다시 학교에"],"notes":["저는 약사이고, 회사를 운영한 지 10년이 되었습니다. 케냐에는 24번 다녀왔고, 요즘은 다시 학교에 다니고 있습니다.","이렇게 들으면 '도대체 뭐 하는 사람이야?' 싶으실 수 있죠. [한 박자 쉬기] 그런데 이 이야기들은 제가 대학생 때 시작한 질문 하나로 연결되어 있어요.","숫자를 성취의 크기처럼 강조하기보다, 서로 달라 보이는 경험이 어떻게 이어지는지 궁금하게 만드는 소개로 짧게 진행합니다."]}},{"id":"s04","section":"01 Questions","kind":"question","eyebrow":"Back when I was in college","title":"But…\nwhy should I?","subtitle":"Study, money, a career. The question behind all of it.","body":["Why do I study?","Why do I earn money?","Why do I want that job?","What do I actually want?"],"notes":["I heard it all the time: study hard, get a good job, make money. Then at some point, a question showed up — “Why?”","That doesn’t mean study or money don’t matter. I just started wondering why they mattered to me, and what I really wanted.","Have you ever asked something like that? Don’t ask for answers — just give them a moment to think."],"ko":{"section":"01 질문","eyebrow":"대학생이었던 저에게","title":"그런데,\n왜 해야 하지?","subtitle":"공부도, 돈도, 직업도. 그 뒤에 있던 질문.","body":["왜 공부할까?","왜 돈을 벌까?","왜 그 일을 하고 싶을까?","나는 무엇을 원할까?"],"notes":["공부를 잘하고, 좋은 직업을 갖고, 돈을 벌어야 한다는 말은 정말 많이 들었어요. 그런데 어느 순간 '왜?'라는 질문이 생겼습니다.","공부나 돈이 중요하지 않다는 뜻은 아닙니다. 나에게 왜 중요한지, 내가 정말 원하는 것이 무엇인지 궁금해진 거예요.","여러분도 비슷한 질문을 해 본 적이 있나요? 대답을 요구하지 않고 잠깐 생각할 시간을 줍니다."]}},{"id":"s05","section":"01 Questions","kind":"path","eyebrow":"Imagining my future self","title":"If I get into a good school,\nthen what?","subtitle":"What does the day I dream about actually look like?","body":["School","Job","Money","The day after that"],"notes":["Right now, college and grades might feel like a huge mountain. Wanting a good school and a good job is natural.","But after you reach that goal — what do you want each morning to look like? What will you do, who will you spend time with, what will you treasure?","This isn’t a quiz about job titles. It’s about imagining the life you want. Don’t assume college is the only path."],"ko":{"section":"01 질문","eyebrow":"앞으로의 나를 상상하면","title":"좋은 학교에 가면,\n그다음은?","subtitle":"내가 꿈꾸는 하루는 어떤 모습일까?","body":["학교","직업","돈","그다음의 하루"],"notes":["지금은 입시나 성적이 눈앞의 큰 산처럼 느껴질 수 있어요. 좋은 학교와 좋은 직업을 바라는 마음도 자연스럽습니다.","그런데 그 목표를 이루고 난 다음, 매일 아침 일어나 살아갈 하루는 어떤 모습이면 좋을까요? 무슨 일을 하고, 누구와 시간을 보내고, 무엇을 소중하게 여기고 싶을까요?","직업 이름을 맞히는 퀴즈가 아니라, 내가 바라는 삶을 떠올리는 질문이라고 설명합니다. 대학 진학을 유일한 길로 전제하지 않습니다."]}},{"id":"s06","section":"01 Questions","kind":"statement","eyebrow":"The question that stopped me","title":"Do I work to live?\nOr live to work?","subtitle":"Someday, looking back — what kind of life do I want to say it was?","body":[],"notes":["I pictured it: make money, get a place, buy clothes, buy a car, go back to work. And this question came up.","Am I working in order to live, or living in order to work? When I look back at the end, what do I want to remain?","[Pause 3 seconds] The question didn’t lead straight to an answer. But I couldn’t just walk past it."],"ko":{"section":"01 질문","eyebrow":"멈춰 서게 만든 질문","title":"살아가기 위해 일할까?\n일하기 위해 살아갈까?","subtitle":"언젠가 돌아봤을 때, 어떤 삶이었다고 말하고 싶을까?","body":[],"notes":["돈을 벌고, 집을 구하고, 옷을 사고, 차를 사고, 다시 일하는 모습을 상상했습니다. 그러다가 이 질문이 생겼어요.","나는 살아가기 위해 일하는 걸까, 일을 하기 위해 살아가는 걸까? 마지막에 내 삶을 돌아보면 무엇이 남으면 좋을까?","[3초 멈춤] 이 질문이 바로 답으로 이어지지는 않았어요. 하지만 그냥 지나치기는 어려웠습니다."]}},{"id":"s07","section":"02 A different scene","kind":"number","eyebrow":"Carrying that question","title":"So for a while,\nI stopped.","subtitle":"I took a year off from school.","body":["Time spent stepping off the expected path"],"notes":["I took a one-year leave from school and stepped off the road I’d always been on.","That doesn’t mean you need to take time off or travel far. In my story, that pause became a chance to look more deeply at the question.","Before moving to Kenya, lightly ask: “Has anyone here been to Kenya?” — a quick show of hands, not a formal activity."],"ko":{"section":"02 다른 장면","eyebrow":"질문을 안고","title":"그래서 잠깐,\n멈췄습니다.","subtitle":"학교를 1년 쉬었습니다.","body":["정해진 길에서 잠시 벗어나 본 시간"],"notes":["저는 학교를 1년 휴학했습니다. 늘 가던 방향에서 잠시 벗어나 보게 되었어요.","여러분도 휴학을 하거나 멀리 떠나야 한다는 뜻은 아닙니다. 제 이야기에서는 그 멈춤이 질문을 더 깊이 들여다보는 계기가 되었어요.","케냐로 넘어가기 전에 '혹시 케냐에 가 본 사람 있나요?' 하고 가볍게 손을 들어 보도록 합니다. 두 번째 정식 입력 활동으로 세지 않는 짧은 현장 대화입니다."]}},{"id":"s08","section":"02 A different scene","kind":"photo","eyebrow":"KENYA","title":"A small room in Kenya,\nand a big question.","subtitle":"I started to see the things I took for granted in a new way.","body":[],"photo":{"label":"Your own photo from Kenya","note":"Optional. Use only your own photo; don’t show identifiable children without consent. Without a photo, this slide works as text."},"notes":["[If you have your own photo, show it] Where I was, there was a small room, a single bed, and not enough to eat.","Seeing that, I started rethinking things I’d taken for granted. If there’s no photo, describe one real scene you remember in your own words.","Don’t generalize about all of Kenya. Keep it to the people and places you actually met."],"ko":{"section":"02 다른 장면","eyebrow":"KENYA","title":"케냐에서 만난\n작은 방과 큰 질문.","subtitle":"내가 당연하게 여겼던 것들을 다시 보게 되었습니다.","body":[],"notes":["[본인 사진이 있으면 보여 주며] 제가 만난 환경에는 작은 방, 침대 하나, 충분하지 않은 먹을 것이 있었습니다.","그 상황을 보면서 제가 당연하게 생각하던 것들을 다시 돌아보게 되었어요. 사진이 없다면 실제로 기억하는 한 장면을 자신의 말로 묘사합니다.","케냐 전체가 같은 환경이라고 일반화하지 않습니다. 직접 만난 사람과 장소에 관한 이야기로 한정합니다."],"photo":{"label":"직접 촬영한 케냐 사진","note":"실제 경험을 보여 줄 수 있는 사진 1장을 넣습니다. 동의 없이 식별 가능한 아동 사진을 공개하지 않고, 없으면 이 장은 텍스트만으로 진행합니다. 다른 사람의 사진을 발표자의 실제 경험처럼 사용하지 않습니다."}}},{"id":"s09","section":"02 A different scene","kind":"statement","eyebrow":"The scene that stayed with me","title":"The children’s laughter\nstayed with me.","subtitle":"Watching them, a question began to grow in my heart, too.","body":["When am I happiest?"],"notes":["The surroundings were a shock, but what stayed with me longest was those kids laughing together.","That doesn’t mean being poor makes you happier. Hardship needed help. But in the time I spent with those kids, I began to look again at what I thought happiness was.","My circumstances couldn’t fully explain my heart. So, when am I happiest? That’s how my question changed."],"ko":{"section":"02 다른 장면","eyebrow":"오래 마음에 남은 장면","title":"아이들의 웃음이\n오래 남았습니다.","subtitle":"그 아이들을 보며, 제 마음에도 질문이 생겼습니다.","body":["나는 언제 가장 행복하지?"],"notes":["환경도 충격이었지만, 제 마음에 오래 남은 것은 함께 웃던 아이들의 모습이었습니다.","가난하면 더 행복하다는 뜻은 아니에요. 어려움에는 도움이 필요했습니다. 다만 그 아이들과 함께한 시간 속에서, 저는 제가 무엇을 행복이라고 생각해 왔는지 돌아보게 됐어요.","내가 가진 조건만으로 내 마음을 다 설명할 수는 없겠구나. 그러면 나는 언제 가장 행복하지? 그렇게 질문이 바뀌었습니다."]}},{"id":"s10","section":"02 A different scene","kind":"text-input","eyebrow":"Question two · 45 seconds","title":"When do you feel\nmost alive — most like you?","subtitle":"It doesn’t have to be a big moment.","body":["A moment you lost track of time","A moment you laughed with someone","A moment you helped, even a little"],"interaction":{"type":"text","prompt":"When do you feel most alive — most like you?","placeholder":"e.g. Laughing with friends while playing basketball","maxLength":180},"notes":["Think of a recent moment when you lost track of time. Sports, drawing, gaming, listening to a friend, resting alone — all fine.","Type it in a few words. If nothing comes to mind, write something you’d like to try. [Wait 45 seconds]","Read a few answers from the screen — no names. For me, I found I’m happiest spending time with kids, helping someone, and sharing. Your answer can be different from mine."],"ko":{"section":"02 다른 장면","eyebrow":"두 번째 질문 · 45초","title":"언제,\n나답게 살아 있다고 느껴요?","subtitle":"대단한 순간이 아니어도 좋아요.","body":["시간 가는 줄 몰랐던 순간","누군가와 함께 웃었던 순간","작게라도 도움이 되었던 순간"],"notes":["최근에 시간 가는 줄 몰랐던 순간 하나를 떠올려 보세요. 운동, 그림, 게임, 친구의 이야기를 듣는 일, 혼자 쉬는 시간도 괜찮아요.","지금 떠오르는 장면을 짧게 적어 봅니다. 기억이 잘 안 나면 '앞으로 해 보고 싶은 것'을 적어도 괜찮습니다. [45초 기다리기]","원하는 사람의 문장만 이름 없이 함께 봅니다. 저는 아이들과 시간을 보내고, 누군가를 돕고, 나누는 순간에 행복을 느낀다는 것을 알아갔습니다. 여러분의 답은 제 답과 달라도 괜찮아요."],"interaction":{"prompt":"언제, 나답게 살아 있다고 느껴요?","placeholder":"예: 친구와 농구하면서 한참 웃었을 때"}}},{"id":"s11","section":"03 The user manual","kind":"objects","eyebrow":"Another question","title":"Everything that’s made\nis made for a reason.","subtitle":"A chair. A smartphone. A car.","body":["So what about me?"],"notes":["A chair is made for sitting; a car for getting around. Whoever made it had a purpose in mind.","So what kind of person am I? What if there were a manual that helped me understand myself better? That’s what I started to wonder.","We’ll make clear on the value slide that this isn’t about judging people like objects. For now, keep it a short, curiosity-opening question."],"ko":{"section":"03 사용설명서","eyebrow":"또 하나의 질문","title":"만들어진 것에는\n만든 이유가 있죠.","subtitle":"의자. 스마트폰. 자동차.","body":["그렇다면, 나는?"],"notes":["의자는 앉을 수 있도록, 자동차는 이동할 수 있도록 만들어졌죠. 만든 사람이 생각한 쓰임이 있습니다.","그런데 나는 어떤 사람일까? 나를 더 잘 이해할 수 있는 설명서가 있다면 어떨까? 그런 생각이 들었어요.","사람을 물건처럼 평가하려는 비유가 아님을 뒤의 가치 슬라이드에서 분명히 합니다. 지금은 호기심을 여는 질문으로 짧게 진행합니다."]}},{"id":"s12","section":"03 The user manual","kind":"phone","eyebrow":"Imagine this for a second","title":"What if you only used\nyour phone as a calculator?","subtitle":"The more you know it, the more you see what it can do.","body":["How well do I actually know myself?"],"notes":["What if you bought a smartphone and only ever used the calculator? It’d calculate great — but you’d be missing a lot. [Leave room for a laugh]","I wondered if I was judging myself after knowing only a tiny part of me — what I like, what interests me, what gives me energy.","Don’t pressure them to “unlock every potential.” Connect it to the joy of getting to know yourself."],"ko":{"section":"03 사용설명서","eyebrow":"잠깐 상상해 봐요","title":"스마트폰을\n계산기로만 쓴다면?","subtitle":"더 알아갈수록, 할 수 있는 일도 보이겠죠.","body":["나는 나에 대해 얼마나 알고 있을까?"],"notes":["스마트폰을 샀는데 계산기로만 쓰고 있다면 어떨까요? 계산은 아주 잘 되겠지만, 아직 모르는 기능이 정말 많겠죠. [짧게 웃을 여유]","저도 제 자신을 아주 조금만 알고 평가하고 있던 것은 아닐까 생각했습니다. 내가 무엇을 좋아하고, 무엇에 관심을 갖고, 언제 힘을 얻는 사람인지요.","'모든 가능성을 다 발휘해야 한다'는 부담을 주지 않고, 나를 알아가는 즐거움으로 연결합니다."]}},{"id":"s13","section":"03 The user manual","kind":"contrast","eyebrow":"Even in the same house","title":"Why are we\nall so different?","subtitle":"Personality, talents, the things we love.","body":["What do you think?"],"notes":["Even looking at my younger sibling, I was amazed. People look different, think differently, love different things.","Instead of ranking those differences, what if we got to know them? Maybe there are parts of me I don’t know yet.","[Pause 5 seconds] Have them silently think of one way they’re like the person next to them, and one way they’re different. No sharing required."],"ko":{"section":"03 사용설명서","eyebrow":"같은 집에서도 이렇게 다른데","title":"왜 우리는\n이렇게 다를까요?","subtitle":"성격도, 재능도, 좋아하는 것도.","body":["여러분은 어떻게 생각하세요?"],"notes":["저는 제 동생을 보면서도 참 신기했어요. 사람들은 이렇게 다르게 생겼고, 다르게 생각하고, 다른 것을 좋아하잖아요.","그 차이를 줄 세우는 대신, 알아가 볼 수는 없을까 생각했습니다. 내 안에도 아직 내가 잘 모르는 면이 있지 않을까요?","[5초 멈춤] 옆 사람과 닮은 점, 다른 점 하나를 마음속으로 떠올리게 합니다. 공개 발표는 요구하지 않습니다."]}},{"id":"s14","section":"03 The user manual","kind":"money","eyebrow":"The way I saw money changed","title":"The same $100.\nA different weight.","subtitle":"I started asking not just how much I have, but where it goes.","body":["Helping someone learn","Where treatment is needed","Protecting someone’s today"],"notes":["Money matters. We need it to care for family, get treatment, and build a life.","But $100 as I thought of it in the U.S., and $100 when I faced someone’s need in Kenya, felt different to me. The same money can mean something different depending on where it goes.","Don’t present $100 as a price that solves tuition or medical bills. Share only a specific example you actually experienced. Don’t ask students to give."],"ko":{"section":"03 사용설명서","eyebrow":"돈을 보는 눈도 달라졌습니다","title":"같은 100달러.\n다르게 느껴진 무게.","subtitle":"얼마를 갖는가와 함께, 어디에 쓰는가를 생각하게 됐습니다.","body":["배움을 돕는 데","치료가 필요한 곳에","누군가의 오늘을 지키는 데"],"notes":["돈은 중요합니다. 가족을 돌보고, 필요한 치료를 받고, 삶을 꾸려 가는 데 꼭 필요하죠.","그런데 미국에서 생각하던 100달러와 케냐에서 누군가의 필요를 마주하며 생각한 100달러는 제게 다르게 느껴졌습니다. 같은 돈이어도 어디에 쓰이느냐에 따라 의미가 달라질 수 있겠구나 싶었어요.","학비나 병원비를 100달러로 반드시 해결할 수 있다는 가격 정보로 설명하지 않습니다. 본인이 직접 경험한 구체적인 사례가 있다면 그 사례만 짧게 이야기합니다. 학생에게 기부를 요구하지 않습니다."]}},{"id":"s15","section":"03 The user manual","kind":"turn","eyebrow":"Back to school, then to work","title":"The work continued —\nbut the reason changed.","subtitle":"I graduated from pharmacy school and started a company.","body":["Caring for my family","Working with meaning","A life of sharing"],"notes":["I went back to school, graduated from pharmacy school, and started a company. From the outside, studying and working looked about the same.","But the reason I held onto changed. Instead of only looking at money, I started thinking about caring for family, working meaningfully, and sharing.","[Slowly] When the reason I live changed, the same work felt different."],"ko":{"section":"03 사용설명서","eyebrow":"다시 학교로, 그리고 일터로","title":"하던 일은 이어졌지만,\n하는 이유가 달라졌습니다.","subtitle":"약대를 졸업하고, 회사를 시작했습니다.","body":["가족을 돌보는 일","의미 있게 일하는 것","누군가와 나누는 삶"],"notes":["저는 학교로 돌아왔고, 약대를 졸업했고, 회사를 시작했습니다. 겉으로 보면 공부하고 일하는 모습은 비슷했을 수 있어요.","하지만 그 안에서 붙잡는 이유가 달라졌습니다. 돈만을 바라보던 데서, 가족을 돌보고 의미 있게 일하고 나누는 삶을 함께 생각하게 되었어요.","[천천히] 살아가는 이유가 바뀌니, 같은 일도 다르게 다가왔습니다."]}},{"id":"s16","section":"03 The user manual","kind":"reframe-examples","eyebrow":"Getting to know myself","title":"Even the parts I didn’t like\nhad another side.","subtitle":"Depending on the situation, they could be used differently.","body":[{"trait":"I’m shy","possibility":"I notice how people feel"},{"trait":"I’m interested in everything","possibility":"I try new things"},{"trait":"I get scared easily","possibility":"I prepare well"}],"notes":["I used to think of myself as ordinary, or not much. But as I got to know myself, some things looked different.","Shyness sometimes helped me notice people’s hearts. Lots of interests led to new attempts. Fear sometimes made me prepare more.","This doesn’t mean every struggle automatically becomes a strength. It’s okay to get help with hard things. The point: don’t define yourself by one weakness."],"ko":{"section":"03 사용설명서","eyebrow":"나를 알아간다는 것","title":"내가 아쉬워하던 모습에도\n다른 면이 있었습니다.","subtitle":"상황에 따라, 다르게 쓰일 수 있더라고요.","body":[{"trait":"부끄럼이 많다","possibility":"사람의 마음을 더 살핀다"},{"trait":"관심이 많다","possibility":"새로운 것을 시도한다"},{"trait":"겁이 많다","possibility":"충분히 준비한다"}],"notes":["저는 제 자신을 평범하거나 별로인 사람이라고 생각하기도 했습니다. 그런데 조금씩 알아가다 보니 다르게 보이는 면이 있었어요.","부끄러움이 사람의 마음을 살피는 계기가 되기도 하고, 여러 관심이 새로운 시도로 이어지기도 했습니다. 두려움이 준비를 더 하게 만드는 때도 있었고요.","모든 어려움이 자동으로 장점이 된다는 뜻은 아닙니다. 힘든 부분에는 도움을 받아도 괜찮습니다. 여기서는 나를 한 가지 단점으로만 단정하지 말자는 의미로 전합니다."]}},{"id":"s17","section":"03 The user manual","kind":"reframe-input","eyebrow":"Question three · 60 seconds","title":"Take one part of you —\nand look from another angle.","subtitle":"You don’t have to force it into something positive.","body":["When might it actually help?","What kind of help would be good?"],"interaction":{"type":"text","prompt":"One part of me, seen from another angle:","placeholder":"e.g. I decide slowly — but I look carefully at things that matter.","maxLength":180},"notes":["Pick one part of yourself you’re a little disappointed in. You don’t need to share a big struggle — an example is fine.","Write one line: when it might help, or what help you’d need to feel more at ease. [Wait 60 seconds]","Don’t evaluate shared answers — just receive them: “That’s a great way to see it.” Don’t force a positive conclusion on anyone who couldn’t find one."],"ko":{"section":"03 사용설명서","eyebrow":"세 번째 질문 · 60초","title":"내 모습 하나를,\n다른 각도에서 보면?","subtitle":"억지로 좋게 바꾸지 않아도 괜찮아요.","body":["어떤 때에는 도움이 될까?","어떤 도움이 있으면 좋을까?"],"notes":["내가 조금 아쉽게 느끼는 모습 하나를 골라 봅시다. 큰 고민을 공개할 필요는 없어요. 예시를 골라도 괜찮습니다.","그 모습이 도움이 되는 때가 있는지, 또는 내가 더 편안해지려면 어떤 도움이 필요한지 한 줄 적어 보세요. 혼자 생각하기 어렵다면 옆 사람과 가벼운 예시를 이야기해도 좋아요. [60초 기다리기]","공유된 답은 평가하지 않고 '그렇게 볼 수도 있겠네요'라고 받아 줍니다. 답을 못 찾은 학생에게 긍정적인 결론을 강요하지 않습니다."],"interaction":{"prompt":"내 모습 하나를, 다른 각도에서 보면?","placeholder":"예: 결정이 느려도 중요한 일을 신중하게 살펴볼 수 있어요"}}},{"id":"s18","section":"03 The user manual","kind":"faith-statement","eyebrow":"Something I really want to add","title":"Before God,\nyou are already precious.","subtitle":"Even if you don’t know what you’re good at yet. Even if you don’t have a clear dream.","body":["Our worth isn’t decided by grades or usefulness."],"notes":["Looking for your user manual doesn’t mean you have to become useful to be loved. A person’s worth isn’t decided by how much they get done.","The faith I want to share here is that God knows us and loves us. You — right now, even before you can explain your dreams or gifts — are precious.","Don’t present this as a direct Bible quote. Say it slowly, so the “function” metaphor never limits anyone’s worth."],"ko":{"section":"03 사용설명서","eyebrow":"이 이야기에 꼭 덧붙이고 싶은 말","title":"하나님 앞에서\n너는 이미 소중한 사람이야.","subtitle":"아직 잘하는 일을 몰라도. 지금 뚜렷한 꿈이 없어도.","body":["우리의 가치는 성적이나 쓸모로 정해지지 않습니다."],"notes":["사용설명서를 찾자는 말이, 쓸모 있는 사람이 되어야 사랑받는다는 뜻은 아닙니다. 우리가 무엇을 얼마나 해내느냐로 사람의 가치가 정해지는 것은 아니에요.","교회에서 여러분과 나누고 싶은 믿음은, 하나님께서 우리를 아시고 사랑하신다는 것입니다. 아직 꿈이나 재능을 설명하지 못하는 지금의 여러분도 소중합니다.","이 문장은 성경의 직접 인용문으로 표시하지 않습니다. 기능의 비유가 사람의 가치를 제한하지 않도록 충분히 천천히 전합니다."]}},{"id":"s19","section":"03 The user manual","kind":"faith-practice","eyebrow":"This is how I want to ask","title":"“God,\nwho am I?”","subtitle":"Reading Scripture, praying, and talking with people I trust.","body":["Psalm 139:14 · Thankful to be wonderfully made","Ephesians 2:10 · An invitation to good works"],"notes":["In Scripture we meet the confession that we are made by God, and an invitation toward good works. The lines on screen are summaries, not direct quotes.","I use “user manual” less to mean my whole career is written on one page, and more as a picture of getting to know myself, little by little, before God.","We can ask through Scripture and prayer, and by talking with trusted adults and friends who know us. It’s okay if the answer doesn’t come all at once."],"ko":{"section":"03 사용설명서","eyebrow":"저는 이렇게 질문하고 싶습니다","title":"“하나님,\n저는 어떤 사람인가요?”","subtitle":"말씀을 읽고, 기도하고, 믿을 만한 사람과 이야기하며.","body":["시편 139:14 · 지으심을 감사하는 고백","에베소서 2:10 · 선한 일을 향한 초대"],"notes":["우리는 성경에서 하나님이 지으신 존재라는 고백과, 선한 일을 향한 초대를 만납니다. 화면의 문장은 성경 구절의 요약이지 직접 인용은 아닙니다.","저는 사용설명서라는 말을, 평생의 진로가 한 장에 다 적혀 있다는 뜻보다 하나님 앞에서 나를 조금씩 알아가는 비유로 사용하고 싶어요.","말씀을 읽고 기도하면서, 또 나를 잘 아는 믿을 만한 어른이나 친구와 이야기하면서 질문해 볼 수 있습니다. 답이 한 번에 들리지 않아도 괜찮습니다. 작은 경험을 통해 알아갈 수도 있어요."]}},{"id":"s20","section":"04 One next step","kind":"testimony","eyebrow":"Looking back on the last 10 years","title":"It’s been a grateful decade —\nand I’m excited for the next.","subtitle":"Because little by little, I’m learning why I live and who I am.","body":[],"notes":["Over the last ten years — studying, working, running a company — there were failures and a lot happened. Looking back, it was a truly happy and grateful time.","Because I moved from only asking what I should do to holding onto why, and I slowly learned what makes me happy.","Be careful not to suggest you must be perfectly happy every day, or that anxiety comes from a lack of faith. Close with: “So I’m excited for the next ten years, too.”"],"ko":{"section":"04 다음 한 걸음","eyebrow":"지난 10년을 돌아보면","title":"감사한 시간이었고,\n다음 10년도 기대됩니다.","subtitle":"왜 살아가는지, 어떤 사람인지 조금씩 알아가고 있기 때문입니다.","body":[],"notes":["지난 10년 동안 공부하고, 일하고, 회사를 운영하면서 실패도 있었고 많은 일이 있었습니다. 그 시간을 돌아보면 제게는 정말 행복하고 감사한 시간이었습니다.","무엇을 해야 하는가만 생각하던 데서 왜 해야 하는가를 붙잡게 되었고, 무엇을 할 때 행복한 사람인지 조금씩 알아가게 되었기 때문입니다.","지금도 매일 완벽하게 행복해야 한다는 메시지가 되지 않도록 주의합니다. 현재 불안하거나 힘든 마음이 믿음이나 목적이 부족해서라고 연결하지 않습니다. '그래서 앞으로의 10년도 기대됩니다'로 마무리합니다."]}},{"id":"s21","section":"04 One next step","kind":"statement","eyebrow":"After hearing my story","title":"Your path\nmay look different.","subtitle":"Your surroundings, personality, gifts and dreams are different.","body":["Today: not one answer, but one question about you."],"notes":["My story isn’t an answer that applies to you exactly. We all have different circumstances, personalities, gifts and dreams.","Not everyone needs to start a business or go to Kenya. Start your own questions right where you live.","Add that it’s okay to still be figuring it out — so no one leaves thinking, “If I don’t have an answer now, am I too late?”"],"ko":{"section":"04 다음 한 걸음","eyebrow":"오늘 제 이야기를 듣고","title":"여러분의 길은\n또 다를 수 있습니다.","subtitle":"환경도, 성격도, 재능도, 꿈도 다르니까요.","body":["오늘은 답 하나보다, 나를 향한 질문 하나."],"notes":["제 이야기가 여러분에게 그대로 적용되는 정답은 아닙니다. 우리는 환경도 성격도 재능도 꿈도 다르니까요.","모두가 사업을 하거나 케냐에 가야 하는 것은 아닙니다. 여러분이 살아가는 곳에서, 여러분만의 질문을 시작해 보면 좋겠습니다.","'지금 답이 없으면 늦은 건가?'라는 부담이 남지 않도록, 아직 알아가는 중이어도 괜찮다는 말을 덧붙입니다."]}},{"id":"s22","section":"04 One next step","kind":"questions","eyebrow":"Questions worth coming back to","title":"What kind of life\ndo I want to live?","subtitle":"One at a time. Slowly.","body":["Why do I study?","Where do I want my money to go?","What am I good at?","When do I feel joy?","What kind of neighbor do I want to be?","Who am I before God?"],"notes":["You don’t need to solve these today. If one of them sticks with you, start with that one.","When choosing a career, we can look beyond titles and conditions and ask what kind of life we want.","Next, we’ll write down what comes to mind right now — a first page you can rewrite later."],"ko":{"section":"04 다음 한 걸음","eyebrow":"앞으로도 다시 꺼내 볼 질문","title":"나는 어떤 삶을\n살고 싶을까?","subtitle":"하나씩, 천천히.","body":["나는 왜 공부할까?","돈은 어디에 쓰고 싶을까?","나는 무엇을 잘할까?","언제 기쁨을 느낄까?","어떤 이웃이 되고 싶을까?","하나님 앞에서 나는 어떤 사람일까?"],"notes":["이 질문들을 오늘 다 해결할 필요는 없습니다. 그중 하나가 마음에 남는다면, 그 하나부터 붙잡아도 좋습니다.","직업을 고를 때도 이름이나 조건만 보지 않고, 어떤 삶을 살고 싶은지 함께 물어볼 수 있겠죠.","다음 장에서 지금 떠오르는 것을 짧게 적어 보고, 나중에 다시 고쳐 쓸 수 있는 첫 페이지를 만들어 봅니다."]}},{"id":"s23","section":"04 One next step","kind":"worksheet","eyebrow":"Question four · 2 minutes","title":"My user manual:\npage one.","subtitle":"Write only what you know now. It’s okay if it changes later.","body":[],"interaction":{"type":"private","prompt":"My user manual · page one","privacy":"This stays on your phone. It never appears on the big screen.","fields":[{"id":"joy","label":"Moments my heart lights up","placeholder":"What makes you feel a little happier or more at ease?"},{"id":"strength","label":"Something I’m good at, or want to try more","placeholder":"Small things and things you’re still learning count."},{"id":"value","label":"What I treasure","placeholder":"People, relationships, values, ways I want to help…"},{"id":"question","label":"A question I want to keep asking","placeholder":"To myself, to God, or to someone I trust"}]},"notes":["This isn’t a test that judges you. It’s a short record of how you understand yourself right now.","If you don’t know what you’re good at, write something people often ask you for, or something that feels easy for you. People and values you treasure are good clues too. [Wait 2 minutes]","This page stays private. Mention they can download it on their phone, and that filling in just one or two boxes is fine."],"ko":{"section":"04 다음 한 걸음","eyebrow":"네 번째 질문 · 2분","title":"나의 사용설명서\n첫 페이지.","subtitle":"지금 아는 만큼만 적어도 좋아요. 나중에 바뀌어도 괜찮아요.","body":[],"notes":["이건 여러분을 판정하는 검사가 아닙니다. 지금의 내가 나를 어떻게 이해하고 있는지 남기는 짧은 기록이에요.","잘하는 일을 잘 모르겠다면 사람들이 나에게 종종 부탁하는 일이나, 해 보면 조금 편한 일을 적어 보세요. 소중하게 생각하는 사람이나 가치도 좋은 단서입니다. [2분 기다리기]","이 장은 개인 기록으로 둡니다. 모두에게 보여 줄 필요는 없습니다. 다운로드하거나 자신의 기기에 저장할 수 있다면 방법을 짧게 안내하고, 한두 칸만 채웠어도 괜찮다고 말해 줍니다."],"interaction":{"prompt":"나의 사용설명서 첫 페이지","privacy":"내 기록으로 남겨요. 공개 화면에는 올라가지 않아요.","fields":{"joy":{"label":"내 마음이 밝아지는 순간","placeholder":"어떤 일을 할 때 조금 즐겁거나 편안한가요?"},"strength":{"label":"내가 잘하거나 더 해 보고 싶은 것","placeholder":"작은 일도, 아직 배우고 있는 일도 괜찮아요."},"value":{"label":"내가 소중하게 여기는 것","placeholder":"사람, 관계, 가치, 돕고 싶은 일…"},"question":{"label":"앞으로 붙잡고 싶은 질문","placeholder":"나에게, 하나님께, 믿을 만한 사람에게 묻고 싶은 것"}}}}},{"id":"s24","section":"04 One next step","kind":"commitment","eyebrow":"Question five · 60 seconds","title":"This week —\nwhat’s one thing you could try?","subtitle":"One small experiment in getting to know yourself.","body":["Listen to a friend for 10 minutes","Spend 20 minutes on something I love","Ask a trusted adult what my strengths are","Pause and ask God a question"],"interaction":{"type":"text","prompt":"This week, I will…","placeholder":"e.g. Ask a teacher I trust what they think I’m good at.","maxLength":160},"notes":["No need to choose a career or make a grand plan. Pick one action small enough to try once this week.","Adding when makes it more concrete. Doing something you already do — on purpose — counts too. Afterwards, notice how it felt. [Wait 60 seconds]","Only share if they want to, without names. Never follow up on whether they kept a public promise, and don’t make sharing a condition of participating."],"ko":{"section":"04 다음 한 걸음","eyebrow":"다섯 번째 질문 · 60초","title":"이번 주,\n한 번 해 볼 수 있는 건?","subtitle":"나를 조금 더 알아가는 작은 시도 하나.","body":["친구의 이야기를 10분 들어 보기","좋아하는 일을 20분 해 보기","믿을 만한 어른에게 내 장점 물어보기","잠깐 멈춰 하나님께 질문해 보기"],"notes":["진로를 정하거나 거창한 계획을 세울 필요는 없습니다. 이번 주 안에 한 번 해 볼 수 있을 만큼 작은 행동을 하나 골라 보세요.","언제 할지도 적으면 조금 더 구체적이겠죠. 이미 하고 있는 일을 의식적으로 다시 해 보는 것도 좋습니다. 해 본 다음 내 마음이 어땠는지 짧게 돌아보면 더 좋고요. [60초 기다리기]","원하면 자신의 다짐만 이름 없이 나눕니다. 공개한 약속을 지켰는지 추궁하거나, 공개를 참여의 조건으로 삼지 않습니다."],"interaction":{"prompt":"이번 주에 나는…","placeholder":"예: 친한 선생님께 제가 잘하는 것을 하나 물어볼래요."}}},{"id":"s25","section":"04 One next step","kind":"prayer","eyebrow":"A moment to pause","title":"God,\nhelp me know who I am.","subtitle":"Valuing who I am now, and taking the next step.","body":["Pray along if you’d like, or simply reflect quietly."],"notes":["First let everyone know they can pray together, or simply reflect quietly.","[Example prayer] God, thank you for knowing and loving us. Help us not to see ourselves only through grades or comparison. Help us discover the ways you made us, ask for help when we need it, and treasure one another. Give us courage for one small step this week. In Jesus’ name, Amen.","Don’t ask for any particular emotion or decision. Leave a short silence after the prayer."],"ko":{"section":"04 다음 한 걸음","eyebrow":"잠깐 멈추는 시간","title":"하나님,\n저를 알아가게 해 주세요.","subtitle":"지금의 나를 소중히 여
