t","abbr":"Tp","family":"Brass","ko":"트럼펫","familyKo":"금관악기"},{"id":"trombone","name":"Trombone","abbr":"Tb","family":"Brass","ko":"트롬본","familyKo":"금관악기"},{"id":"tuba","name":"Tuba","abbr":"Tu","family":"Brass","ko":"튜바","familyKo":"금관악기"},{"id":"timpani","name":"Timpani","abbr":"Ti","family":"Percussion","ko":"팀파니","familyKo":"타악기"}],"/data/bible.json":[{"id":"joseph","name":"Joseph","ko":"요셉","col":0,"row":0},{"id":"david","name":"David","ko":"다윗","col":1,"row":0},{"id":"moses","name":"Moses","ko":"모세","col":2,"row":0},{"id":"daniel","name":"Daniel","ko":"다니엘","col":3,"row":0},{"id":"peter","name":"Peter","ko":"베드로","col":0,"row":1},{"id":"paul","name":"Paul","ko":"바울","col":1,"row":1},{"id":"esther","name":"Esther","ko":"에스더","col":2,"row":1},{"id":"ruth","name":"Ruth","ko":"룻","col":3,"row":1},{"id":"miriam","name":"Miriam","ko":"미리암","col":0,"row":2},{"id":"deborah","name":"Deborah","ko":"드보라","col":1,"row":2},{"id":"mary","name":"Mary","ko":"마리아","col":2,"row":2},{"id":"lydia","name":"Lydia","ko":"루디아","col":3,"row":2}],"/api/config":{}};
// Shared helpers for the presenter and audience screens.

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error((data.error && data.error.message) || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

const getJson = (url) => Promise.resolve(__DATA[url]);

let instruments = null;
async function loadInstruments() {
  if (!instruments) {
    const [ins, bible] = await Promise.all([getJson("/data/instruments.json"), getJson("/data/bible.json").catch(() => [])]);
    instruments = [...ins, ...(bible || []).map((b) => ({ ...b, kind: "bible", family: "Bible", familyKo: "성경 인물" }))];
  }
  return instruments;
}
const instrumentById = (id) => (instruments || []).find((i) => i.id === id);

// Round "badge" for an instrument: score abbreviation (Vn, Ob, Hn…) tinted by family.
function avatar(id, size = 44) {
  const ins = instrumentById(id);
  const el = document.createElement("span");
  el.className = "avatar";
  el.dataset.family = ins ? ins.family.toLowerCase() : "";
  el.style.setProperty("--size", size + "px");
  if (ins && ins.kind === "bible") {
    el.dataset.family = "bible";
    el.style.backgroundImage = "url(/img/bible-avatars.png)";
    el.style.backgroundPosition = `${(ins.col / 3) * 100}% ${(ins.row / 2) * 100}%`;
  } else el.textContent = ins ? ins.abbr : "?";
  el.setAttribute("aria-hidden", "true");
  return el;
}

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}

// Multi-line title text ("\n") → spans with <br>, safely.
function lines(text) {
  const frag = document.createDocumentFragment();
  String(text).split("\n").forEach((line, i) => { if (i) frag.append(document.createElement("br")); frag.append(line); });
  return frag;
}

const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// Score the 20-question self-reflection. Answers: -1, 0, 1, or null (skipped).
function scorePersonality(data, answers) {
  const out = {};
  for (const dim of data.dimensions) {
    const items = data.items.filter((it) => it.dimension === dim.id);
    const vals = items.map((it) => answers[it.id]).map((v, i) => (v == null ? null : items[i].reverse ? -v : v)).filter((v) => v != null);
    if (vals.length < 2) { out[dim.id] = null; continue; }
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    out[dim.id] = mean < -0.25 ? "low" : mean > 0.25 ? "high" : "mid";
  }
  return out;
}

// ---------- Language (English / 한국어) ----------
let memLang = null;
function getLang() {
  if (memLang) return memLang;
  try { return localStorage.getItem("hz-lang") === "ko" ? "ko" : "en"; } catch { return "en"; }
}
function setLang(v) { memLang = v; try { localStorage.setItem("hz-lang", v); } catch {} document.documentElement.lang = v; }
const t = (en, ko) => (getLang() === "ko" ? ko : en);

// Slide in the current language (Korean fields live under slide.ko).
function tr(slide) {
  if (getLang() !== "ko" || !slide.ko) return slide;
  const k = slide.ko;
  const out = { ...slide, ...k };
  delete out.ko;
  if (slide.interaction) {
    const ki = k.interaction || {};
    out.interaction = { ...slide.interaction, ...ki };
    if (slide.interaction.options) out.interaction.options = slide.interaction.options.map((o) => ({ ...o, label: (ki.options && ki.options[o.value]) || o.label }));
    if (slide.interaction.categories) out.interaction.categories = slide.interaction.categories.map((c) => ({ ...c, label: (ki.categories && ki.categories[c.id]) || c.label }));
    if (slide.interaction.fields) out.interaction.fields = slide.interaction.fields.map((f) => ({ ...f, ...((ki.fields && ki.fields[f.id]) || {}) }));
  }
  return out;
}

// Instrument name / alias in the current language ("Cello 2" → "첼로 2").
function insName(id) { const i = instrumentById(id); return i ? t(i.name, i.ko) : ""; }
function insFamily(id) { const i = instrumentById(id); return i ? t(i.family, i.familyKo) : ""; }
function aliasText(alias, id) {
  const i = instrumentById(id);
  return i && alias ? alias.replace(i.name, t(i.name, i.ko)) : alias || t("Guest", "손님");
}

// ---------- Credit card payoff ----------
// Simulates month by month. Minimum payment = 1% of balance + that month's interest, at least $25.
function cardPayoff(balance, aprPct, payment) {
  const r = Math.max(0, aprPct) / 100 / 12;
  let bal = Math.max(0, balance), months = 0, interest = 0;
  while (bal > 0.005 && months < 1200) {
    const i = bal * r;
    const pay = payment == null ? Math.max(25, bal * 0.01 + i) : payment;
    if (pay <= i) return { months: Infinity, interest: Infinity };
    interest += i; bal = bal + i - pay; months++;
  }
  return { months, interest };
}

function calculator(t) {
  const money = (n) => (isFinite(n) ? "$" + Math.round(n).toLocaleString("en-US") : "—");
  const dur = (m) => !isFinite(m) ? t("Never (payment too small)", "갚을 수 없음 (납부액이 너무 적음)")
    : m >= 24 ? t(`${(m / 12).toFixed(1)} years`, `${(m / 12).toFixed(1)}년`) : t(`${m} months`, `${m}개월`);
  const field = (label, val, step) => {
    const input = h("input", { class: "input", type: "number", inputmode: "decimal", min: "0", step, value: String(val) });
    return [h("label", { class: "field" }, h("span", { text: label }), input), input];
  };
  const [fb, bal] = field(t("Card balance ($)", "카드 잔액 ($)"), 5000, "100");
  const [fa, apr] = field(t("Interest rate (APR %)", "연 이자율 (APR %)"), 24, "0.1");
  const [fp, pay] = field(t("What I can pay each month ($)", "매달 갚을 수 있는 금액 ($)"), 300, "10");
  const out = h("div", { class: "calc-out" });
  const run = () => {
    const b = +bal.value || 0, a = +apr.value || 0, p = +pay.value || 0;
    const mn = cardPayoff(b, a, null), fx = cardPayoff(b, a, p);
    out.replaceChildren(
      h("div", { class: "calc-row" }, h("span", { text: t("Minimum payments only", "최소 납부액만") }), h("b", { text: dur(mn.months) }), h("small", { text: t(`Interest ${money(mn.interest)}`, `이자 ${money(mn.interest)}`) })),
      h("div", { class: "calc-row strong" }, h("span", { text: t(`Paying ${money(p)} a month`, `매달 ${money(p)}씩`) }), h("b", { text: dur(fx.months) }), h("small", { text: t(`Interest ${money(fx.interest)}`, `이자 ${money(fx.interest)}`) })));
  };
  [bal, apr, pay].forEach((i) => i.addEventListener("input", run));
  run();
  return h("div", { class: "calc" }, h("div", { class: "calc-in" }, fb, fa, fp), out,
    h("p", { class: "calc-note", text: t("Minimum payment assumed: 1% of the balance plus interest, at least $25. Your card may differ.", "최소 납부액 가정: 잔액의 1% + 이자, 최소 $25. 카드사마다 다를 수 있어요.") }));
}

// ---------- Compound growth (retirement) ----------
function futureValue(monthly, annualPct, years) {
  const r = annualPct / 100 / 12, n = Math.max(0, Math.round(years * 12));
  return r === 0 ? monthly * n : monthly * ((Math.pow(1 + r, n) - 1) / r);
}

function compoundCalc(t) {
  const money = (n) => "$" + Math.round(n).toLocaleString("en-US");
  const field = (label, val, step) => {
    const input = h("input", { class: "input", type: "number", inputmode: "decimal", min: "0", step, value: String(val) });
    return [h("label", { class: "field" }, h("span", { text: label }), input), input];
  };
  const [f1, monthly] = field(t("Save each month ($)", "매달 저축 ($)"), 300, "50");
  const [f2, start] = field(t("Start age", "시작 나이"), 25, "1");
  const [f3, retire] = field(t("Retire at", "은퇴 나이"), 65, "1");
  const [f4, rate] = field(t("Yearly return (%)", "연 수익률 (%)"), 6, "0.5");
  const out = h("div", { class: "calc-out" });
  const run = () => {
    const m = +monthly.value || 0, s = +start.value || 0, rt = +retire.value || 0, r = +rate.value || 0;
    const yrs = Math.max(0, rt - s), late = Math.max(0, yrs - 10);
    const fv = futureValue(m, r, yrs), fvLate = futureValue(m, r, late);
    out.replaceChildren(
      h("div", { class: "calc-row strong" }, h("span", { text: t(`Start at ${s} · ${yrs} years`, `${s}세 시작 · ${yrs}년`) }), h("b", { text: money(fv) }),
        h("small", { text: t(`You put in ${money(m * yrs * 12)}; growth adds ${money(fv - m * yrs * 12)}`, `넣은 돈 ${money(m * yrs * 12)} · 불어난 돈 ${money(fv - m * yrs * 12)}`) })),
      h("div", { class: "calc-row" }, h("span", { text: t(`Start 10 years later (${s + 10}) · ${late} years`, `10년 늦게 시작 (${s + 10}세) · ${late}년`) }), h("b", { text: money(fvLate) }),
        h("small", { text: t(`You put in ${money(m * late * 12)}`, `넣은 돈 ${money(m * late * 12)}`) })));
  };
  [monthly, start, retire, rate].forEach((i) => i.addEventListener("input", run));
  run();
  return h("div", { class: "calc" }, h("div", { class: "calc-in", style: "grid-template-columns:repeat(4,minmax(0,1fr))" }, f1, f2, f3, f4), out,
    h("p", { class: "calc-note", text: t("Example only: assumes the same monthly amount and a steady yearly return, before taxes and inflation.", "예시일 뿐이에요: 매달 같은 금액, 일정한 수익률을 가정하며 세금과 인플레이션은 빼고 계산했어요.") }));
}

// A small Web Audio orchestra.
//
// Each instrument has its own part in one short, original 5-bar piece
// (D – Bm – G – A – D). Played alone, a part can sound simple; played
// together, the parts make a whole. Sounds are synthesized in the browser,
// so no audio files are required.
//
// Want real recordings instead? Drop licensed clips into /public/audio/
// named after the instrument id (e.g. audio/oboe.mp3, audio/tuba.m4a).
// When a file exists it is used instead of the synthesizer.

const BPM = 84;
const BEAT = 60 / BPM;
const CHORDS = [[50, 54, 57], [47, 50, 54], [43, 47, 50], [45, 49, 52], [50, 54, 57]]; // D Bm G A D
const MELODY = [
  [66, 69, 74, 69], [71, 69, 66, 62], [67, 71, 74, 76], [73, 71, 69, 73],
];

// Notes are [startBeat, lengthInBeats, midi, velocity]
function part(id) {
  const n = [];
  const bars = (fn) => CHORDS.forEach((c, b) => fn(c, b * 4, b));
  const melody = (shift = 0, from = 0) => {
    MELODY.forEach((bar, b) => { if (b >= from) bar.forEach((m, i) => n.push([b * 4 + i, 1, m + shift, 0.8])); });
    n.push([16, 4, 74 + shift, 0.8]);
  };
  switch (id) {
    case "violin": melody(0); break;
    case "oboe": melody(0); break;
    case "flute": melody(12, 2); break;
    case "trumpet":
      n.push([7, 1, 66, 0.6], [15, 1, 69, 0.7], [16, 4, 74, 0.8]); break;
    case "viola": bars((c, s) => { for (let i = 0; i < 8; i++) n.push([s + i / 2, 0.5, (i % 2 ? c[2] : c[1]) + 12, 0.45]); }); break;
    case "clarinet": bars((c, s) => n.push([s, 2, c[1] + 12, 0.5], [s + 2, 2, c[2] + 12, 0.5])); break;
    case "horn": bars((c, s) => n.push([s, 4, c[2], 0.5])); break;
    case "trombone": bars((c, s) => n.push([s, 4, c[1], 0.45])); break;
    case "cello": bars((c, s) => n.push([s, 2, c[0] - 12, 0.6], [s + 2, 2, c[2] - 12, 0.55])); break;
    case "bassoon": bars((c, s) => { for (let i = 0; i < 4; i++) n.push([s + i, 0.9, (i % 2 ? c[2] : c[0]) - 12, 0.5]); }); break;
    case "bass": bars((c, s) => n.push([s, 4, low(c[0]), 0.7])); break;
    case "tuba": bars((c, s, b) => { if (b % 2 === 0) n.push([s, 4, low(c[0]), 0.6]); }); break;
    case "timpani": bars((c, s, b) => { n.push([s, 2, c[0] - 12 < 38 ? c[0] : c[0] - 12, 0.9]); if (b < 4) n.push([s + 2, 2, 45, 0.6]); }); break;
    case "harp": bars((c, s, b) => {
      const arp = [c[0], c[1], c[2], c[0] + 12, c[1] + 12, c[2] + 12, c[0] + 24, c[2] + 12];
      if (b === 4) { [c[0], c[1], c[2], c[0] + 12, c[1] + 12, c[2] + 12].forEach((m, i) => n.push([s + i * 0.12, 4, m + 12, 0.5])); return; }
      arp.forEach((m, i) => n.push([s + i / 2, 1.5, m + 12, 0.45]));
    }); break;
  }
  return n;
}

// Bass register: one or two octaves down, staying around D1–D2.
function low(m) { m -= 12; return m > 40 ? m - 12 : m; }

const freq = (m) => 440 * Math.pow(2, (m - 69) / 12);

function env(g, t, a, peak, d, rel) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.setValueAtTime(peak, t + Math.max(a, d - rel));
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
}

function vibrato(ctx, osc, t, f, depth = 0.004, rate = 5.4) {
  const lfo = ctx.createOscillator(), lg = ctx.createGain();
  lfo.frequency.value = rate;
  lg.gain.setValueAtTime(0, t);
  lg.gain.linearRampToValueAtTime(f * depth, t + 0.35);
  lfo.connect(lg).connect(osc.frequency);
  return lfo; // started together with the voice's other nodes
}

let noiseBuf = null;
function noise(ctx) {
  if (noiseBuf) return noiseBuf;
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}

function voice(ctx, out, id, midi, t, dur, vel) {
  const f = freq(midi);
  const g = ctx.createGain();
  g.connect(out);
  const nodes = [];
  const osc = (type, fr, detune = 0) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = fr; o.detune.value = detune; nodes.push(o); return o; };
  const filter = (type, fr, q = 0.7) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = fr; b.Q.value = q; return b; };
  const v = vel * 0.22;

  if (["violin", "viola", "cello", "bass"].includes(id)) {
    const lp = filter("lowpass", Math.min(f * 7, 6000), 0.9);
    const o1 = osc("sawtooth", f, -6), o2 = osc("sawtooth", f, 7);
    o1.connect(lp); o2.connect(lp); lp.connect(g);
    nodes.push(vibrato(ctx, o1, t, f), vibrato(ctx, o2, t, f));
    env(g, t, id === "bass" ? 0.12 : 0.09, v * (id === "bass" ? 1.2 : 0.8), dur, 0.18);
  } else if (id === "harp") {
    const o1 = osc("triangle", f), o2 = osc("sine", f * 2);
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o1.connect(g); o2.connect(g2).connect(g);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v * 1.1, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(dur, 2.2));
  } else if (id === "flute") {
    const o = osc("sine", f), o2 = osc("triangle", f);
    const g2 = ctx.createGain(); g2.gain.value = 0.18;
    o.connect(g); o2.connect(g2).connect(g); nodes.push(vibrato(ctx, o, t, f, 0.005, 5));
    const n = ctx.createBufferSource(); n.buffer = noise(ctx); n.loop = true;
    const bp = filter("bandpass", f * 2, 1.5), ng = ctx.createGain(); ng.gain.value = 0.05;
    n.connect(bp).connect(ng).connect(g); nodes.push(n);
    env(g, t, 0.06, v * 0.9, dur, 0.12);
  } else if (id === "oboe") {
    const o = osc("sawtooth", f);
    const bp = filter("bandpass", 1300, 1.6), hp = filter("highpass", f * 0.9);
    o.connect(hp).connect(bp).connect(g); nodes.push(vibrato(ctx, o, t, f, 0.003, 5.6));
    env(g, t, 0.04, v * 1.6, dur, 0.1);
  } else if (id === "clarinet") {
    const o = osc("square", f); const lp = filter("lowpass", f * 4);
    o.connect(lp).connect(g); env(g, t, 0.05, v * 0.55, dur, 0.12);
  } else if (id === "bassoon") {
    const o = osc("sawtooth", f); const lp = filter("lowpass", f * 3.2), bp = filter("peaking", 480, 2); bp.gain.value = 6;
    o.connect(lp).connect(bp).connect(g); env(g, t, 0.03, v * 0.8, dur, 0.08);
  } else if (["horn", "trumpet", "trombone", "tuba"].includes(id)) {
    const bright = { horn: 3, trumpet: 9, trombone: 5, tuba: 2.6 }[id];
    const o = osc("sawtooth", f); const lp = filter("lowpass", f * 1.2, 1.2);
    lp.frequency.setValueAtTime(f * 1.2, t); lp.frequency.exponentialRampToValueAtTime(Math.min(f * bright, 9000), t + 0.09);
    lp.frequency.exponentialRampToValueAtTime(Math.min(f * bright * 0.7, 9000), t + 0.4);
    o.connect(lp).connect(g);
    if (id !== "tuba") nodes.push(vibrato(ctx, o, t, f, 0.002, 5));
    env(g, t, 0.05, v * (id === "trumpet" ? 0.75 : id === "tuba" ? 1.3 : 0.9), dur, 0.15);
  } else if (id === "timpani") {
    const o = osc("sine", f * 1.04);
    o.frequency.setValueAtTime(f * 1.04, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.15);
    o.connect(g);
    const n = ctx.createBufferSource(); n.buffer = noise(ctx);
    const lp = filter("lowpass", 900), ng = ctx.createGain();
    ng.gain.setValueAtTime(v * 1.2, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    n.connect(lp).connect(ng).connect(out); nodes.push(n);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v * 3, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    dur = 1.7;
  }
  nodes.forEach((n) => { n.start(t); n.stop(t + dur + 0.2); });
  return nodes;
}

function impulse(ctx, seconds = 2.4) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
  }
  return buf;
}

class Orchestra {
  constructor() { this.ctx = null; this.active = []; this.timer = null; this.files = {}; this.onend = null; }

  async init(ids) {
    // Optional recordings dropped into /public/audio/ (listed by the server).
    try {
      const files = [];
      for (const id of ids) { const f = files.find((n) => n.replace(/\.[^.]+$/, "") === id); if (f) this.files[id] = `/audio/${f}`; }
    } catch {}
  }

  setup() {
    if (this.ctx) return;
    const ctx = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = ctx.createGain(); this.master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    const verb = ctx.createConvolver(); verb.buffer = impulse(ctx);
    const wet = ctx.createGain(); wet.gain.value = 0.28;
    this.bus = ctx.createGain();
    this.bus.connect(this.master); this.bus.connect(verb).connect(wet).connect(this.master);
    this.master.connect(comp).connect(ctx.destination);
  }

  get duration() { return 20 * BEAT + 1.5; }

  stop() {
    clearTimeout(this.timer);
    for (const n of this.active) { try { n.stop ? n.stop() : n.pause(); } catch {} }
    this.active = [];
  }

  play(ids) {
    this.stop();
    this.setup();
    this.ctx.resume();
    const t0 = this.ctx.currentTime + 0.08;
    // In a full ensemble, quieten each part a little.
    const out = this.ctx.createGain(); out.gain.value = ids.length > 1 ? 0.55 : 1; out.connect(this.bus);
    for (const id of ids) {
      if (this.files[id]) {
        const a = new Audio(this.files[id]); a.play().catch(() => {}); this.active.push(a); continue;
      }
      for (const [beat, len, midi, vel] of part(id)) {
        this.active.push(...voice(this.ctx, out, id, midi, t0 + beat * BEAT, len * BEAT * 0.98, vel));
      }
    }
    this.timer = setTimeout(() => { this.active = []; this.onend && this.onend(); }, this.duration * 1000);
  }
}

  <div class="stage" id="stage"></div>
  <footer class="bottombar">
    <div style="display:flex;align-items:center;gap:16px;flex:1;min-width:0">
      <span class="slide-pos" id="pos"></span><div class="progress"><i id="bar"></i></div>
      <span class="muted hide-sm" id="section" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
    </div>
    <div class="controls">
      ${room ? `<button class="ctl hide-sm" id="mod" aria-pressed="false" title="${t("Review messages before they appear", "화면에 띄우기 전에 검토")}">${t("Review first", "검토 후 표시")}</button>
      <button class="ctl hide-sm" id="queue">${t("Queue", "대기열")}<span class="badge" id="qcount" hidden>0</span></button>
      <button class="ctl hide-sm" id="qr">QR</button>
      <a class="ctl hide-sm" id="export" href="#" download>${t("Export", "내보내기")}</a>` : ""}
      <button class="ctl hide-sm" id="notes">${t("Notes", "노트")}</button>
      <button class="ctl" id="lang">${t("한국어", "English")}</button>
      <button class="ctl" id="prev" aria-label="${t("Previous slide", "이전 슬라이드")}">←</button>
      <button class="ctl" id="next" aria-label="${t("Next slide", "다음 슬라이드")}">→</button>
    </div>
  </footer>
  <aside class="drawer" id="drawer" hidden></aside>
  <div class="overlay" id="qrOverlay" hidden></div>`;

  if (room) {
    document.getElementById("export").href = `/api/rooms/${room.code}/export?key=${encodeURIComponent(room.hostKey)}`;
    document.getElementById("mod").onclick = () => hostOp({ op: "moderate", value: !state.moderate });
    document.getElementById("queue").onclick = () => toggleDrawer("queue");
    document.getElementById("qr").onclick = toggleQr;
  }
  document.getElementById("notes").onclick = () => toggleDrawer("notes");
  document.getElementById("lang").onclick = () => { setLang(getLang() === "ko" ? "en" : "ko"); startStage(); };
  document.getElementById("prev").onclick = () => go(state.slideIndex - 1);
  document.getElementById("next").onclick = () => go(state.slideIndex + 1);
  if (!keysBound) { document.addEventListener("keydown", onKey); keysBound = true; }
  if (room && !connected) { connected = true; connect(); }
  renderedSlide = -1;
  render();
}

function onKey(e) {
  if (e.target.closest("input, textarea")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(state.slideIndex + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(state.slideIndex - 1); }
  else if (e.key === "n" || e.key === "N") toggleDrawer("notes");
  else if ((e.key === "q" || e.key === "Q") && room) toggleQr();
  else if (e.key === "f" || e.key === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  else if (e.key === "Escape") { document.getElementById("qrOverlay").hidden = true; document.getElementById("drawer").hidden = true; }
}

async function go(i) {
  if (i < 0 || i >= deck.slides.length || i === state.slideIndex) return;
  state.slideIndex = i; // optimistic
  render();
  if (room) hostOp({ op: "slide", index: i });
}

async function hostOp(body) {
  try { await api(`/api/rooms/${room.code}/host`, { key: room.hostKey, ...body }); }
  catch (err) { toast(err.message); }
}

function connect() {
  const es = new EventSource(`/api/rooms/${room.code}/stream?key=${encodeURIComponent(room.hostKey)}`);
  es.onmessage = (ev) => {
    const next = JSON.parse(ev.data);
    const slideChanged = next.slideIndex !== state.slideIndex;
    state = next;
    if (slideChanged) render(); else update();
  };
  es.onerror = () => {
    // EventSource reconnects automatically. If the room is gone (server restart), say so.
    api(`/api/rooms/${room.code}`).catch((err) => { if (err.status === 404) { es.close(); store.del("hephzibah-host"); toast(t("This room has ended (server restarted). Start a new session.", "방이 종료되었어요(서버 재시작). 새로 시작해 주세요.")); } });
  };
}

// ---------------- Rendering ----------------
function render() {
  const slide = tr(deck.slides[state.slideIndex]);
  if (renderedSlide !== state.slideIndex) orchestra.stop();
  renderedSlide = state.slideIndex;
  const stage = document.getElementById("stage");
  stage.replaceChildren(buildSlide(slide));
  document.getElementById("pos").textContent = `${String(state.slideIndex + 1).padStart(2, "0")} / ${deck.slides.length}`;
  document.getElementById("bar").style.width = `${((state.slideIndex + 1) / deck.slides.length) * 100}%`;
  document.getElementById("section").textContent = slide.section;
  const drawer = document.getElementById("drawer");
  if (!drawer.hidden && drawer.dataset.mode === "notes") fillNotes();
  update();
}

function head(slide, compact) {
  return h("div", { class: "content" },
    h("p", { class: "eyebrow", text: slide.eyebrow }),
    h("h1", { class: "title" }, lines(slide.title)),
    slide.subtitle ? h("p", { class: "subtitle", text: slide.subtitle }) : null);
}

function buildSlide(slide) {
  const el = h("section", { class: "slide", "aria-live": "polite", "data-kind": slide.kind });
  const ix = slide.interaction;

  if (slide.kind === "cover" && room) {
    el.style.gridTemplateColumns = "1fr auto"; el.style.gap = "5vw";
    const c = head(slide); c.append(h("div", { class: "accent" }), h("p", { class: "subtitle", style: "font-weight:700;color:var(--ink)", text: slide.body[0] }));
    el.append(c, h("div", { class: "content" }, qrBox()));
    return el;
  }

  if (slide.kind === "video") {
    el.classList.add("video");
    const v = slide.video;
    el.append(h("div", { style: "display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap" },
      h("div", {}, h("p", { class: "eyebrow", style: "margin-bottom:8px", text: slide.eyebrow }), h("h1", { class: "title", style: "font-size:clamp(26px,3vw,48px)", text: slide.title })),
      h("a", { class: "ctl", href: `https://www.youtube.com/watch?v=${v.youtubeId}`, target: "_blank", rel: "noopener", text: t("Open on YouTube ↗", "YouTube에서 열기 ↗") })));
    const frame = h("div", { class: "video-frame" });
    const iframe = h("iframe", { src: `https://www.youtube-nocookie.com/embed/${v.youtubeId}?rel=0&modestbranding=1`, title: v.title,
      allow: "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen", allowfullscreen: true, referrerpolicy: "strict-origin-when-cross-origin" });
    frame.append(iframe); el.append(frame);
    return el;
  }

  if (slide.kind === "orchestra") {
    el.classList.add("compact");
    const c = head(slide);
    const grid = h("div", { class: "orch", id: "orch" });
    for (const ins of __pins.filter((i) => i.kind !== "bible")) {
      const b = h("button", { class: "inst", type: "button", "data-id": ins.id, onclick: () => playSolo(ins.id, b) },
        avatar(ins.id, 46), h("span", {}, h("b", { text: t(ins.name, ins.ko) }), h("small", { class: "inroom", text: t(ins.family, ins.familyKo) })));
      grid.append(b);
    }
    const together = h("button", { class: "btn", type: "button", onclick: () => playAll(together) }, t("▶ All together", "▶ 함께 연주"));
    const stop = h("button", { class: "btn ghost", type: "button", onclick: () => { orchestra.stop(); markPlaying([]); } }, t("■ Stop", "■ 정지"));
    c.append(grid, h("div", { class: "orch-actions" }, together, stop));
    el.append(c);
    return el;
  }

  const live = ix && (ix.type === "text" || ix.type === "choice" || ix.type === "review");
  if (live && room || (live && ix.type === "choice")) {
    el.classList.add("split-live", "compact");
    const c = head(slide);
    if (ix.type === "text" || ix.type === "review") {
      c.append(h("p", { class: "subtitle", style: "font-size:clamp(14px,1.2vw,18px);color:var(--muted)" }, room ? `${t("Answer on your phone", "휴대폰으로 답해 주세요")} · ${joinHost()}${room.code}` : ""));
      if (ix.type === "review") c.append(h("p", { class: "subtitle", id: "reviewStats", style: "font-weight:700;color:var(--ink)" }));
      const wrap = h("div", { class: "wall-wrap" },
        h("div", { class: "wall-head" }, h("span", { text: ix.channel === "qa" ? t("Your questions", "질문") : ix.type === "review" ? t("What we learned", "우리가 배운 것") : t("Live answers", "실시간 답변") }), h("span", { id: "wallCount" })),
        h("div", { class: "wall", id: "wall", "data-slide": ix.channel === "qa" ? "qa" : slide.id }));
      el.append(c, wrap);
    } else {
      const poll = h("div", { class: "poll", id: "poll" });
      for (const o of ix.options) poll.append(h("div", { class: "opt", "data-value": o.value }, h("span", { text: o.label }), h("span", { class: "num", text: "0" }), h("div", { class: "bar" }, h("i", { style: "width:0" }))));
      el.append(c, h("div", { class: "wall-wrap", style: "justify-content:center" }, h("div", { class: "wall-head" }, h("span", { text: t("Live poll", "실시간 투표") }), h("span", { id: "wallCount" })), poll));
    }
    return el;
  }

  // Static slide kinds
  const c = head(slide);
  if (slide.kind === "reframe-examples") {
    const box = h("div", { class: "reframe" });
    for (const r of slide.body) box.append(h("div", {}, h("span", { class: "from", text: r.trait }), h("span", { text: "→" }), h("span", { text: r.possibility })));
    c.append(box);
  } else if (slide.kind === "photo") {
    el.style.gridTemplateColumns = "1.1fr 1fr"; el.style.gap = "4vw";
    el.append(c, h("div", { class: "content" }, h("div", { class: "photo-slot" }, h("div", {}, h("b", { text: slide.photo.label }), h("p", { style: "max-width:36ch", text: slide.photo.note })))));
    return el;
  } else if (ix && ix.type === "calculator") {
    el.classList.add("compact");
    c.append(calculator(t));
    el.append(c);
    return el;
  } else if (ix && ix.type === "compound") {
    el.classList.add("compact");
    c.append(compoundCalc(t));
    el.append(c);
    return el;
  } else if (ix && ix.type === "estimate") {
    el.classList.add("compact");
    c.append(h("div", { class: "tabs", style: "margin-top:24px" }, ix.categories.map((cat) => h("span", { class: "tag", style: "font-size:clamp(13px,1.1vw,16px)" }, cat.label))));
    c.append(h("ul", { class: "blist" }, slide.body.map((b, i) => h("li", {}, h("span", { text: String(i + 1).padStart(2, "0") }), b))));
  } else if (ix && ix.type === "checklist") {
    el.classList.add("compact");
    c.append(h("ul", { class: "blist", style: "grid-template-columns:1fr" }, slide.body.map((b, i) => h("li", { style: "font-size:clamp(16px,1.5vw,24px);padding:12px 0" }, h("span", { text: String(i + 1).padStart(2, "0") }), b))));
  } else if (ix && ix.type === "private") {
    c.append(h("ul", { class: "blist" }, ix.fields.map((f, i) => h("li", {}, h("span", { text: String(i + 1).padStart(2, "0") }), f.label))));
    c.append(h("p", { class: "subtitle", style: "font-size:clamp(14px,1.2vw,18px);color:var(--muted)", text: t("✎ Write this on your phone. ", "✎ 휴대폰에 적어 보세요. ") + ix.privacy }));
  } else if (Array.isArray(slide.body) && slide.body.length && slide.kind !== "cover" && slide.kind !== "closing") {
    if (slide.body.length === 1) c.append(h("div", { class: "accent" }), h("p", { class: "subtitle", style: "font-weight:700;color:var(--ink)", text: slide.body[0] }));
    else c.append(h("ul", { class: "blist" }, slide.body.map((b, i) => h("li", {}, h("span", { text: String(i + 1).padStart(2, "0") }), b))));
  } else if (slide.body && slide.body.length) {
    c.append(h("div", { class: "accent" }), h("p", { class: "subtitle", style: "font-weight:700;color:var(--ink)", text: slide.body[0] }));
  }
  el.append(c);
  return el;
}

function qrBox(big) {
  const box = h("div", {});
  const q = h("div", { class: "qr-box" });
  const svg = qrSvg(joinUrl());
  if (svg) q.innerHTML = svg; else q.append(h("p", { text: t("Loading QR…", "QR 준비 중…") }));
  box.append(q, h("div", { class: "qr-cap" }, `${joinHost()}`, h("b", { text: room.code })));
  if (!svg) setTimeout(() => { const s = qrSvg(joinUrl()); if (s) q.innerHTML = s; }, 400);
  return box;
}

function toggleQr() {
  const o = document.getElementById("qrOverlay");
  if (!o.hidden) { o.hidden = true; return; }
  o.replaceChildren(h("div", { class: "big" }, qrBox(true),
    h("div", {}, h("p", { class: "eyebrow", text: t("Join the session", "강의 입장") }), h("h2", { class: "display", style: "font-size:clamp(40px,6vw,96px)" }, t("Scan, or go to", "스캔하거나 접속하세요"), h("br"), h("u", { text: joinHost() }), h("br"), room.code),
      h("p", { class: "lead", text: t("Press Q or Esc to close.", "Q 또는 Esc로 닫기") }))));
  o.hidden = false;
  o.onclick = () => (o.hidden = true);
}

// Live parts of the current slide
function update() {
  const slide = tr(deck.slides[state.slideIndex]);
  if (room) {
    document.getElementById("count").innerHTML = `<span class="dot"></span><span>${state.participants} ${t("joined", "명 입장")}</span>`;
    const mod = document.getElementById("mod"); mod.setAttribute("aria-pressed", String(state.moderate));
    const pending = state.messages.filter((m) => m.status === "pending").length;
    const qc = document.getElementById("qcount"); qc.hidden = !pending; qc.textContent = pending;
    const drawer = document.getElementById("drawer");
    if (!drawer.hidden && drawer.dataset.mode === "queue") fillQueue();
  }

  const wall = document.getElementById("wall");
  if (wall) {
    const key = wall.dataset.slide;
    const msgs = state.messages.filter((m) => m.slideId === key && m.status === "shown");
    const have = new Set([...wall.querySelectorAll(".msg")].map((n) => Number(n.dataset.id)));
    const want = new Set(msgs.map((m) => m.id));
    wall.querySelectorAll(".msg").forEach((n) => { if (!want.has(Number(n.dataset.id))) n.remove(); });
    for (const m of msgs) if (!have.has(m.id)) wall.prepend(msgCard(m, true));
    let empty = wall.querySelector(".wall-empty");
    if (!msgs.length && !empty) wall.append(h("p", { class: "wall-empty", text: room ? t("Waiting for the first answer…", "첫 답을 기다리고 있어요…") : t("Answers will appear here during a live session.", "실시간 발표 중에 답이 여기에 나타나요.") }));
    if (msgs.length && empty) empty.remove();
    document.getElementById("wallCount").textContent = msgs.length ? String(msgs.length) : "";
  }

  const poll = document.getElementById("poll");
  if (poll) {
    const tally = state.votes[slide.id] || {};
    const total = Object.values(tally).reduce((a, b) => a + b, 0);
    poll.querySelectorAll(".opt").forEach((o) => {
      const n = tally[o.dataset.value] || 0;
      o.querySelector(".num").textContent = total ? `${n} · ${Math.round((n / total) * 100)}%` : "0";
      o.querySelector(".bar i").style.width = total ? `${(n / total) * 100}%` : "0";
    });
    document.getElementById("wallCount").textContent = total ? `${total}${t(total === 1 ? " vote" : " votes", "표")}` : "";
  }

  const orch = document.getElementById("orch");
  if (orch && room) orch.querySelectorAll(".inst").forEach((b) => {
    const n = state.__pins[b.dataset.id] || 0;
    b.querySelector(".inroom").textContent = n ? t(`${n} in the room`, `${n}명 참여`) : insFamily(b.dataset.id);
  });

  const rs = document.getElementById("reviewStats");
  if (rs) rs.textContent = state.reviews ? t(`${state.reviews} reviews · ★ ${state.rating} · ${state.submissions} reflections submitted`, `리뷰 ${state.reviews}개 · ★ ${state.rating} · 성찰 ${state.submissions}개 제출`) : "";
}

function msgCard(m, canHide) {
  const ins = instrumentById(m.avatarId);
  const card = h("article", { class: "msg", "data-id": m.id },
    h("p", { text: m.text }),
    h("div", { class: "who" }, avatar(m.avatarId, 26), h("span", { text: aliasText(m.alias, m.avatarId) })));
  if (canHide && room) card.append(h("button", { class: "x", type: "button", title: t("Hide from screen", "화면에서 숨기기"), onclick: () => hostOp({ op: "status", id: m.id, status: "hidden" }) }, t("Hide", "숨기기")));
  return card;
}

function markPlaying(ids) {
  document.querySelectorAll(".inst").forEach((b) => b.classList.toggle("playing", ids.includes(b.dataset.id)));
}
function playSolo(id) {
  orchestra.play([id]); markPlaying([id]);
  orchestra.onend = () => markPlaying([]);
}
function playAll() {
  const ids = __pins.map((i) => i.id);
  orchestra.play(ids); markPlaying(ids);
  orchestra.onend = () => markPlaying([]);
}

// ---------------- Drawer ----------------
function toggleDrawer(mode) {
  const d = document.getElementById("drawer");
  if (!d.hidden && d.dataset.mode === mode) { d.hidden = true; return; }
  d.dataset.mode = mode; d.hidden = false;
  mode === "notes" ? fillNotes() : fillQueue();
}
function fillNotes() {
  const slide = tr(deck.slides[state.slideIndex]);
  const d = document.getElementById("drawer");
  d.replaceChildren(h("h3", { text: `${t("Speaker notes", "발표자 노트")} · ${state.slideIndex + 1}` }), h("div", { class: "notes" }, (slide.notes || []).map((n) => h("p", { text: n }))));
}
function fillQueue() {
  const d = document.getElementById("drawer");
  const pending = state.messages.filter((m) => m.status === "pending");
  const hidden = state.messages.filter((m) => m.status === "hidden");
  const qa = state.messages.filter((m) => m.channel === "qa" && m.status === "shown");
  d.replaceChildren(
    h("h3", { text: `${t("Waiting for review", "검토 대기")} (${pending.length})` }),
    pending.length > 1 ? h("button", { class: "ctl", style: "margin-bottom:12px", onclick: () => hostOp({ op: "approveAll" }) }, t("Approve all", "모두 승인")) : null,
    h("div", { class: "pending" }, pending.length ? pending.map((m) => {
      const c = msgCard(m, false);
      c.append(h("div", { class: "row" }, h("button", { class: "ctl", onclick: () => hostOp({ op: "status", id: m.id, status: "shown" }) }, t("Show", "표시")),
        h("button", { class: "ctl", onclick: () => hostOp({ op: "status", id: m.id, status: "hidden" }) }, t("Hide", "숨기기"))));
      return c;
    }) : h("p", { class: "muted", text: state.moderate ? t("Nothing waiting.", "대기 중인 메시지가 없어요.") : t("“Review first” is off — messages appear immediately.", "“검토 후 표시”가 꺼져 있어 메시지가 바로 나타나요.") })),
    h("h3", { style: "margin-top:28px", text: `${t("Audience questions", "청중 질문")} (${qa.length})` }),
    h("div", {}, qa.length ? qa.map((m) => msgCard(m, true)) : h("p", { class: "muted", text: t("Students can ask questions from their phones anytime.", "학생들은 언제든 휴대폰으로 질문할 수 있어요.") })),
    hidden.length ? h("h3", { style: "margin-top:28px", text: `${t("Hidden", "숨김")} (${hidden.length})` }) : null,
    h("div", {}, hidden.map((m) => { const c = msgCard(m, false); c.append(h("button", { class: "ctl", onclick: () => hostOp({ op: "status", id: m.id, status: "shown" }) }, t("Show again", "다시 표시"))); return c; })));
}

function toast(text) {
  const el = h("div", { class: "toast", role: "status", text });
  document.body.append(el); setTimeout(() => el.remove(), 4000);
}

// ---------------- Boot ----------------
(async () => {
  [deck, __pins] = await Promise.all([getJson(`/data/${lectureId}.json`), loadInstruments()]);
  orchestra.init(__pins.filter((i) => i.kind !== "bible").map((i) => i.id));
  if (preview) return startStage();
  const code = params.get("room");
  const saved = store.get("hephzibah-host");
  if (code && saved && saved.code === code) {
    try { await api(`/api/rooms/${code}`); room = saved; return startStage(); } catch { store.del("hephzibah-host"); }
  }
  showSetup();
})();

</script>
