<style>
/* Growth Note demo — a phone-first group workshop.
   One card column; a sticky top bar with the group and the six steps. Single warm-paper look (the Hephzibah brand). */
:root {
  --paper: #fbf8f2; --card: #fffdf9; --ink: #1b2133; --ink-2: #4b4640; --muted: #8b8276;
  --hair: rgba(120, 92, 55, 0.18); --accent: #e9a93a; --accent-ink: #a8701a; --accent-soft: #fdf1d8;
  --tA: #1d3a6b; --tB: #c0602a; --tC: #2f6b4f; --tD: #6a4c93;
  --sans: "Plus Jakarta Sans", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  --kr: "Noto Sans KR", "Plus Jakarta Sans", system-ui, sans-serif;
  --serif: "Gowun Batang", Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--kr); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

.bar { position: sticky; top: 0; z-index: 20; background: rgba(251,248,242,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--ink);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 620px; margin: 0 auto; display: grid; gap: 10px; }
.bar-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
.brand svg { width: 26px; height: 26px; }
.brand b { font-family: var(--sans); font-size: 16px; letter-spacing: -.01em; display: block; line-height: 1; }
.brand small { font-family: var(--sans); font-size: 8px; letter-spacing: .3em; font-weight: 600; display: block; margin-top: 3px; }
.pill { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 12px; background: var(--ink); color: var(--paper); white-space: nowrap; }
.pill.soft { background: var(--accent-soft); color: var(--accent-ink); }
.steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.steps button { border: 0; background: none; padding: 0; cursor: pointer; display: grid; gap: 4px; text-align: left; }
.steps button:disabled { cursor: default; }
.steps i { display: block; height: 3px; border-radius: 3px; background: var(--hair); transition: background .3s; }
.steps span { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps .done i { background: var(--ink); }
.steps .on i { background: var(--accent); }
.steps .on span { color: var(--ink); }

main { max-width: 620px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 48px) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; }
.screen { display: grid; gap: 18px; animation: in .35s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }
.eyebrow { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink); margin: 0; }
h1 { font-size: clamp(30px, 8vw, 44px); line-height: 1.12; letter-spacing: -.035em; margin: 0; font-weight: 800; text-wrap: balance; }
h2 { font-size: 24px; line-height: 1.2; letter-spacing: -.03em; margin: 0; font-weight: 800; text-wrap: balance; }
h3 { font-size: 17px; margin: 0; font-weight: 700; }
p { margin: 0; }
.lead { color: var(--ink-2); font-size: 17px; }
.muted { color: var(--muted); font-size: 14px; }
.serif { font-family: var(--serif); }
.card { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(60,45,20,.05); min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 12px; padding: 14px 18px; font-weight: 700; cursor: pointer; font-size: 16px; text-align: center; box-shadow: 0 6px 18px rgba(27,33,51,.14); }
.btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: none; }
.btn.small { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.btn.full { width: 100%; }
.btn:focus-visible, .opt:focus-visible, .chip:focus-visible, .input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.input { width: 100%; border: 1px solid var(--hair); background: #fffdf8; border-radius: 10px; padding: 12px 14px; font-size: 16px; min-width: 0; }
.input:focus { border-color: var(--ink); outline: none; }
textarea.input { resize: vertical; min-height: 72px; }
label.f { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--hair); background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: 14px; cursor: pointer; font-weight: 500; }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--ink); font-size: 11px; font-weight: 800; margin-right: 6px; }

/* People */
.av { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; flex: none; background: var(--muted); }
.av.me { box-shadow: 0 0 0 3px var(--accent); }
.people { display: flex; flex-wrap: wrap; gap: 8px; }
.person { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--hair); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 14px; font-weight: 600; animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.6); } }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.group { border: 1px solid var(--hair); border-radius: 14px; padding: 14px; background: var(--card); display: grid; gap: 10px; }
.group.mine { border: 2px solid var(--accent); background: #fffaf0; box-shadow: 0 0 0 6px rgba(233,169,58,.12); }
.group h3 { display: flex; justify-content: space-between; align-items: center; }
.shuffle .person { animation: shake .5s ease-in-out infinite; }
@keyframes shake { 25% { transform: translate(-2px, 1px) rotate(-2deg); } 75% { transform: translate(2px, -1px) rotate(2deg); } }

/* Test */
.progress { height: 6px; border-radius: 6px; background: var(--hair); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s ease; }
.q { font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.3; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--hair); background: var(--card); border-radius: 12px; padding: 14px; cursor: pointer; font-size: 16px; font-weight: 600; transition: transform .12s, background .12s; }
.opt b { font-family: var(--sans); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 1px solid var(--hair); flex: none; font-size: 13px; }
.opt:hover { background: #fffaf0; }
.opt.picked { background: var(--ink); color: var(--paper); transform: scale(.98); }
.opt.picked b { background: var(--accent); color: var(--ink); border-color: var(--accent); }
.counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.count { border-radius: 12px; padding: 10px; text-align: center; background: var(--paper); border: 1px solid var(--hair); }
.count b { display: block; font-family: var(--sans); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.count small { font-size: 12px; color: var(--muted); font-weight: 600; }
.count.top { background: var(--accent-soft); border-color: var(--accent); }
.type { border-top: 4px solid var(--accent); }
.type .name { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.type .name b { font-size: 26px; letter-spacing: -.03em; }
.type .name span { color: var(--muted); font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 3px 10px; color: #fff; }
.member { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--hair); }
.member:first-child { border-top: 0; padding-top: 0; }
.member p { font-size: 15px; color: var(--ink-2); }
.typing { color: var(--muted); font-size: 14px; }
.typing::after { content: "…"; animation: dots 1s steps(3) infinite; }
@keyframes dots { 0% { content: "."; } 33% { content: ".."; } 66% { content: "..."; } }

/* Compliment shower */
.hero-name { display: flex; align-items: center; gap: 12px; }
.hero-name .av { width: 52px; height: 52px; font-size: 20px; }
.praise { display: grid; gap: 10px; }
.praise-item { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; display: grid; gap: 4px; }
.praise-item .who { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.praise-item .who .av { width: 24px; height: 24px; font-size: 11px; }
.praise-item p { font-family: var(--serif); font-size: 17px; }
.rules { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--ink-2); font-size: 14px; }
.three { display: grid; gap: 8px; }
.sentence { font-family: var(--serif); font-size: 18px; line-height: 1.9; }
.sentence .input { display: inline-block; width: auto; min-width: 0; max-width: 100%; padding: 6px 10px; font-family: var(--kr); font-size: 16px; }

/* Dream table */
.jobs { display: grid; gap: 10px; }
.job { display: grid; gap: 4px; padding: 12px 0; border-top: 1px solid var(--hair); }
.job:first-child { border-top: 0; padding-top: 0; }
.job b { font-size: 15px; }
.job .ex { color: var(--muted); font-size: 14px; }

/* Done */
.note { background: var(--card); border-radius: 18px; border: 1px solid var(--hair); overflow: hidden; box-shadow: 0 18px 50px rgba(60,45,20,.09); }
.note-head { padding: 22px 20px; background: linear-gradient(160deg, #fff4dc, #fbf8f2); border-bottom: 1px solid var(--hair); display: grid; gap: 6px; }
.note-body { padding: 20px; display: grid; gap: 16px; }
.note-body dt { font-size: 13px; color: var(--muted); font-weight: 700; }
.note-body dd { margin: 4px 0 0; font-weight: 600; }
.verse { text-align: center; display: grid; gap: 4px; padding: 10px 0; }
.verse p { font-family: var(--serif); font-size: 24px; }
.verse small { font-family: var(--sans); letter-spacing: .14em; color: var(--accent-ink); font-size: 12px; font-weight: 700; }
.candle { width: 120px; margin: 0 auto; display: block; }
.candle .flame { transform-origin: 60px 52px; animation: flicker 2.4s ease-in-out infinite; }
@keyframes flicker { 25% { transform: scale(1.04,.96) rotate(-2deg); } 50% { transform: scale(.97,1.05) rotate(1.5deg); } 75% { transform: scale(1.02,.98) rotate(-1deg); } }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 40; max-width: calc(100vw - 32px); animation: in .3s ease both; }
.demo-tag { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 30; font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: .14em; background: var(--accent); color: var(--ink); padding: 5px 10px; border-radius: 999px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

      <span class="pill" id="groupPill"></span>

<main id="app"></main>

<script>
// ---------------------------------------------------------------------------
// 함께하는 성장 노트 — demo. Everyone else in the room is simulated: they join,
// get split into groups of 4–5, answer, and write strengths for you.
// ---------------------------------------------------------------------------
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let timers = [];
const later = (ms, fn) => timers.push(setTimeout(fn, ms));
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

const COLORS = ["#1d3a6b", "#2f6b4f", "#a8741a", "#8e3b2e", "#6a4c93", "#2b6f7a", "#7a5a2b", "#3d5a80", "#9c4f6b"];
const NAMES = ["민지", "서준", "하은", "도윤", "지우", "예준", "서연", "시우", "수아", "주원", "지안", "하준", "윤서", "은우", "채원", "건우", "다은"];
const GROUP_NAMES = ["빛 조", "소금 조", "등불 조", "씨앗 조", "샘물 조"];

const TYPES = {
  A: { name: "리더형", who: "느헤미야", desc: "방향을 잡고 사람들을 이끌어요.", grow: "다른 사람의 속도를 기다려 주기", color: "var(--tA)",
       strengths: ["앞장서서 이끌어 줘", "결정을 잘해", "책임감이 강해", "목표가 분명해", "어려운 일도 먼저 나서"] },
  B: { name: "열정형", who: "베드로", desc: "에너지와 아이디어가 넘쳐요.", grow: "끝까지 마무리하기", color: "var(--tB)",
       strengths: ["웃음이 많아", "아이디어가 많아", "분위기를 밝게 해", "새로운 걸 겁내지 않아", "에너지가 넘쳐"] },
  C: { name: "돌봄형", who: "바나바", desc: "사람을 세워 주고 격려해요.", grow: "필요할 때 거절하기", color: "var(--tC)",

// 20 questions. A = leader, B = passion, C = care, D = careful (same as the printed note, plus 15 more).
const QUESTIONS = [
  ["친구들과 모이면 나는?", "먼저 계획을 세운다", "분위기를 띄운다", "조용히 챙겨 준다", "뒤에서 꼼꼼히 준비한다"],

  ["문제가 생기면 나는?", "바로 해결하려 한다", "새로운 방법을 떠올린다", "사람들 마음부터 살핀다", "원인을 차근차근 찾는다"],
  ["나는 이럴 때 제일 힘들다", "일이 진행이 안 될 때", "지루할 때", "다툼이 있을 때", "실수가 많을 때"],
  ["내가 편한 역할은?", "이끄는 사람", "아이디어 내는 사람", "돕는 사람", "정리하는 사람"],
  ["새로운 일을 시작할 때 나는?", "목표부터 정한다", "일단 해 본다", "함께할 사람을 찾는다", "자료부터 찾아본다"],
  ["조별 과제에서 나는?", "역할을 나눈다", "아이디어를 쏟아낸다", "빠진 친구를 챙긴다", "마감과 자료를 챙긴다"],
  ["쉬는 날 나는?", "하고 싶은 일을 계획대로 한다", "즉흥적으로 놀러 간다", "친구나 가족과 시간을 보낸다", "혼자 좋아하는 것에 집중한다"],
  ["친구가 고민을 말하면 나는?", "해결책을 알려 준다", "기분 전환을 시켜 준다", "끝까지 들어 준다", "상황을 차근차근 정리해 준다"],
  ["내가 자주 듣는 말은?", "추진력이 있다", "에너지가 넘친다", "착하다", "꼼꼼하다"],
  ["결정을 내릴 때 나는?", "빠르게 결정한다", "끌리는 쪽을 고른다", "다른 사람 의견을 많이 듣는다", "장단점을 따져 본다"],
  ["교회 행사를 준비하면 나는?", "전체 진행을 맡는다", "게임과 순서를 기획한다", "새 친구를 맞이한다", "준비물과 일정을 챙긴다"],
  ["나는 이럴 때 기쁘다", "목표를 이뤘을 때", "새로운 걸 경험할 때", "누군가 고맙다고 할 때", "일이 깔끔하게 끝났을 때"],
  ["갈등이 생기면 나는?", "정면으로 이야기한다", "웃으며 분위기를 바꾼다", "양쪽 마음을 이어 준다", "사실관계부터 확인한다"],
  ["공부할 때 나는?", "목표 점수를 정하고 달린다", "재밌는 과목부터 한다", "친구와 같이 공부한다", "계획표를 세워 차근차근 한다"],

const STEPS = ["시작 기도", "성격 테스트", "칭찬 샤워", "나에게 적용", "꿈과 직업", "짝 기도"];

const S = {

function avatar(p, extra = "") {
  return `<span class="av ${p.me ? "me" : ""} ${extra}" style="background:${p.color}" aria-hidden="true">${esc(p.name.slice(0, 1))}</span>`;
}
function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), 2200);
}
function typeOf(counts) {
  const max = Math.max(...Object.values(counts));
  return Object.keys(counts).filter((k) => counts[k] === max);
}
function typeLabel(keys) { return keys.map((k) => TYPES[k].name).join(" + "); }
function badge(k) { return `<span class="badge" style="background:${TYPES[k].color}">${k} ${TYPES[k].name}</span>`; }

// ---------------- Top bar ----------------
function renderBar() {
  const bar = $("#bar");
  bar.hidden = S.step < 0;
  if (S.step < 0) return;
  $("#groupPill").textContent = `${S.group.name} · ${S.group.members.length}명`;
  $("#steps").innerHTML = STEPS.map((n, i) =>
    `<button type="button" class="${i < S.step ? "done" : ""} ${i === S.step ? "on" : ""}" ${i > S.reached ? "disabled" : ""} data-go="${i}"><i></i><span>${String(i + 1).padStart(2, "0")} ${n}</span></button>`).join("");
  $("#steps").onclick = (e) => { const b = e.target.closest("[data-go]"); if (b && !b.disabled) go(Number(b.dataset.go)); };
}
function go(step) {
  clearTimers();
  S.step = step; S.reached = Math.max(S.reached, step);
  renderBar();
  window.scrollTo({ top: 0, behavior: "smooth" });
  [renderPrayer, renderTest, renderShower, renderApply, renderDream, renderPair, renderDone][step]();
}

function makeGroups() {
  const n = S.people.length;

  $("#people").classList.remove("shuffle");
  $("#groupsBox").innerHTML = `<div class="groups">${S.groups.map((g) => `

// ---------------- 02. Personality test ----------------
function renderTest() {
  if (S.answers.length >= QUESTIONS.length) return renderResult();
  const i = S.answers.length, q = QUESTIONS[i];
  app.innerHTML = `<section class="screen">
    <div class="row" style="justify-content:space-between"><p class="eyebrow">02 · 성격 테스트</p><span class="muted" style="font-variant-numeric:tabular-nums">${i + 1} / ${QUESTIONS.length}</span></div>

    <div class="opts">${["A", "B", "C", "D"].map((k, j) => `<button type="button" class="opt" data-k="${k}"><b>${k}</b>${esc(q[j + 1])}</button>`).join("")}</div>
    <div class="row" style="justify-content:space-between">
      <span class="muted">나와 가장 가까운 것 하나를 눌러요.</span>
      <button class="btn ghost small" id="auto" type="button">⚡ 자동으로 빠르게</button>
    </div>
  </section>`;
  app.querySelector(".opts").onclick = (e) => {
    const b = e.target.closest(".opt"); if (!b || app.dataset.busy) return;
    app.dataset.busy = "1"; b.classList.add("picked");
    S.answers.push(b.dataset.k);
    setTimeout(() => { delete app.dataset.busy; renderTest(); }, 110);
  };
  $("#auto").onclick = autoTest;
}
function autoTest() {
  // Demo: answers the remaining questions in a blur, leaning towards one type.
  const lean = pick(["A", "B", "C", "D"]);
  const step = () => {
    if (S.answers.length >= QUESTIONS.length) return renderResult();
    const k = Math.random() < 0.55 ? lean : pick(["A", "B", "C", "D"]);
    const b = app.querySelector(`.opt[data-k="${k}"]`);
    if (b) b.classList.add("picked");
    S.answers.push(k);
    timers.push(setTimeout(() => { renderTest(); $("#auto") && ($("#auto").disabled = true); timers.push(setTimeout(step, 70)); }, 60));
  };
  step();
}

    S.myTypes = typeOf(S.counts);

  }

    $("#memberLines").innerHTML = me + S.members.map((m) => `<div class="member">${avatar(m)}<div><b>${esc(m.name)}</b> ${m.line ? badge(m.type) : ""}

// Round 0: I'm the hero and friends write my strengths. Then I write three for each friend.
function renderShower() {
  const heroes = [S.me, ...S.members];
  const hero = heroes[S.heroIndex] || S.me;
  const isMe = hero.me;
  app.innerHTML = `<section class="screen">
    <div class="row" style="justify-content:space-between"><p class="eyebrow">03 · 칭찬 샤워 · 25분</p><span class="muted">${S.heroIndex + 1} / ${heroes.length}번째 주인공</span></div>
    <div class="hero-name">${avatar(hero)}<div><p class="muted">지금 주인공</p><h2>${esc(hero.name)}${isMe ? " (나)" : ""}</h2></div></div>
    <p class="rules">구체적으로 말하기 · 놀리는 칭찬 하지 않기 · 외모보다 행동과 성품을 칭찬하기</p>
    <div id="box"></div>
  </section>`;
  isMe ? showerReceive() : showerGive(hero);
}
function showerReceive() {
  const box = $("#box");
  const already = S.received.length > 0;
  box.innerHTML = `<div class="card"><h3>친구들이 말해 준 나의 장점</h3><div class="praise" id="praise"></div></div>
    <button class="btn full" id="thanks" ${already ? "" : "disabled"}>“고마워” · 다음 주인공</button>`;
  const draw = () => { $("#praise").innerHTML = S.received.map((r) => `<div class="praise-item"><span class="who">${avatar(r.from)}${esc(r.from.name)}</span><p>“${esc(S.me.name)}의 장점 세 가지는 ${r.items.map(esc).join(", ")}야.”</p></div>`).join("") || `<p class="typing">친구들이 쓰는 중</p>`; };
  draw();
  if (!already) {
    // Friends lean towards my type's strengths, plus one from their own eye.
    const mine = S.myTypes.flatMap((k) => TYPES[k].strengths);
    const all = Object.values(TYPES).flatMap((t) => t.strengths);
    let tm = 500;
    S.members.forEach((m) => {
      tm += rnd(600, 1100);
      later(tm, () => {
        const items = shuffle(mine).slice(0, 2).concat(pick(all.filter((x) => !mine.includes(x))));
        S.received.push({ from: m, items: shuffle(items) }); draw();
        if (S.received.length === S.members.length) $("#thanks").disabled = false;
      });
    });
  }
  $("#thanks").onclick = () => { toast("고마워 🙂"); S.heroIndex = 1; renderShower(); };
}
function showerGive(hero) {
  const box = $("#box");
  const mem = S.members.find((m) => m.id === hero.id);
  const ideas = shuffle([...new Set(TYPES[mem.type].strengths.concat(pick(Object.values(TYPES)).strengths))]).slice(0, 6);
  const cur = S.given[hero.id] || ["", "", ""];
  box.innerHTML = `<div class="card">
      <h3>${esc(hero.name)}의 장점 세 가지</h3>
      <p class="serif" style="font-size:17px">“${esc(hero.name)}의 장점 세 가지는 ___, ___, ___야.”</p>
      <div class="three">${cur.map((v, i) => `<input class="input" id="g${i}" maxlength="30" placeholder="장점 ${i + 1}" value="${esc(v)}">`).join("")}</div>
      <p class="muted">눌러서 빠르게 채우기</p>
      <div class="chips" id="ideas">${ideas.map((x) => `<button type="button" class="chip">${esc(x)}</button>`).join("")}</div>
    </div>
    <div class="card"><h3>다른 친구들이 ${esc(hero.name)}에게</h3><div class="praise" id="others"><p class="typing">쓰는 중</p></div></div>
    <button class="btn full" id="send">보내기 · ${S.heroIndex + 1 < S.members.length + 1 ? "다음 주인공" : "나에게 적용하기로"}</button>`;
  $("#ideas").onclick = (e) => {
    const c = e.target.closest(".chip"); if (!c) return;
    const empty = [0, 1, 2].map((i) => $("#g" + i)).find((x) => !x.value.trim());
    if (empty) { empty.value = c.textContent; c.classList.add("on"); }
  };
  // Other friends' praise for this hero appears too.
  const others = S.members.filter((m) => m.id !== hero.id);
  const lines = [];
  let tm = 300;
  others.forEach((o) => { tm += rnd(500, 900); later(tm, () => {
    lines.push(`<div class="praise-item"><span class="who">${avatar(o)}${esc(o.name)}</span><p>${shuffle(TYPES[mem.type].strengths).slice(0, 3).map(esc).join(", ")}</p></div>`);
    $("#others").innerHTML = lines.join("");
  }); });
  $("#send").onclick = () => {
    const vals = [0, 1, 2].map((i) => $("#g" + i).value.trim());
    if (vals.filter(Boolean).length < 3) { toast("장점 세 가지를 모두 적어 주세요"); return; }
    S.given[hero.id] = vals;
    S.heroIndex++;
    if (S.heroIndex > S.members.length) go(3); else renderShower();
  };
}

  app.innerHTML = `<section class="screen">

      <label class="f" for="un">몰랐던 내 장점은?<textarea class="input" id="un" placeholder="${esc(unknown[0] || "예: 분위기를 밝게 해")}">${esc(a.unknown)}</textarea></label>
    </div>
    <div class="card">
      <h3>나의 비전 한 문장</h3>
      <p class="sentence">나는 <input class="input" id="v1" size="10" placeholder="따뜻한 말" value="${esc(a.v1)}">(으)로
        <input class="input" id="v2" size="14" placeholder="외로운 친구들" value="${esc(a.v2)}">을(를) 돕는 사람이 되고 싶다.</p>
    </div>
    <div class="card">
      <h3>이번 주 작은 실천 하나</h3>
      <div class="chips" id="cat">${["지혜", "몸", "하나님", "사람"].map((c) => `<button type="button" class="chip ${a.cat === c ? "on" : ""}">${c}</button>`).join("")}</div>
      <input class="input" id="pr" maxlength="60" placeholder="예: 새로 온 친구에게 먼저 말 걸기" value="${esc(a.practice)}">
    </div>
    <div class="row"><button class="btn ghost" id="fill" type="button">예시로 채우기</button><button class="btn" id="next" style="flex:1">꿈과 직업으로</button></div>
  </section>`;
  $("#cat").onclick = (e) => { const c = e.target.closest(".chip"); if (!c) return; a.cat = c.textContent; $("#cat").querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === c)); };
  $("#fill").onclick = () => {
    $("#un").value ||= unknown[0] || "분위기를 밝게 해"; $("#v1").value ||= "따뜻한 말"; $("#v2").value ||= "외로운 친구들"; $("#pr").value ||= "새로 온 친구에게 먼저 말 걸기";
    if (!a.cat) { a.cat = "사람"; $("#cat").querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x.textContent === "사람")); }
  };
  $("#next").onclick = () => {
    Object.assign(a, { overlap: $("#ov").value.trim(), unknown: $("#un").value.trim(), v1: $("#v1").value.trim(), v2: $("#v2").value.trim(), practice: $("#pr").value.trim() });
    if (!a.v1 || !a.v2) { toast("비전 한 문장의 빈칸을 채워 주세요"); return; }
    go(4);
  };
}

// ---------------- 05. Dream & job ----------------
const JOBS = [["의사", "가난한 환자도 정성껏, 마음까지 돌보는 의사"], ["변호사", "정직하고, 힘없는 사람 편에 서는 변호사"],
  ["선생님", "뒤처진 한 명을 끝까지 포기하지 않는 선생님"], ["사업가", "직원을 아끼고 번 돈으로 이웃을 살리는 사업가"]];
const MONEY = ["나와 가족", "헌금과 나눔", "다른 사람을 세우는 일", "꿈을 위한 배움"];
function renderDream() {
  const d = S.dream;
  app.innerHTML = `<section class="screen">
    <p class="eyebrow">05 · 꿈과 직업 · 10분</p>
    <h2>“무엇이 될까?”보다<br>“어떤 사람이 될까?”</h2>
    <p class="lead">직업은 내가 하는 일이에요. 하나님이 더 궁금해하시는 건 그 일 안에서 내가 어떤 사람인가예요.</p>
    <div class="card"><div class="jobs">${JOBS.map(([j, ex], i) => `<div class="job"><b>${j}</b><span class="ex">${ex}</span>
      <input class="input" id="job${i}" placeholder="나라면 어떤 ${j}가 되고 싶나요?" value="${esc(d.mine[j] || "")}"></div>`).join("")}</div></div>
    <div class="card">
      <h3>내 꿈의 직업</h3>
      <div class="three">${[0, 1].map((i) => `<input class="input" id="dj${i}" placeholder="내 꿈 ${i + 1} · 예: 간호사, 어떤 간호사?" value="${esc(d.jobs[i])}">`).join("")}</div>
    </div>
    <div class="card">
      <h3>그 일로 번 돈은 어떻게 쓰고 싶나요?</h3>
      <p class="muted">중요한 순서대로 눌러요 (1 → 4). 다시 누르면 지워져요.</p>
      <div class="chips" id="money"></div>
    </div>
    <div class="card"><label class="f" for="shine">그 자리에서 하나님의 빛을 어떻게 비출 수 있을까요?<textarea class="input" id="shine" placeholder="예: 바쁜 날에도 환자 이름을 불러 주며 인사하기">${esc(d.shine)}</textarea></label></div>
    <div class="row"><button class="btn ghost" id="fill" type="button">예시로 채우기</button><button class="btn" id="next" style="flex:1">짝 기도로</button></div>
  </section>`;
  const drawMoney = () => { $("#money").innerHTML = MONEY.map((m) => { const n = d.money.indexOf(m) + 1; return `<button type="button" class="chip ${n ? "on" : ""}">${n ? `<span class="n">${n}</span>` : ""}${m}</button>`; }).join(""); };
  drawMoney();
  $("#money").onclick = (e) => { const c = e.target.closest(".chip"); if (!c) return; const m = MONEY.find((x) => c.textContent.endsWith(x)); const i = d.money.indexOf(m); i >= 0 ? d.money.splice(i, 1) : d.money.push(m); drawMoney(); };
  $("#fill").onclick = () => {
    $("#dj0").value ||= "간호사 — 아픈 사람의 이야기를 끝까지 들어 주는 간호사"; $("#job2").value ||= "질문하는 학생을 반가워하는 선생님";
    $("#shine").value ||= "바쁜 날에도 환자 이름을 불러 주며 인사하기"; if (!d.money.length) { d.money = ["헌금과 나눔", "나와 가족", "다른 사람을 세우는 일", "꿈을 위한 배움"]; drawMoney(); }
  };
  $("#next").onclick = () => {
    JOBS.forEach(([j], i) => (d.mine[j] = $("#job" + i).value.trim()));
    d.jobs = [0, 1].map((i) => $("#dj" + i).value.trim()); d.shine = $("#shine").value.trim();
    go(5);
  };
}

// ---------------- 06. Pair prayer ----------------
const REQUESTS = ["다음 주 시험 때 마음이 흔들리지 않도록", "동생이랑 덜 싸우고 먼저 사과할 수 있도록", "새 학교에서 좋은 친구를 만나도록", "할머니 건강이 회복되도록", "진로를 정할 지혜를 주시도록"];
const VISIONS = ["웃음으로 지친 친구들을", "꼼꼼함으로 함께 일하는 사람들을", "따뜻한 말로 외로운 친구들을", "용기로 새로운 일을 시작하는 사람들을"];
function renderPair() {
  const p = S.pair;
  if (!p.partner) {
    const m = pick(S.members);
    p.partner = { ...m, vision: pick(VISIONS), req: null };
  }
  const pt = p.partner;
  app.innerHTML = `<section class="screen">
    <p class="eyebrow">06 · 짝 기도 · 5분</p>
    <h2>오늘의 짝은 ${esc(pt.name)}</h2>
    <p class="lead">서로의 비전과 꿈을 나누고, 그것을 위해 기도해 줘요. 다음 모임에서 “해 봤어?” 하고 물어봐 주세요.</p>
    <div class="card">
      <div class="hero-name">${avatar(pt)}<div><h3>${esc(pt.name)}의 비전</h3><p>“나는 ${esc(pt.vision)} 돕는 사람이 되고 싶어.”</p></div></div>
      <div id="req"><p class="typing">${esc(pt.name)}이(가) 기도제목을 쓰는 중</p></div>
    </div>
    <div class="card">
      <h3>나의 비전</h3>
      <p>“나는 ${esc(S.apply.v1 || "…")}(으)로 ${esc(S.apply.v2 || "…")}을(를) 돕는 사람이 되고 싶어.”</p>
      <label class="f" for="myreq">나의 기도제목<textarea class="input" id="myreq" placeholder="예: 이번 주 작은 실천을 끝까지 해낼 수 있도록">${esc(p.myReq)}</textarea></label>
    </div>
    <button class="btn full" id="pray">서로를 위해 기도했어요</button>
  </section>`;
  const showReq = () => { $("#req").innerHTML = `<div class="praise-item"><span class="who">기도제목</span><p>${esc(pt.req)}</p></div>`; };
  if (pt.req) showReq(); else later(1200, () => { pt.req = pick(REQUESTS); showReq(); });
  $("#pray").onclick = () => { p.myReq = $("#myreq").value.trim() || "이번 주 작은 실천을 끝까지 해낼 수 있도록"; p.prayed = true; go(6); };
}

// ---------------- Done: my growth note ----------------
function renderDone() {
  S.step = 5; renderBar();
  $("#steps").querySelectorAll("button").forEach((b) => b.classList.add("done"));
  const a = S.apply, d = S.dream;
  const got = [...new Set(S.received.flatMap((r) => r.items))];
  app.innerHTML = `<section class="screen">
    <svg class="candle" viewBox="0 0 120 150" aria-hidden="true">
      <defs><radialGradient id="g" cx="50%" cy="40%" r="50%"><stop offset="0" stop-color="#e9a93a" stop-opacity=".45"/><stop offset="1" stop-color="#e9a93a" stop-opacity="0"/></radialGradient></defs>
      <circle cx="60" cy="50" r="56" fill="url(#g)"/>
      <rect x="38" y="70" width="44" height="66" rx="4" fill="#fffdf9" stroke="#1b2133" stroke-width="2.4"/>
      <path d="M60 70 V58" stroke="#1b2133" stroke-width="2"/>
      <g class="flame"><path d="M60 26 C55 34 50 41 50 47 A10 10 0 0 0 70 47 C70 41 65 34 60 26 Z" fill="#f2b632" stroke="#1b2133" stroke-width="2" stroke-linejoin="round"/></g>
      <path d="M14 136 H106" stroke="#1b2133" stroke-width="2.4"/>
    </svg>
    <div class="note">

        <p class="muted">${S.group.name} · ${new Date().toLocaleDateString("ko-KR")}</p>
      </div>
      <dl class="note-body">
        <div><dt>나의 유형</dt><dd>${S.myTypes.map(badge).join(" ")} <span class="muted">${S.myTypes.map((k) => TYPES[k].who).join(", ")}</span></dd></div>
        <div><dt>친구들이 말해 준 나의 장점</dt><dd>${got.map(esc).join(" · ")}</dd></div>
        ${a.unknown ? `<div><dt>몰랐던 내 장점</dt><dd>${esc(a.unknown)}</dd></div>` : ""}
        <div><dt>나의 비전 한 문장</dt><dd class="serif" style="font-size:18px">나는 ${esc(a.v1)}(으)로 ${esc(a.v2)}을(를) 돕는 사람이 되고 싶다.</dd></div>
        ${a.practice ? `<div><dt>이번 주 작은 실천${a.cat ? ` · ${a.cat}` : ""}</dt><dd>${esc(a.practice)}</dd></div>` : ""}
        ${d.jobs.filter(Boolean).length ? `<div><dt>내 꿈</dt><dd>${d.jobs.filter(Boolean).map(esc).join("<br>")}</dd></div>` : ""}
        ${d.money.length ? `<div><dt>번 돈은 이렇게</dt><dd>${d.money.map((m, i) => `${i + 1}. ${m}`).join("  ")}</dd></div>` : ""}
        <div><dt>짝 ${esc(S.pair.partner.name)}의 기도제목</dt><dd>${esc(S.pair.partner.req)}</dd></div>
        <div><dt>나의 기도제목</dt><dd>${esc(S.pair.myReq)}</dd></div>
      </dl>
    </div>
    <div class="verse"><p>너희는 세상의 빛이라</p><small>MATTHEW 5:14–16 · COLOSSIANS 3:23</small></div>
    <button class="btn ghost full" id="again">처음부터 다시 체험하기</button>
  </section>`;
  $("#again").onclick = () => location.reload();
}

renderJoin();
</script>
