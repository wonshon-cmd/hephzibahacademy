<main>
<section class="section" style="border-top:0;padding-bottom:40px">
  <div class="wrap">

    <h1 class="display" style="font-size:clamp(44px,6.4vw,96px)">Personality test.</h1>

  </div>

  <div class="wrap"><div id="pt" class="pt" aria-live="polite"></div></div>

<style>
.pt{max-width:640px}
.pt-list{margin:0 0 16px;padding-left:20px;font-size:18px;line-height:1.7;color:var(--ink-2)}
.pt-note{color:var(--muted);font-size:15px;max-width:60ch;margin:12px 0 24px}
.pt-progress{height:3px;background:var(--hair);margin-bottom:24px}
.pt-progress i{display:block;height:100%;background:var(--ink);transition:width .3s}
.pt-stage{display:grid;place-items:center;padding:8px 0 20px}
.pt .quiz-actions,.pt .quiz-sub{padding-left:0;padding-right:0;margin:0;max-width:none}
.pt .quiz-sub button:disabled{opacity:.35;cursor:default}
.pt-results{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:24px;margin-top:8px}
.pt-actions{display:flex;gap:12px;flex-wrap:wrap}
</style>
<script src="/js/personality-test.js" defer></script>
