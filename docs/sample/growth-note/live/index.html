<!doctype html>
<html lang="ko">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23fbf8f2'/%3E%3Cpath d='M10 22h11v12h17V12h13v41H38V42H21v11H10z' fill='%231b2133'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Gowun+Batang:wght@400;700&family=Fraunces:ital,opsz,wght@1,9..144,400&display=swap">
<style>
/* Growth Note · big screen for the room. Same brand as the phone app:
   warm paper, navy ink, one soft gold light; top bar with the lockup, bottom bar with the six steps. */
:root {
  --paper: #fbf8f2; --paper-2: #f4ede2; --card: #fffdf9; --ink: #1b2133; --ink-2: #4b4640; --muted: #8b8276;
  --hair: rgba(120, 92, 55, 0.18); --accent: #e4c58c; --accent-ink: #9a8152; --accent-soft: #f9f3e6;
  --tA: #1d3a6b; --tB: #c0602a; --tC: #2f6b4f; --tD: #6a4c93;
  --sans: "Plus Jakarta Sans", "Noto Sans KR", system-ui, sans-serif;
  --kr: "Noto Sans KR", "Plus Jakarta Sans", system-ui, sans-serif;
  --serif: "Gowun Batang", Georgia, serif;
  --latin-serif: "Fraunces", "Gowun Batang", Georgia, serif;
  --ease: cubic-bezier(.2, .7, .1, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--kr); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 clamp(16px, 2.6vw, 40px); flex: none; }
.bar.top { height: 64px; border-bottom: 1px solid var(--ink); }
.bar.bottom { height: 60px; border-top: 1px solid var(--ink); font-size: 14px; }
.lockup { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; }
.lockup svg { width: 30px; height: 30px; }
.lockup b { font-family: var(--sans); font-size: 18px; display: block; line-height: 1; letter-spacing: -.01em; }
.lockup small { font-family: var(--sans); font-size: 9px; letter-spacing: .32em; font-weight: 600; display: block; margin-top: 4px; }
.join { font-size: clamp(14px, 1.3vw, 20px); font-weight: 500; }
.join b { font-family: var(--sans); font-weight: 800; letter-spacing: .14em; background: var(--ink); color: var(--paper); padding: 2px 10px; border-radius: 6px; margin-left: 6px; }
.count { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-variant-numeric: tabular-nums; }
.count i { width: 9px; height: 9px; border-radius: 50%; background: #1f9d55; box-shadow: 0 0 0 4px rgba(31,157,85,.15); }
.steps { display: flex; gap: 6px; align-items: center; }
.steps span { font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.steps span.on { background: var(--ink); color: var(--paper); }
.steps span.done { color: var(--ink); }
.ctl { display: flex; gap: 6px; align-items: center; }
.ctl button { background: transparent; border: 1px solid var(--hair); border-radius: 10px; padding: 7px 12px; font-weight: 700; cursor: pointer; font: inherit; font-size: 14px; }
.ctl button:hover { border-color: var(--ink); }
.timer { font-family: var(--sans); font-variant-numeric: tabular-nums; font-weight: 800; font-size: 15px; min-width: 52px; text-align: right; }
.demo { font-family: var(--sans); font-size: 10px; font-weight: 800; letter-spacing: .18em; color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 8px; }

.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.scene { position: absolute; inset: 0; padding: clamp(24px, 4.5vh, 64px) clamp(24px, 5vw, 96px); display: grid; gap: clamp(16px, 3vh, 32px); align-content: start; animation: rise .5s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.glow::before { content: ""; position: absolute; right: -10%; top: -20%; width: 70%; height: 120%; background: radial-gradient(closest-side, rgba(228,197,140,.22), rgba(228,197,140,0)); filter: blur(20px); pointer-events: none; animation: breathe 7s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .6; transform: scale(1.05); } }
.scene > * { position: relative; }
.head { display: grid; grid-template-columns: auto 1fr; gap: 2px 20px; align-items: baseline; }
.head .no { font-family: var(--latin-serif); font-style: italic; font-size: clamp(56px, 7vw, 110px); line-height: .85; color: var(--accent); grid-row: span 2; }
.head h1 { margin: 0; font-size: clamp(34px, 4.6vw, 80px); line-height: 1.05; letter-spacing: -.045em; font-weight: 800; }
.head p { margin: 0; color: var(--muted); font-size: clamp(15px, 1.4vw, 22px); }
.tag { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .22em; color: var(--accent-ink); }
.title-xl { margin: 0; font-size: clamp(48px, 8vw, 132px); line-height: 1; letter-spacing: -.05em; font-weight: 800; }
.dot { display: inline-block; width: .15em; height: .15em; border-radius: 50%; background: var(--accent); margin-left: .08em; animation: blink 3s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .3; } }
.tagline { font-family: var(--latin-serif); font-style: italic; color: var(--accent-ink); font-size: clamp(20px, 2vw, 32px); margin: 0; }
.cols { display: grid; grid-template-columns: 1.1fr .9fr; gap: 5vw; align-items: center; min-height: 0; }
.card { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; padding: clamp(14px, 1.6vw, 24px); display: grid; gap: 12px; min-width: 0; }
.qr { width: clamp(150px, 16vw, 240px); aspect-ratio: 1; background: var(--card); border: 1px solid var(--hair); border-radius: 16px; display: grid; place-items: center; }
.qr svg { width: 82%; height: 82%; }
.av { width: clamp(30px, 2.6vw, 42px); height: clamp(30px, 2.6vw, 42px); border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; color: #fff; font-size: clamp(12px, 1vw, 16px); flex: none; animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } }
.crowd { display: flex; flex-wrap: wrap; gap: 8px; }
.big { font-family: var(--sans); font-weight: 800; font-size: clamp(64px, 9vw, 150px); letter-spacing: -.05em; line-height: .9; font-variant-numeric: tabular-nums; }
.big small { font-size: .2em; letter-spacing: 0; color: var(--muted); margin-left: 10px; font-weight: 600; }
.groups { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(10px, 1.2vw, 18px); }
.group { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; padding: clamp(14px, 1.4vw, 22px); display: grid; gap: 12px; align-content: start; animation: rise .5s var(--ease) both; }
.group h3 { margin: 0; font-size: clamp(18px, 1.6vw, 26px); display: flex; justify-content: space-between; align-items: baseline; }
.group h3 small { font-size: .6em; color: var(--muted); font-weight: 600; }
.group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.group li { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: clamp(14px, 1.2vw, 18px); }
.pbar { height: 8px; border-radius: 8px; background: var(--paper-2); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 8px; transition: width .6s var(--ease); }
.badge { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; color: #fff; margin-left: auto; animation: pop .4s ease both; }
.dist { display: grid; gap: clamp(10px, 1.6vh, 18px); }
.dist div { display: grid; grid-template-columns: clamp(110px, 10vw, 170px) 1fr 50px; gap: 16px; align-items: center; font-size: clamp(16px, 1.4vw, 22px); font-weight: 700; }
.dist div small { display: block; font-family: var(--serif); font-weight: 400; color: var(--muted); font-size: .8em; }
.dist .t { height: clamp(16px, 2vh, 24px); border-radius: 30px; background: var(--paper-2); overflow: hidden; }
.dist .t i { display: block; height: 100%; border-radius: 30px; transition: width .8s var(--ease); }
.dist em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
.wall { columns: 3 280px; column-gap: 16px; }
.bubble { break-inside: avoid; background: var(--accent-soft); border-radius: 18px 18px 18px 6px; padding: 14px 16px; margin-bottom: 14px; display: grid; gap: 6px; animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; transform-origin: left bottom; }
.bubble .who { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; }
.bubble .who .av { width: 24px; height: 24px; font-size: 11px; animation: none; }
.bubble p { margin: 0; font-family: var(--serif); font-size: clamp(16px, 1.4vw, 21px); line-height: 1.5; }
.verse { font-family: var(--serif); font-size: clamp(30px, 3.6vw, 60px); line-height: 1.5; margin: 0; }
.verse small { display: block; font-family: var(--sans); font-size: 13px; letter-spacing: .2em; color: var(--accent-ink); font-weight: 700; margin-top: 18px; }
.money { display: grid; gap: 14px; }
.money div { display: grid; grid-template-columns: 34px 1fr 60px; gap: 14px; align-items: center; font-size: clamp(16px, 1.4vw, 22px); font-weight: 700; }
.money .r { font-family: var(--latin-serif); font-style: italic; color: var(--accent-ink); font-size: 1.4em; }
.money em { font-style: normal; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.money .t { height: 14px; border-radius: 14px; background: var(--paper-2); overflow: hidden; }
.money .t i { display: block; height: 100%; background: var(--accent); border-radius: 14px; transition: width .8s var(--ease); }
.pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.pair { display: flex; align-items: center; gap: 8px; white-space: nowrap; background: var(--card); border: 1px solid var(--hair); border-radius: 999px; padding: 8px 16px 8px 8px; font-weight: 700; font-size: clamp(14px, 1.2vw, 18px); animation: rise .4s var(--ease) both; }
.pair .heart { color: var(--accent-ink); margin: 0 4px; }
.pair .ok { margin-left: auto; font-size: 13px; color: #1f9d55; }
.bigtimer { font-family: var(--sans); font-weight: 800; font-size: clamp(64px, 8vw, 128px); letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1; }
.candle { width: clamp(160px, 18vw, 280px); }
.candle .flame { transform-origin: 55px 50px; animation: flicker 2.4s ease-in-out infinite; }
@keyframes flicker { 25% { transform: scale(1.05,.95) rotate(-2deg); } 50% { transform: scale(.96,1.05) rotate(1.5deg); } 75% { transform: scale(1.02,.98) rotate(-1deg); } }
.muted { color: var(--muted); }
@media (max-width: 900px) { .groups { grid-template-columns: 1fr 1fr; } .cols { grid-template-columns: 1fr; } .steps { display: none; } body { overflow: auto; } .stage { min-height: 80vh; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="bar top">
  <a class="lockup" href="/" aria-label="Hephzibah Academy"><svg viewBox="9 11 43 43" aria-hidden="true"><path d="M10 22h11v12h17V12h13v41H38V42H21v11H10z" fill="currentColor"/></svg><span><b>Hephzibah</b><small>ACADEMY</small></span></a>
  <span class="join">hephzibahacademy.org/j/ <b>HZ27</b></span>
  <span class="count"><i></i><span id="count">0명 입장</span> <span class="demo">DEMO</span></span>
</header>
<main class="stage" id="stage"></main>
<footer class="bar bottom">
  <div class="steps" id="steps"></div>
  <div class="ctl"><span class="timer" id="timer"></span><button id="prev" aria-label="이전">←</button><button id="next" aria-label="다음">→</button><button id="fs" aria-label="전체 화면">⛶</button></div>
</footer>

<script>
// Hephzibah Academy · Growth Note — big-screen live session (demo).
// A pretend class of 18 joins, is split into groups, and moves through the six steps.
// → / Space next · ← back · F full screen.
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let timers = [];
const later = (ms, fn) => timers.push(setTimeout(fn, ms));
const LOGO_PATH = "M10 22h11v12h17V12h13v41H38V42H21v11H10z";

const COLORS = ["#1d3a6b", "#2f6b4f", "#a8741a", "#8e3b2e", "#6a4c93", "#2b6f7a", "#7a5a2b", "#3d5a80", "#9c4f6b"];
const NAMES = ["민지", "서준", "하은", "도윤", "지우", "예준", "서연", "시우", "수아", "주원", "지안", "하준", "윤서", "은우", "채원", "건우", "다은"];
const GROUP_NAMES = ["빛 조", "소금 조", "등불 조", "씨앗 조", "샘물 조"];

const TYPES = {
  A: { name: "리더형", who: "느헤미야", desc: "방향을 잡고 사람들을 이끌어요.", grow: "다른 사람의 속도를 기다려 주기", color: "var(--tA)",
       strengths: ["앞장서서 이끌어 줘", "결정을 잘해", "책임감이 강해", "목표가 분명해", "어려운 일도 먼저 나서"] },
  B: { name: "열정형", who: "베드로", desc: "에너지와 아이디어가 넘쳐요.", grow: "끝까지 마무리하기", color: "var(--tB)",
       strengths: ["웃음이 많아", "아이디어가 많아", "분위기를 밝게 해", "새로운 걸 겁내지 않아", "에너지가 넘쳐"] },
  C: { name: "돌봄형", who: "바나바", desc: "사람을 세워 주고 격려해요.", grow: "필요할 때 거절하기", color: "var(--tC)",
       strengths: ["먼저 연락해 줘", "말을 끝까지 들어 줘", "친구들을 잘 챙겨", "따뜻하게 격려해 줘", "새 친구한테 먼저 다가가"] },
  D: { name: "신중형", who: "누가", desc: "꼼꼼하고 정확해요.", grow: "완벽하지 않아도 시작하기", color: "var(--tD)",
       strengths: ["약속을 잘 지켜", "꼼꼼해", "정리를 잘해", "맡은 일을 끝까지 해", "생각이 깊어"] },
};

// 20 questions. A = leader, B = passion, C = care, D = careful (same as the printed note, plus 15 more).

const STEPS = ["시작 기도", "성격 테스트", "칭찬 샤워", "나에게 적용", "꿈과 직업", "짝 기도"];
const MINUTES = [3, 10, 25, 10, 10, 5];
const VISIONS = [["따뜻한 말", "외로운 친구들"], ["웃음", "지친 사람들"], ["꼼꼼함", "함께 일하는 사람들"], ["용기", "새로운 일을 시작하는 친구들"], ["기도", "아픈 가족들"], ["음악", "예배하는 사람들"], ["경청", "고민 있는 친구들"], ["정리하는 힘", "바쁜 선생님들"]];
const DREAMS = ["아픈 사람의 이야기를 끝까지 들어 주는 간호사", "질문을 반가워하는 선생님", "직원을 가족처럼 아끼는 사업가", "정직하게 일하는 엔지니어", "약한 사람 편에 서는 변호사", "사람을 살리는 디자인을 하는 디자이너"];
const MONEY = ["헌금과 나눔", "나와 가족", "다른 사람을 세우는 일", "꿈을 위한 배움"];

// The pretend class.
const people = shuffle(NAMES).concat(["지윤"]).slice(0, 18).map((name, i) => ({ id: i, name, color: COLORS[i % COLORS.length], type: pick(["A", "B", "C", "D"]) }));
const groups = (() => { const g = Array.from({ length: 4 }, (_, i) => ({ name: GROUP_NAMES[i], members: [] })); shuffle(people).forEach((p, i) => g[i % 4].members.push(p)); return g; })();
const S = { scene: 0, joined: 0, sec: 0 };
const av = (p) => `<span class="av" style="background:${p.color}" aria-hidden="true">${esc(p.name.slice(0, 1))}</span>`;
const badge = (k) => `<span class="badge" style="background:${TYPES[k].color}">${TYPES[k].name}</span>`;
const head = (n, title, sub) => `<div class="head"><span class="no">${String(n).padStart(2, "0")}</span><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>`;

function setCount(n) { S.joined = n; $("#count").textContent = `${n}명 입장`; }

// ---------------- scenes ----------------
const SCENES = [
  { step: -1, render(el) {
      el.classList.add("glow");
      el.innerHTML = `<div class="cols" style="height:100%">
        <div style="display:grid;gap:18px">
          <span class="tag">복음에 기반한 배움 · LEARN / THRIVE / SHARE</span>
          <h1 class="title-xl">함께하는<br>성장 노트<span class="dot"></span></h1>
          <p class="tagline">Light and salt, together.</p>
          <div class="crowd" id="crowd"></div>
        </div>
        <div style="display:grid;gap:16px;justify-items:center">
          <div class="qr">${qr()}</div>
          <p class="join" style="margin:0">휴대폰으로 입장 · <b>HZ27</b></p>
        </div></div>`;
      const crowd = $("#crowd");
      let tm = 300;
      people.forEach((p, i) => { if (i < S.joined) { crowd.insertAdjacentHTML("beforeend", av(p)); return; } tm += rnd(150, 380); later(tm, () => { crowd.insertAdjacentHTML("beforeend", av(p)); setCount(i + 1); }); });
    } },
  { step: -1, render(el) {
      setCount(people.length);
      el.innerHTML = `<div class="head"><span class="no" style="font-size:clamp(40px,5vw,80px)">✦</span><h1>조를 나눴어요</h1><p>4~5명씩 랜덤 · ${people.length}명 · ${groups.length}개 조</p></div>
        <div class="groups">${groups.map((g, i) => `<div class="group" style="animation-delay:${i * 120}ms"><h3>${g.name}<small>${g.members.length}명</small></h3>
          <ul>${g.members.map((p) => `<li>${av(p)}${esc(p.name)}</li>`).join("")}</ul></div>`).join("")}</div>`;
    } },
  { step: 0, render(el) {
      el.classList.add("glow");
      el.innerHTML = `${head(1, "시작 기도", "3분 · 함께")}
        <div style="display:grid;place-items:center;flex:1;padding-top:4vh"><p class="verse" style="text-align:center">하나님, 우리가<br>하나님이 지으신 형상대로<br>살아가게 해 주세요.</p></div>`;
    } },
  { step: 1, render(el) {
      el.innerHTML = `${head(2, "성격 테스트", "20문항 · 휴대폰으로")}
        <div class="groups">${groups.map((g, gi) => `<div class="group"><h3>${g.name}<small id="gd${gi}">0/${g.members.length}</small></h3>
          <div class="pbar"><i id="gp${gi}" style="width:0"></i></div>
          <ul>${g.members.map((p) => `<li>${av(p)}${esc(p.name)}<span id="t${p.id}" style="margin-left:auto"></span></li>`).join("")}</ul></div>`).join("")}</div>`;
      const done = groups.map(() => 0);
      let tm = 400;
      shuffle(people).forEach((p) => { tm += rnd(180, 420); later(tm, () => {
        const gi = groups.findIndex((g) => g.members.includes(p)); done[gi]++;
        $("#t" + p.id).outerHTML = badge(p.type);
        $("#gd" + gi).textContent = `${done[gi]}/${groups[gi].members.length}`;
        $("#gp" + gi).style.width = (done[gi] / groups[gi].members.length) * 100 + "%";
      }); });
    } },
  { step: 1, render(el) {
      const c = { A: 0, B: 0, C: 0, D: 0 }; people.forEach((p) => c[p.type]++);
      el.classList.add("glow");
      el.innerHTML = `${head(2, "우리 반의 유형", "다 다르게 지으셨어요")}
        <div class="dist">${["A", "B", "C", "D"].map((k) => `<div><span>${TYPES[k].name}<small>${TYPES[k].who}</small></span><span class="t"><i style="width:0;background:${TYPES[k].color}" data-w="${(c[k] / people.length) * 100}"></i></span><em>${c[k]}명</em></div>`).join("")}</div>`;
      later(150, () => el.querySelectorAll("[data-w]").forEach((i) => (i.style.width = i.dataset.w + "%")));
    } },
  { step: 2, render(el) {
      el.innerHTML = `${head(3, "칭찬 샤워", "구체적으로 · 놀리지 않기 · 외모보다 행동과 성품")}<div class="wall" id="wall"></div>`;
      const wall = $("#wall");
      const pairs = [];
      groups.forEach((g) => g.members.forEach((to) => g.members.filter((f) => f !== to).forEach((from) => pairs.push([from, to]))));
      let tm = 300;
      shuffle(pairs).slice(0, 16).forEach(([from, to]) => { tm += rnd(450, 900); later(tm, () => {
        const items = shuffle(TYPES[to.type].strengths).slice(0, 3);
        wall.insertAdjacentHTML("afterbegin", `<div class="bubble"><span class="who">${av(from)}${esc(from.name)} → ${esc(to.name)}</span><p>${items.map(esc).join(", ")}</p></div>`);
      }); });
    } },
  { step: 3, render(el) {
      el.innerHTML = `${head(4, "나의 비전 한 문장", "나는 ___(으)로 ___을(를) 돕는 사람이 되고 싶다")}<div class="wall" id="wall"></div>`;
      let tm = 300;
      shuffle(people).slice(0, 10).forEach((p, i) => { tm += rnd(600, 1000); later(tm, () => {
        const [a, b] = VISIONS[i % VISIONS.length];
        $("#wall").insertAdjacentHTML("afterbegin", `<div class="bubble"><span class="who">${av(p)}${esc(p.name)}</span><p>나는 ${a}${/[가-힣]/.test(a.slice(-1)) && (a.slice(-1).charCodeAt(0) - 44032) % 28 ? "으로" : "로"} ${b}을 돕는 사람이 되고 싶다.</p></div>`);
      }); });
    } },
  { step: 4, render(el) {
      el.innerHTML = `${head(5, "꿈과 직업", "무엇이 될까보다, 어떤 사람이 될까")}
        <div class="cols" style="align-items:start"><div class="wall" id="wall" style="columns:1"></div>
        <div class="card"><span class="tag">번 돈은 어디에? · 우리 반 순위</span><div class="money" id="money"></div></div></div>`;
      let tm = 300;
      shuffle(people).slice(0, 6).forEach((p, i) => { tm += rnd(700, 1100); later(tm, () => {
        $("#wall").insertAdjacentHTML("afterbegin", `<div class="bubble"><span class="who">${av(p)}${esc(p.name)}</span><p>${DREAMS[i]}</p></div>`);
      }); });
      const score = [62, 54, 48, 36];
      $("#money").innerHTML = MONEY.map((m, i) => `<div><span class="r">${i + 1}</span><span>${m}<span class="t" style="display:block;margin-top:6px"><i style="width:0" data-w="${score[i]}"></i></span></span><em>${Math.round(score[i] / 3.6)}표</em></div>`).join("");
      later(400, () => el.querySelectorAll("[data-w]").forEach((i) => (i.style.width = i.dataset.w + "%")));
    } },
  { step: 5, render(el) {
      const list = []; groups.forEach((g) => { const m = shuffle(g.members); for (let i = 0; i + 1 < m.length; i += 2) list.push([m[i], m[i + 1]]); if (m.length % 2) list[list.length - 1].push(m[m.length - 1]); });
      el.classList.add("glow");
      el.innerHTML = `<div class="cols" style="align-items:start">${head(6, "짝 기도", "비전과 꿈을 나누고, 서로를 위해 기도해요")}<div class="bigtimer" id="pt" style="text-align:right">5:00</div></div>
        <div class="pairs">${list.map((ps, i) => `<div class="pair" style="animation-delay:${i * 60}ms">${ps.map((p) => av(p) + esc(p.name)).join('<span class="heart">♡</span>')}<span class="ok" id="ok${i}"></span></div>`).join("")}</div>`;
      let left = 300;
      const tick = () => { left -= 5; if (left < 0) return; $("#pt").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; later(100, tick); };
      later(600, tick);
      list.forEach((_, i) => later(1500 + rnd(0, 5000), () => { const o = $("#ok" + i); if (o) o.textContent = "기도했어요 ✓"; }));
    } },
  { step: 6, render(el) {
      el.classList.add("glow");
      el.innerHTML = `<div class="cols" style="height:100%">
        <div style="display:grid;gap:20px"><p class="verse">너희는 세상의 빛이라.<small>MATTHEW 5:14–16 · COLOSSIANS 3:23</small></p>
          <p class="muted" style="font-size:clamp(16px,1.4vw,22px);margin:0">다음 모임에서 서로 물어봐 주세요. “해 봤어?”</p></div>
        <svg class="candle" viewBox="0 0 110 140" aria-hidden="true" style="justify-self:center">
          <defs><radialGradient id="cg" cx="50%" cy="40%" r="50%"><stop offset="0" stop-color="#e4c58c" stop-opacity=".55"/><stop offset="1" stop-color="#e4c58c" stop-opacity="0"/></radialGradient></defs>
          <circle cx="55" cy="48" r="52" fill="url(#cg)"/>
          <rect x="35" y="66" width="40" height="62" rx="4" fill="#fffdf9" stroke="#1b2133" stroke-width="2.4"/>
          <path d="M55 66 V55" stroke="#1b2133" stroke-width="2"/>
          <g class="flame"><path d="M55 25 C50 33 46 39 46 45 A9 9 0 0 0 64 45 C64 39 60 33 55 25 Z" fill="#ecd29a" stroke="#1b2133" stroke-width="2" stroke-linejoin="round"/></g>
          <path d="M10 128 H100" stroke="#1b2133" stroke-width="2.4"/>
        </svg></div>`;
    } },
];

// A decorative QR-like mark (the real session shows a scannable QR code).
function qr() {
  let cells = ""; const n = 21; const seed = [...Array(n * n)].map((_, i) => ((i * 7919) % 13) < 6);
  const finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let on = seed[y * n + x];
    if (finder(x, y)) { const fx = x < 7 ? x : x - (n - 7), fy = y < 7 ? y : y - (n - 7); on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx > 1 && fx < 5 && fy > 1 && fy < 5); }
    if (on) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" fill="#1b2133" aria-label="입장 QR">${cells}</svg>`;
}

function show(i) {
  timers.forEach(clearTimeout); timers = [];
  S.scene = Math.max(0, Math.min(SCENES.length - 1, i));
  const sc = SCENES[S.scene];
  const el = document.createElement("section"); el.className = "scene";
  $("#stage").replaceChildren(el);
  sc.render(el);
  const st = sc.step;
  $("#steps").innerHTML = STEPS.map((n, k) => `<span class="${k === st ? "on" : k < st ? "done" : ""}">${String(k + 1).padStart(2, "0")} ${n}</span>`).join("");
  $("#timer").textContent = st >= 0 && st < 6 ? `${MINUTES[st]}:00` : "";
}
$("#next").onclick = () => show(S.scene + 1);
$("#prev").onclick = () => show(S.scene - 1);
$("#fs").onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
document.addEventListener("keydown", (e) => {
  if (["ArrowRight", " ", "PageDown"].includes(e.key)) { e.preventDefault(); show(S.scene + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(S.scene - 1); }
  else if (e.key === "f" || e.key === "F") $("#fs").click();
});
show(0);
</script>
