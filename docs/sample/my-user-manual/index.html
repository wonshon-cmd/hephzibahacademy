Kenya","kind":"statement","eyebrow":"For me","title":"My happiest times.","subtitle":"","layout":"stack","reveal":true,"body":["Time spent with the children at the orphanage.","And the times I spent that money, and the children were happy.","Time with the people I love and care about."],"notes":["Lines appear one by one.","Share your own happiest times."],"ko":{"section":"02 케냐에서 만난 장면","eyebrow":"저에게는","title":"내가 가장\n행복했던 시간.","subtitle":"","body":["고아원에서 아이들과 보내는 시간","그리고 그 돈을 써서 아이들이 행복해하는 시간","내가 사랑하고 아끼는 사람들과 보내는 시간"],"notes":["한 줄씩 나타납니다.","내가 가장 행복했던 시간을 나눕니다."]},"glow":true},{"id":"s11","section":"03 Made for a reason","kind":"objects","eyebrow":"Another question","title":"Everything that’s made\nis made for a reason.","subtitle":"A chair. A smartphone. A car.","body":["So what about me?"],"notes":["A chair is made for sitting; a car for getting around. Whoever made it had a purpose in mind.","So what kind of person am I? What if there were a manual that helped me understand myself better? That’s what I started to wonder.","We’ll make clear on the value slide that this isn’t about judging people like objects. For now, keep it a short, curiosity-opening question."],"ko":{"section":"03 만들어진 이유","eyebrow":"또 하나의 질문","title":"만들어진 것에는\n만들어진 이유.","subtitle":"의자. 스마트폰. 자동차.","body":["그렇다면, 나는?"],"notes":["의자는 앉을 수 있도록, 자동차는 이동할 수 있도록 만들어졌죠. 만든 사람이 생각한 쓰임이 있습니다.","그런데 나는 어떤 사람일까? 나를 더 잘 이해할 수 있는 설명서가 있다면 어떨까? 그런 생각이 들었어요.","사람을 물건처럼 평가하려는 비유가 아님을 뒤의 가치 슬라이드에서 분명히 합니다. 지금은 호기심을 여는 질문으로 짧게 진행합니다."]}},{"id":"s12","section":"03 Made for a reason","kind":"phone","eyebrow":"Imagine this for a second","title":"What if you used\nyour phone like this?","subtitle":"","body":["As a desk?","As a coaster under a bowl?","What if you used a car to dry your clothes?"],"notes":["Click → to reveal each one. Leave room for a laugh.","You can use them that way — but that isn’t what they were made for."],"ko":{"section":"03 만들어진 이유","eyebrow":"잠깐 상상해 봐요","title":"스마트폰을\n이렇게 쓴다면?","subtitle":"","body":["책상으로 쓴다면?","그릇 받침으로 쓴다면?","차를 옷 말리는 데 쓴다면?"],"notes":["→를 누를 때마다 하나씩 나타납니다. 웃을 틈을 주세요.","그렇게 쓸 수는 있어요. 하지만 그렇게 쓰라고 만든 건 아니죠."]},"reveal":true,"layout":"stack"},{"id":"s12b","section":"03 Made for a reason","kind":"statement","eyebrow":"To use it well","title":"To use it well,\nknow why it was made.","subtitle":"","body":[],"notes":["We can be used in many ways too. But living the way we were made to fit is how we are ‘used’ best.","So to live well, we need to know why we were made."],"ko":{"section":"03 만들어진 이유","eyebrow":"잘 쓰려면","title":"잘 쓰려면,\n왜 만들어졌는지 알아야 합니다.","subtitle":"","body":[],"notes":["우리도 여러 가지로 쓰일 수 있어요. 하지만 나에게 가장 잘 맞게 만들어진 대로 살아갈 때, 가장 잘 쓰이는 거예요.","그래서 잘 살아가려면, 내가 왜 만들어졌는지를 잘 알아야 합니다."]},"glow":true},{"id":"s13","section":"03 Made for a reason","kind":"contrast","eyebrow":"Even in the same house","title":"Why are we\nall so different?","subtitle":"Personality, talents, the things we love.","body":["What do you think?"],"notes":["Even looking at my younger sibling, I was amazed. People look different, think differently, love different things.","Instead of ranking those differences, what if we got to know them? Maybe there are parts of me I don’t know yet.","[Pause 5 seconds] Have them silently think of one way they’re like the person next to them, and one way they’re different. No sharing required."],"ko":{"section":"03 만들어진 이유","eyebrow":"같은 집에서도 이렇게 다른데","title":"왜 우리는\n이렇게 다를까요?","subtitle":"성격도, 재능도, 좋아하는 것도.","body":["여러분은 어떻게 생각하세요?"],"notes":["저는 제 동생을 보면서도 참 신기했어요. 사람들은 이렇게 다르게 생겼고, 다르게 생각하고, 다른 것을 좋아하잖아요.","그 차이를 줄 세우는 대신, 알아가 볼 수는 없을까 생각했습니다. 내 안에도 아직 내가 잘 모르는 면이 있지 않을까요?","[5초 멈춤] 옆 사람과 닮은 점, 다른 점 하나를 마음속으로 떠올리게 합니다. 공개 발표는 요구하지 않습니다."]}},{"id":"s14","section":"04 Seeing it differently","kind":"money","eyebrow":"The way I saw money changed","title":"The same $100.\nA different weight.","subtitle":"I started asking not just how much I have, but where it goes.","body":["Helping someone learn","Where treatment is needed","Protecting someone’s today"],"notes":["Money matters. We need it to care for family, get treatment, and build a life.","But $100 as I thought of it in the U.S., and $100 when I faced someone’s need in Kenya, felt different to me. The same money can mean something different depending on where it goes.","Don’t present $100 as a price that solves tuition or medical bills. Share only a specific example you actually experienced. Don’t ask students to give."],"ko":{"section":"04 다르게 보기","eyebrow":"돈을 보는 눈도 달라졌습니다","title":"같은 100달러.\n다르게 느껴진 무게.","subtitle":"얼마를 갖는가와 함께, 어디에 쓰는가를 생각하게 됐습니다.","body":["배움을 돕는 데","치료가 필요한 곳에","누군가의 오늘을 지키는 데"],"notes":["돈은 중요합니다. 가족을 돌보고, 필요한 치료를 받고, 삶을 꾸려 가는 데 꼭 필요하죠.","그런데 미국에서 생각하던 100달러와 케냐에서 누군가의 필요를 마주하며 생각한 100달러는 제게 다르게 느껴졌습니다. 같은 돈이어도 어디에 쓰이느냐에 따라 의미가 달라질 수 있겠구나 싶었어요.","학비나 병원비를 100달러로 반드시 해결할 수 있다는 가격 정보로 설명하지 않습니다. 본인이 직접 경험한 구체적인 사례가 있다면 그 사례만 짧게 이야기합니다. 학생에게 기부를 요구하지 않습니다."]}},{"id":"s15","section":"04 Seeing it differently","kind":"turn","eyebrow":"Back to school, then to work","title":"The work continued —\nbut the reason changed.","subtitle":"I graduated from pharmacy school and started a company.","body":["Caring for my family","Working with meaning","A life of sharing"],"notes":["I went back to school, graduated from pharmacy school, and started a company. From the outside, studying and working looked about the same.","But the reason I held onto changed. Instead of only looking at money, I started thinking about caring for family, working meaningfully, and sharing.","[Slowly] When the reason I live changed, the same work felt different."],"ko":{"section":"04 다르게 보기","eyebrow":"다시 학교로, 그리고 일터로","title":"하던 일은 이어졌지만,\n하는 이유가 달라졌습니다.","subtitle":"약대를 졸업하고, 회사를 시작했습니다.","body":["가족을 돌보는 일","의미 있게 일하는 것","누군가와 나누는 삶"],"notes":["저는 학교로 돌아왔고, 약대를 졸업했고, 회사를 시작했습니다. 겉으로 보면 공부하고 일하는 모습은 비슷했을 수 있어요.","하지만 그 안에서 붙잡는 이유가 달라졌습니다. 돈만을 바라보던 데서, 가족을 돌보고 의미 있게 일하고 나누는 삶을 함께 생각하게 되었어요.","[천천히] 살아가는 이유가 바뀌니, 같은 일도 다르게 다가왔습니다."]}},{"id":"s16","section":"04 Seeing it differently","kind":"reframe-examples","eyebrow":"Getting to know myself","title":"Even the parts I didn’t like\nhad another side.","subtitle":"It depends on how you look at it.","body":[{"trait":"I’m shy","possibility":"I notice how people feel"},{"trait":"I’m interested in everything","possibility":"I try new things"},{"trait":"I get scared easily","possibility":"I prepare well"}],"notes":["I used to think of myself as ordinary, or not much. But as I got to know myself, some things looked different.","Shyness sometimes helped me notice people’s hearts. Lots of interests led to new attempts. Fear sometimes made me prepare more.","This doesn’t mean every struggle automatically becomes a strength. It’s okay to get help with hard things. The point: don’t define yourself by one weakness."],"ko":{"section":"04 다르게 보기","eyebrow":"나를 알아간다는 것","title":"내가 아쉬워하던 모습에도\n다른 면이 있었습니다.","subtitle":"어떻게 보느냐에 따라 다르게 볼 수 있어요.","body":[{"trait":"부끄럼이 많다","possibility":"사람의 마음을 더 살핀다"},{"trait":"관심이 많다","possibility":"새로운 것을 시도한다"},{"trait":"겁이 많다","possibility":"충분히 준비한다"}],"notes":["저는 제 자신을 평범하거나 별로인 사람이라고 생각하기도 했습니다. 그런데 조금씩 알아가다 보니 다르게 보이는 면이 있었어요.","부끄러움이 사람의 마음을 살피는 계기가 되기도 하고, 여러 관심이 새로운 시도로 이어지기도 했습니다. 두려움이 준비를 더 하게 만드는 때도 있었고요.","모든 어려움이 자동으로 장점이 된다는 뜻은 아닙니다. 힘든 부분에는 도움을 받아도 괜찮습니다. 여기서는 나를 한 가지 단점으로만 단정하지 말자는 의미로 전합니다."]}},{"id":"s17","section":"04 Seeing it differently","kind":"reframe-input","eyebrow":"Question two · 60 seconds","title":"Take one part of you —\nand look from another angle.","subtitle":"","body":["When might it actually help?","What kind of help would be good?"],"interaction":{"type":"text","prompt":"One part of me, seen from another angle:","placeholder":"e.g. I decide slowly — but I look carefully at things that matter.","maxLength":180},"notes":["Pick one part of yourself you’re a little disappointed in. You don’t need to share a big struggle — an example is fine.","Write one line: when it might help, or what help you’d need to feel more at ease. [Wait 60 seconds]","Don’t evaluate shared answers — just receive them: “That’s a great way to see it.” Don’t force a positive conclusion on anyone who couldn’t find one."],"ko":{"section":"04 다르게 보기","eyebrow":"두 번째 질문 · 60초","title":"내 모습 하나를,\n다른 각도에서 보면?","subtitle":"","body":["어떤 때에는 도움이 될까?","어떤 도움이 있으면 좋을까?"],"notes":["내가 조금 아쉽게 느끼는 모습 하나를 골라 봅시다. 큰 고민을 공개할 필요는 없어요. 예시를 골라도 괜찮습니다.","그 모습이 도움이 되는 때가 있는지, 또는 내가 더 편안해지려면 어떤 도움이 필요한지 한 줄 적어 보세요. 혼자 생각하기 어렵다면 옆 사람과 가벼운 예시를 이야기해도 좋아요. [60초 기다리기]","공유된 답은 평가하지 않고 '그렇게 볼 수도 있겠네요'라고 받아 줍니다. 답을 못 찾은 학생에게 긍정적인 결론을 강요하지 않습니다."],"interaction":{"prompt":"내 모습 하나를, 다른 각도에서 보면?","placeholder":"예: 결정이 느려도 중요한 일을 신중하게 살펴볼 수 있어요"},"demo":["조용하다 → 잘 들어 준다","걱정이 많다 → 미리 준비한다","고집이 세다 → 쉽게 포기하지 않는다","금방 질린다 → 새로운 걸 잘 시도한다","예민하다 → 친구가 힘든 걸 먼저 안다"]},"demo":["I'm quiet → I listen well","I worry a lot → I plan ahead","I'm stubborn → I don't give up easily","I get bored fast → I like trying new things","I'm sensitive → I notice when friends are sad"]},{"id":"s18","section":"05 Before the One who made me","kind":"faith-statement","eyebrow":"Something I really want to add","title":"Before God,\nyou are already precious","subtitle":"Even if you don’t know what you’re good at yet. Even if you don’t have a clear dream.","body":["Our worth isn’t decided by grades or usefulness."],"notes":["Looking for your user manual doesn’t mean you have to become useful to be loved. A person’s worth isn’t decided by how much they get done.","The faith I want to share here is that God knows us and loves us. You — right now, even before you can explain your dreams or gifts — are precious.","Don’t present this as a direct Bible quote. Say it slowly, so the “function” metaphor never limits anyone’s worth."],"ko":{"section":"05 지으신 분 앞에서","eyebrow":"이 이야기에 꼭 덧붙이고 싶은 말","title":"하나님 앞에서\n너는 이미 소중한 사람","subtitle":"아직 잘하는 일을 몰라도. 지금 뚜렷한 꿈이 없어도.","body":["우리의 가치는 성적이나 쓸모로 정해지지 않습니다."],"notes":["사용설명서를 찾자는 말이, 쓸모 있는 사람이 되어야 사랑받는다는 뜻은 아닙니다. 우리가 무엇을 얼마나 해내느냐로 사람의 가치가 정해지는 것은 아니에요.","교회에서 여러분과 나누고 싶은 믿음은, 하나님께서 우리를 아시고 사랑하신다는 것입니다. 아직 꿈이나 재능을 설명하지 못하는 지금의 여러분도 소중합니다.","이 문장은 성경의 직접 인용문으로 표시하지 않습니다. 기능의 비유가 사람의 가치를 제한하지 않도록 충분히 천천히 전합니다."]}},{"id":"s18b","section":"05 Before the One who made me","kind":"statement","glow":true,"eyebrow":"Psalm 139:14","title":"I praise you because I am\nfearfully and wonderfully made.","subtitle":"Your works are wonderful, I know that full well.","body":[],"notes":["Read the verse slowly.","This is a thankful confession: God made me, and what He makes is wonderful."],"ko":{"section":"05 지으신 분 앞에서","eyebrow":"시편 139:14","title":"내가 주께 감사하옴은\n나를 지으심이 심히 기묘하심이라.","subtitle":"주께서 하시는 일이 기이함을 내 영혼이 매우 잘 아나이다.","body":[],"notes":["말씀을 천천히 읽어 주세요.","지으심을 감사하는 고백입니다. 하나님이 나를 만드셨고, 그분이 하시는 일은 기이합니다."]}},{"id":"s19","section":"05 Before the One who made me","kind":"faith-practice","eyebrow":"","title":"“God,\nwho am I?”","subtitle":"","body":[],"notes":["In Scripture we meet the confession that we are made by God, and an invitation toward good works. The lines on screen are summaries, not direct quotes.","I use “user manual” less to mean my whole career is written on one page, and more as a picture of getting to know myself, little by little, before God.","We can ask through Scripture and prayer, and by talking with trusted adults and friends who know us. It’s okay if the answer doesn’t come all at once."],"ko":{"section":"05 지으신 분 앞에서","eyebrow":"","title":"“하나님,\n저는 어떤 사람인가요?”","subtitle":"","body":[],"notes":["우리는 성경에서 하나님이 지으신 존재라는 고백과, 선한 일을 향한 초대를 만납니다. 화면의 문장은 성경 구절의 요약이지 직접 인용은 아닙니다.","저는 사용설명서라는 말을, 평생의 진로가 한 장에 다 적혀 있다는 뜻보다 하나님 앞에서 나를 조금씩 알아가는 비유로 사용하고 싶어요.","말씀을 읽고 기도하면서, 또 나를 잘 아는 믿을 만한 어른이나 친구와 이야기하면서 질문해 볼 수 있습니다. 답이 한 번에 들리지 않아도 괜찮습니다. 작은 경험을 통해 알아갈 수도 있어요."]}},{"id":"s20","section":"06 My first page","kind":"testimony","eyebrow":"","title":"Looking back on the last 10 years,\nit has truly been a time of gratitude.","subtitle":"Because little by little, I’m learning why I live and who I am.","body":[],"notes":["Over the last ten years — studying, working, running a company — there were failures and a lot happened. Looking back, it was a truly happy and grateful time.","Because I moved from only asking what I should do to holding onto why, and I slowly learned what makes me happy.","Be careful not to suggest you must be perfectly happy every day, or that anxiety comes from a lack of faith."],"ko":{"section":"06 나의 첫 페이지","eyebrow":"","title":"지난 10년을 돌아보면\n참으로 감사한 시간이었습니다.","subtitle":"왜 살아가는지, 어떤 사람인지 조금씩 알아가고 있기 때문입니다.","body":[],"notes":["지난 10년 동안 공부하고, 일하고, 회사를 운영하면서 실패도 있었고 많은 일이 있었습니다. 그 시간을 돌아보면 제게는 정말 행복하고 감사한 시간이었습니다.","무엇을 해야 하는가만 생각하던 데서 왜 해야 하는가를 붙잡게 되었고, 무엇을 할 때 행복한 사람인지 조금씩 알아가게 되었기 때문입니다.","지금도 매일 완벽하게 행복해야 한다는 메시지가 되지 않도록 주의합니다. 현재 불안하거나 힘든 마음이 믿음이나 목적이 부족해서라고 연결하지 않습니다."]}},{"id":"s21","section":"06 My first page","kind":"statement","eyebrow":"","title":"God made each of you differently,\nand each for a reason.","subtitle":"Your surroundings, personality, gifts and dreams are different.","body":[],"notes":["My story isn’t an answer that applies to you exactly. We all have different circumstances, personalities, gifts and dreams.","Not everyone needs to start a business or go to Kenya. Start your own questions right where you live.","Add that it’s okay to still be figuring it out — so no one leaves thinking, “If I don’t have an answer now, am I too late?”"],"ko":{"section":"06 나의 첫 페이지","eyebrow":"","title":"하나님께서 여러분을 다 다르게 만드신 데에는\n각자의 이유가 있습니다.","subtitle":"환경도, 성격도, 재능도, 꿈도 다르니까요.","body":[],"notes":["제 이야기가 여러분에게 그대로 적용되는 정답은 아닙니다. 우리는 환경도 성격도 재능도 꿈도 다르니까요.","모두가 사업을 하거나 케냐에 가야 하는 것은 아닙니다. 여러분이 살아가는 곳에서, 여러분만의 질문을 시작해 보면 좋겠습니다.","'지금 답이 없으면 늦은 건가?'라는 부담이 남지 않도록, 아직 알아가는 중이어도 괜찮다는 말을 덧붙입니다."]}},{"id":"s22","section":"06 My first page","kind":"questions","eyebrow":"Questions worth coming back to","title":"What kind of life\ndo I want to live?","subtitle":"One at a time. Slowly.","body":["Why do I study?","Where do I want my money to go?","What am I good at?","When do I feel joy?","Who am I before God?"],"notes":["You don’t need to solve these today. If one of them sticks with you, start with that one.","When choosing a career, we can look beyond titles and conditions and ask what kind of life we want.","Next, we’ll write down what comes to mind right now — a first page you can rewrite later."],"ko":{"section":"06 나의 첫 페이지","eyebrow":"앞으로도 다시 꺼내 볼 질문","title":"나는 어떤 삶을\n살고 싶을까?","subtitle":"하나씩, 천천히.","body":["나는 왜 공부할까?","돈은 어디에 쓰고 싶을까?","나는 무엇을 잘할까?","언제 기쁨을 느낄까?","하나님 앞에서 나는 어떤 사람일까?"],"notes":["이 질문들을 오늘 다 해결할 필요는 없습니다. 그중 하나가 마음에 남는다면, 그 하나부터 붙잡아도 좋습니다.","직업을 고를 때도 이름이나 조건만 보지 않고, 어떤 삶을 살고 싶은지 함께 물어볼 수 있겠죠.","다음 장에서 지금 떠오르는 것을 짧게 적어 보고, 나중에 다시 고쳐 쓸 수 있는 첫 페이지를 만들어 봅니다."]}},{"id":"s23","section":"06 My first page","kind":"worksheet","eyebrow":"Question three · 2 minutes","title":"My user manual:\npage one.","subtitle":"Write only what you know now. It’s okay if it changes later.","body":[],"interaction":{"type":"private","prompt":"My user manual · page one","privacy":"This stays on your phone. It never appears on the big screen.","fields":[{"id":"joy","label":"When I’m happiest","placeholder":"What makes you feel a little happier or more at ease?"},{"id":"strength","label":"My personality, and how I was made","placeholder":"Small things and things you’re still learning count."},{"id":"value","label":"What I treasure","placeholder":"People, relationships, values, ways I want to help…"},{"id":"question","label":"Why God made me","placeholder":"Write as much as you sense right now."}]},"notes":["This isn’t a test that judges you. It’s a short record of how you understand yourself right now.","If you don’t know what you’re good at, write something people often ask you for, or something that feels easy for you. People and values you treasure are good clues too. [Wait 2 minutes]","This page stays private. Mention they can download it on their phone, and that filling in just one or two boxes is fine."],"ko":{"section":"06 나의 첫 페이지","eyebrow":"세 번째 질문 · 2분","title":"나의 사용설명서\n첫 페이지.","subtitle":"지금 아는 만큼만 적어도 좋아요. 나중에 바뀌어도 괜찮아요.","body":[],"notes":["이건 여러분을 판정하는 검사가 아닙니다. 지금의 내가 나를 어떻게 이해하고 있는지 남기는 짧은 기록이에요.","잘하는 일을 잘 모르겠다면 사람들이 나에게 종종 부탁하는 일이나, 해 보면 조금 편한 일을 적어 보세요. 소중하게 생각하는 사람이나 가치도 좋은 단서입니다. [2분 기다리기]","이 장은 개인 기록으로 둡니다. 모두에게 보여 줄 필요는 없습니다. 다운로드하거나 자신의 기기에 저장할 수 있다면 방법을 짧게 안내하고, 한두 칸만 채웠어도 괜찮다고 말해 줍니다."],"interaction":{"prompt":"나의 사용설명서 첫 페이지","privacy":"내 기록으로 남겨요. 공개 화면에는 올라가지 않아요.","fields":{"joy":{"label":"내가 가장 행복할 때","placeholder":"어떤 일을 할 때 조금 즐겁거나 편안한가요?"},"strength":{"label":"나의 성격과 지어진 형태","placeholder":"작은 일도, 아직 배우고 있는 일도 괜찮아요."},"value":{"label":"내가 소중하게 여기는 것","placeholder":"사람, 관계, 가치, 돕고 싶은 일…"},"question":{"label":"하나님이 나를 만드신 이유","placeholder":"지금 생각나는 만큼 적어 보세요."}}}}},{"id":"s25","section":"06 My first page","kind":"prayer","eyebrow":"A moment to pause","title":"God,\nhelp me know who I am.","subtitle":"Help me know the purpose I was made for, and live in the world by it.","body":[],"notes":["First let everyone know they can pray together, or simply reflect quietly.","[Example prayer] God, thank you for knowing and loving us. Help us not to see ourselves only through grades or comparison. Help us discover the ways you made us, ask for help when we need it, and treasure one another. Give us courage for one small step this week. In Jesus’ name, Amen.","Don’t ask for any particular emotion or decision. Leave a short silence after the prayer."],"ko":{"section":"06 나의 첫 페이지","eyebrow":"잠깐 멈추는 시간","title":"하나님,\n저를 알아가게 해 주세요.","subtitle":"나의 지어진 목적을 알게 하시고, 그 목적대로 세상을 살아갈 수 있기를.","body":[],"notes":["원하는 사람은 함께 기도하고, 조용히 생각해도 괜찮다고 먼저 안내합니다.","[기도 예시] 하나님, 우리를 아시고 사랑해 주셔서 감사합니다. 성적이나 비교로만 우리를 바라보지 않게 해 주세요. 우리에게 주신 모습들을 알아가고, 도움이 필요할 때 도움을 구하고, 서로를 소중히 여기게 해 주세요. 이번 주 작은 한 걸음을 걸을 용기를 주세요. 예수님의 이름으로 기도합니다. 아멘.","특정한 감정이나 결단을 요구하지 않습니다. 기도 뒤에 잠깐 조용한 시간을 둡니다."]}},{"id":"s26","section":"07 Closing: orchestra, video & review","kind":"closing","eyebrow":"HEPHZIBAH ACADEMY","title":"That’s why every day\nis full of joy and hope.","subtitle":"","body":["Thank you for listening and thinking with me."],"interaction":{"type":"text","channel":"qa","prompt":"Any questions for Joseph?","placeholder":"Ask anything — no names shown.","maxLength":200},"notes":["The more I learned, the more I thought, “Wow — I’m made in an amazing way.”","I’m still finding my own user manual. I hope you keep getting to know yourself and keep asking your own questions.","I’m cheering you on, truly. Thank you for listening and thinking together. If there’s time, take one or two questions from the screen — then move on to the orchestra."],"ko":{"section":"07 마침: 오케스트라, 영상, 리뷰","eyebrow":"HEPHZIBAH ACADEMY","title":"그래서 매일매일이\n행복하고 기대됩니다.","subtitle":"","body":["함께 들어 주고, 생각해 줘서 고맙습니다."],"notes":["하나씩 알아갈수록, '나라는 사람이 참 신기하게 만들어졌구나'라는 생각이 들었습니다.","저도 여전히 제 사용설명서를 찾아가는 중입니다. 여러분도 자신을 더 알아가고, 여러분만의 질문을 계속해 보면 좋겠습니다.","그 여정을 진심으로 응원합니다. 잘 들어 주고 함께 생각해 줘서 감사합니다. 여유가 있으면 자발적인 질문 한두 개를 받습니다. 그다음 오케스트라로 넘어갑니다."],"interaction":{"prompt":"궁금한 점이 있나요?","placeholder":"무엇이든 물어보세요. 이름은 보이지 않아요."},"demo":["하고 싶은 일을 어떻게 알게 되셨어요?","휴학할 때 부모님은 괜찮으셨어요?","케냐에서 가장 힘들었던 건 뭐예요?","아직 좋아하는 게 뭔지 모르겠으면요?"]},"glow":true,"demo":["How did you know what you wanted to do?","Were your parents okay with you taking a year off?","What was the hardest thing in Kenya?","What if I still don't know what I like?"]},{"id":"s27","section":"07 Closing: orchestra, video & review","kind":"orchestra","eyebrow":"Every instrument has its own voice","title":"Alone, each one\nsounds like this.","subtitle":"Tap an instrument to hear just its part. Then hear them together.","body":[],"notes":["Each of you joined as an instrument. Look at your phone — which one are you?","Click a few instruments one at a time. Alone, some parts sound simple — a tuba playing just a few low notes, timpani only hitting now and then. On its own, a part can feel unimpressive.","Then click “All together.” Each part was made for a reason, and none of them has to be the melody to matter. That’s what I mean by a user manual: knowing your own part.","Then move on to the video."],"ko":{"section":"07 마침: 오케스트라, 영상, 리뷰","eyebrow":"모든 악기에는 저마다의 소리가 있어요","title":"혼자서는,\n이런 소리가 나요.","subtitle":"악기를 눌러 그 파트만 들어 보세요. 그다음 함께 들어 봐요.","body":[],"notes":["여러분은 각자 하나의 악기로 들어왔어요. 휴대폰을 보세요. 나는 어떤 악기인가요?","악기를 하나씩 눌러 봅니다. 혼자 들으면 단순하게 들리는 파트도 있어요. 튜바는 낮은 음 몇 개, 팀파니는 가끔 한 번씩 울릴 뿐이죠.","이제 \"함께 연주\"를 누릅니다. 모든 파트는 이유가 있어서 만들어졌고, 멜로디가 아니어도 소중합니다. 이것이 사용설명서의 의미예요. 나의 파트를 아는 것.","그리고 영상으로 넘어갑니다."]}},{"id":"s28","section":"07 Closing: orchestra, video & review","kind":"video","eyebrow":"Together","title":"The Mission — Gabriel’s Oboe","subtitle":"Ennio Morricone conducts his own music.","video":{"youtubeId":"s7w-IeNR9ko","title":"Morricone conducts Morricone: The Mission (Gabriel's Oboe)"},"body":[],"notes":["Introduce briefly: one oboe carries the melody, but listen to how every other instrument holds it up.","Let the video play without talking over it.","Afterwards, a short pause. Then: “On your phone, tell me what you learned today.”"],"ko":{"section":"07 마침: 오케스트라, 영상, 리뷰","eyebrow":"함께","title":"미션 — 가브리엘의 오보에","subtitle":"엔니오 모리코네가 직접 지휘합니다.","body":[],"notes":["짧게 소개합니다. 오보에 하나가 멜로디를 이끌지만, 다른 모든 악기가 그것을 받쳐 주는 것을 들어 보세요.","영상이 나오는 동안에는 말을 얹지 않습니다.","끝나면 잠깐 멈춘 뒤: \"오늘 배운 것을 휴대폰에 적어 주세요.\""]}},{"id":"s28b","section":"07 Closing: orchestra, video & review","kind":"statement","glow":true,"eyebrow":"Isaiah 55:8–9","title":"“For my thoughts are not your thoughts,\nneither are your ways my ways,”\ndeclares the Lord.","subtitle":"“As the heavens are higher than the earth, so are my ways higher than your ways and my thoughts than your thoughts.”","body":[],"notes":["Read slowly."],"ko":{"section":"07 마침: 오케스트라, 영상, 리뷰","eyebrow":"이사야 55:8–9","title":"이는 내 생각이 너희의 생각과 다르며\n내 길은 너희의 길과 다름이니라.","subtitle":"여호와의 말씀이니라. 이는 하늘이 땅보다 높음 같이 내 길은 너희의 길보다 높으며 내 생각은 너희의 생각보다 높음이니라.","body":[],"notes":["천천히 읽어 주세요."]},"small":true},{"id":"s28c","section":"07 Closing: orchestra, video & review","kind":"statement","glow":true,"eyebrow":"","title":"We can’t know what each of our lives will look like,\nbut through each one of you,\nGod is doing something truly great.","subtitle":"","body":[],"notes":["Say it slowly, looking around the room."],"ko":{"section":"07 마침: 오케스트라, 영상, 리뷰","eyebrow":"","title":"우리 각자의 삶이 어떻게 될지는 알 수 없지만,\n하나님은 여러분 한 사람 한 사람을 통해\n정말로 큰 역사를 만들어 가고 계십니다.","subtitle":"","body":[],"notes":["천천히, 학생들을 한 명씩 바라보며 말합니다."]},"titleSteps":true,"small":true},{"id":"s30","section":"07 Closing: orchestra, video & review","kind":"candle","eyebrow":"Light and salt","title":"In your own place,\nin what you’ve been given —\nshine as a child of God.","subtitle":"","body":[],"notes":["Close with this. Let the candle stay on screen."],"ko":{"section":"07 마침: 오케스트라, 영상, 리뷰","eyebrow":"빛과 소금","title":"각자 자기 자리에서,\n맡겨진 상황에서 빛나는\n하나님의 자녀로 살기를.","subtitle":"","body":[],"notes":["이 말로 마칩니다. 촛불을 화면에 둔 채 인사합니다."]}},{"id":"s29","section":"07 Closing: orchestra, video & review","kind":"review","eyebrow":"Before you go","title":"What did you\nlearn today?","subtitle":"Share one thing, review the lecture — then see your own results on your phone.","body":["What I learned","Review the lecture","See my results","How I’ll use my strengths — and my weaknesses"],"interaction":{"type":"review","prompt":"What did you learn today?","placeholder":"One thing I’m taking home…","maxLength":200},"notes":["Give everyone 3–4 minutes. What they learned appears on screen with their instrument name — no real names.","After they review the lecture, their personal results from the 20 questions unlock on their phone.","They can write how they’ll use their strengths and weaknesses, and leave an email if they’d like job matches later. Remind them email is optional and only with their permission."],"ko":{"section":"07 마침: 오케스트라, 영상, 리뷰","eyebrow":"마치기 전에","title":"오늘 무엇을\n배웠나요?","subtitle":"하나만 나누고, 강의를 // Shared helpers for the presenter and audience screens.

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error((data.error && data.error.message) || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

const getJson = (url) => Promise.resolve(__DATA[url]);

let instruments = null;
async function loadInstruments() {
  if (!instruments) {
    const [ins, bible] = await Promise.all([getJson("/data/instruments.json"), getJson("/data/bible.json").catch(() => [])]);
    instruments = [...ins, ...(bible || []).map((b) => ({ ...b, kind: "bible", family: "Bible", familyKo: "성경 인물" }))];
  }
  return instruments;
}
const instrumentById = (id) => (instruments || []).find((i) => i.id === id);

// Round "badge" for an instrument: score abbreviation (Vn, Ob, Hn…) tinted by family.
function avatar(id, size = 44) {
  const ins = instrumentById(id);
  const el = document.createElement("span");
  el.className = "avatar";
  el.dataset.family = ins ? ins.family.toLowerCase() : "";
  el.style.setProperty("--size", size + "px");
  if (ins && ins.kind === "bible") {
    el.dataset.family = "bible";
    el.style.backgroundImage = "url(/img/bible-avatars.png)";
    el.style.backgroundPosition = `${(ins.col / 3) * 100}% ${(ins.row / 2) * 100}%`;
  } else el.textContent = ins ? ins.abbr : "?";
  el.setAttribute("aria-hidden", "true");
  return el;
}

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}

// Multi-line title text ("\n") → spans with <br>, safely.
function lines(text) {
  const frag = document.createDocumentFragment();
  String(text).split("\n").forEach((line, i) => { if (i) frag.append(document.createElement("br")); frag.append(line); });
  return frag;
}

const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// Score the 20-question self-reflection. Answers: -1, 0, 1, or null (skipped).
function scorePersonality(data, answers) {
  const out = {};
  for (const dim of data.dimensions) {
    const items = data.items.filter((it) => it.dimension === dim.id);
    const vals = items.map((it) => answers[it.id]).map((v, i) => (v == null ? null : items[i].reverse ? -v : v)).filter((v) => v != null);
    if (vals.length < 2) { out[dim.id] = null; continue; }
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    out[dim.id] = mean < -0.25 ? "low" : mean > 0.25 ? "high" : "mid";
  }
  return out;
}

// Slide in the current language (Korean fields live under slide.ko).
function tr(slide) {
  if (getLang() !== "ko" || !slide.ko) return slide;
  const k = slide.ko;
  const out = { ...slide, ...k };
  delete out.ko;
  if (slide.interaction) {
    const ki = k.interaction || {};
    out.interaction = { ...slide.interaction, ...ki };
    if (slide.interaction.options) out.interaction.options = slide.interaction.options.map((o) => ({ ...o, label: (ki.options && ki.options[o.value]) || o.label }));
    if (slide.interaction.categories) out.interaction.categories = slide.interaction.categories.map((c) => ({ ...c, label: (ki.categories && ki.categories[c.id]) || c.label }));
    if (slide.interaction.fields) out.interaction.fields = slide.interaction.fields.map((f) => ({ ...f, ...((ki.fields && ki.fields[f.id]) || {}) }));
  }
  return out;
}

// Instrument name / alias in the current language ("Cello 2" → "첼로 2").
function insName(id) { const i = instrumentById(id); return i ? t(i.name, i.ko) : ""; }
function insFamily(id) { const i = instrumentById(id); return i ? t(i.family, i.familyKo) : ""; }
function aliasText(alias, id) {
  const i = instrumentById(id);
  return i && alias ? alias.replace(i.name, t(i.name, i.ko)) : alias || t("Guest", "손님");
}

// ---------- Credit card payoff ----------
// Simulates month by month. Minimum payment = 1% of balance + that month's interest, at least $25.
function cardPayoff(balance, aprPct, payment) {
  const r = Math.max(0, aprPct) / 100 / 12;
  let bal = Math.max(0, balance), months = 0, interest = 0;
  while (bal > 0.005 && months < 1200) {
    const i = bal * r;
    const pay = payment == null ? Math.max(25, bal * 0.01 + i) : payment;
    if (pay <= i) return { months: Infinity, interest: Infinity };
    interest += i; bal = bal + i - pay; months++;
  }
  return { months, interest };
}

function calculator(t) {
  const money = (n) => (isFinite(n) ? "$" + Math.round(n).toLocaleString("en-US") : "—");
  const dur = (m) => !isFinite(m) ? t("Never (payment too small)", "갚을 수 없음 (납부액이 너무 적음)")
    : m >= 24 ? t(`${(m / 12).toFixed(1)} years`, `${(m / 12).toFixed(1)}년`) : t(`${m} months`, `${m}개월`);
  const field = (label, val, step) => {
    const input = h("input", { class: "input", type: "number", inputmode: "decimal", min: "0", step, value: String(val) });
    return [h("label", { class: "field" }, h("span", { text: label }), input), input];
  };
  const [fb, bal] = field(t("Card balance ($)", "카드 잔액 ($)"), 5000, "100");
  const [fa, apr] = field(t("Interest rate (APR %)", "연 이자율 (APR %)"), 24, "0.1");
  const [fp, pay] = field(t("What I can pay each month ($)", "매달 갚을 수 있는 금액 ($)"), 300, "10");
  const out = h("div", { class: "calc-out" });
  const run = () => {
    const b = +bal.value || 0, a = +apr.value || 0, p = +pay.value || 0;
    const mn = cardPayoff(b, a, null), fx = cardPayoff(b, a, p);
    out.replaceChildren(
      h("div", { class: "calc-row" }, h("span", { text: t("Minimum payments only", "최소 납부액만") }), h("b", { text: dur(mn.months) }), h("small", { text: t(`Interest ${money(mn.interest)}`, `이자 ${money(mn.interest)}`) })),
      h("div", { class: "calc-row strong" }, h("span", { text: t(`Paying ${money(p)} a month`, `매달 ${money(p)}씩`) }), h("b", { text: dur(fx.months) }), h("small", { text: t(`Interest ${money(fx.interest)}`, `이자 ${money(fx.interest)}`) })));
  };
  [bal, apr, pay].forEach((i) => i.addEventListener("input", run));
  run();
  return h("div", { class: "calc" }, h("div", { class: "calc-in" }, fb, fa, fp), out,
    h("p", { class: "calc-note", text: t("Minimum payment assumed: 1% of the balance plus interest, at least $25. Your card may differ.", "최소 납부액 가정: 잔액의 1% + 이자, 최소 $25. 카드사마다 다를 수 있어요.") }));
}

// ---------- Compound growth (retirement) ----------
function futureValue(monthly, annualPct, years) {
  const r = annualPct / 100 / 12, n = Math.max(0, Math.round(years * 12));
  return r === 0 ? monthly * n : monthly * ((Math.pow(1 + r, n) - 1) / r);
}

function compoundCalc(t) {
  const money = (n) => "$" + Math.round(n).toLocaleString("en-US");
  const field = (label, val, step) => {
    const input = h("input", { class: "input", type: "number", inputmode: "decimal", min: "0", step, value: String(val) });
    return [h("label", { class: "field" }, h("span", { text: label }), input), input];
  };
  const [f1, monthly] = field(t("Save each month ($)", "매달 저축 ($)"), 300, "50");
  const [f2, start] = field(t("Start age", "시작 나이"), 25, "1");
  const [f3, retire] = field(t("Retire at", "은퇴 나이"), 65, "1");
  const [f4, rate] = field(t("Yearly return (%)", "연 수익률 (%)"), 6, "0.5");
  const out = h("div", { class: "calc-out" });
  const run = () => {
    const m = +monthly.value || 0, s = +start.value || 0, rt = +retire.value || 0, r = +rate.value || 0;
    const yrs = Math.max(0, rt - s), late = Math.max(0, yrs - 10);
    const fv = futureValue(m, r, yrs), fvLate = futureValue(m, r, late);
    out.replaceChildren(
      h("div", { class: "calc-row strong" }, h("span", { text: t(`Start at ${s} · ${yrs} years`, `${s}세 시작 · ${yrs}년`) }), h("b", { text: money(fv) }),
        h("small", { text: t(`You put in ${money(m * yrs * 12)}; growth adds ${money(fv - m * yrs * 12)}`, `넣은 돈 ${money(m * yrs * 12)} · 불어난 돈 ${money(fv - m * yrs * 12)}`) })),
      h("div", { class: "calc-row" }, h("span", { text: t(`Start 10 years later (${s + 10}) · ${late} years`, `10년 늦게 시작 (${s + 10}세) · ${late}년`) }), h("b", { text: money(fvLate) }),
        h("small", { text: t(`You put in ${money(m * late * 12)}`, `넣은 돈 ${money(m * late * 12)}`) })));
  };
  [monthly, start, retire, rate].forEach((i) => i.addEventListener("input", run));
  run();
  return h("div", { class: "calc" }, h("div", { class: "calc-in", style: "grid-template-columns:repeat(4,minmax(0,1fr))" }, f1, f2, f3, f4), out,
    h("p", { class: "calc-note", text: t("Example only: assumes the same monthly amount and a steady yearly return, before taxes and inflation.", "예시일 뿐이에요: 매달 같은 금액, 일정한 수익률을 가정하며 세금과 인플레이션은 빼고 계산했어요.") }));
}

// A small Web Audio orchestra.
//
// Each instrument has its own part in one short, original 5-bar piece
// (D – Bm – G – A – D). Played alone, a part can sound simple; played
// together, the parts make a whole. Sounds are synthesized in the browser,
// so no audio files are required.
//
// Sound: real recorded instrument samples, one file per note, from the FluidR3_GM
// soundfont (Frank Wen, MIT licence) as published by midi-js-soundfonts
// (Benjamin Gleitzman). They load from the web when the deck opens; any note that
// fails to load falls back to the small synthesizer below.
//
// Full-length recordings can also be dropped into /public/audio/ named after the
// instrument id (e.g. audio/oboe.mp3); they take priority over both.

const SAMPLE_BASE = "https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/";
const GM = { violin: "violin", viola: "viola", cello: "cello", bass: "contrabass", harp: "orchestral_harp", timpani: "timpani",
  flute: "flute", oboe: "oboe", clarinet: "clarinet", bassoon: "bassoon", horn: "french_horn", trumpet: "trumpet", trombone: "trombone", tuba: "tuba" };
const NOTE_NAMES = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
const noteName = (m) => NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);

const BPM = 84;
const BEAT = 60 / BPM;
const CHORDS = [[50, 54, 57], [47, 50, 54], [43, 47, 50], [45, 49, 52], [50, 54, 57]]; // D Bm G A D
const MELODY = [
  [66, 69, 74, 69], [71, 69, 66, 62], [67, 71, 74, 76], [73, 71, 69, 73],
];

// Notes are [startBeat, lengthInBeats, midi, velocity]
function part(id) {
  const n = [];
  const bars = (fn) => CHORDS.forEach((c, b) => fn(c, b * 4, b));
  const melody = (shift = 0, from = 0) => {
    MELODY.forEach((bar, b) => { if (b >= from) bar.forEach((m, i) => n.push([b * 4 + i, 1, m + shift, 0.8])); });
    n.push([16, 4, 74 + shift, 0.8]);
  };
  switch (id) {
    case "violin": melody(0); break;
    case "oboe": melody(0); break;
    case "flute": melody(12, 2); break;
    case "trumpet":
      n.push([7, 1, 66, 0.6], [15, 1, 69, 0.7], [16, 4, 74, 0.8]); break;
    case "viola": bars((c, s) => { for (let i = 0; i < 8; i++) n.push([s + i / 2, 0.5, (i % 2 ? c[2] : c[1]) + 12, 0.45]); }); break;
    case "clarinet": bars((c, s) => n.push([s, 2, c[1] + 12, 0.5], [s + 2, 2, c[2] + 12, 0.5])); break;
    case "horn": bars((c, s) => n.push([s, 4, c[2], 0.5])); break;
    case "trombone": bars((c, s) => n.push([s, 4, c[1], 0.45])); break;
    case "cello": bars((c, s) => n.push([s, 2, c[0] - 12, 0.6], [s + 2, 2, c[2] - 12, 0.55])); break;
    case "bassoon": bars((c, s) => { for (let i = 0; i < 4; i++) n.push([s + i, 0.9, (i % 2 ? c[2] : c[0]) - 12, 0.5]); }); break;
    case "bass": bars((c, s) => n.push([s, 4, low(c[0]), 0.7])); break;
    case "tuba": bars((c, s, b) => { if (b % 2 === 0) n.push([s, 4, low(c[0]), 0.6]); }); break;
    case "timpani": bars((c, s, b) => { n.push([s, 2, c[0] - 12 < 38 ? c[0] : c[0] - 12, 0.9]); if (b < 4) n.push([s + 2, 2, 45, 0.6]); }); break;
    case "harp": bars((c, s, b) => {
      const arp = [c[0], c[1], c[2], c[0] + 12, c[1] + 12, c[2] + 12, c[0] + 24, c[2] + 12];
      if (b === 4) { [c[0], c[1], c[2], c[0] + 12, c[1] + 12, c[2] + 12].forEach((m, i) => n.push([s + i * 0.12, 4, m + 12, 0.5])); return; }
      arp.forEach((m, i) => n.push([s + i / 2, 1.5, m + 12, 0.45]));
    }); break;
  }
  return n;
}

// Bass register: one or two octaves down, staying around D1–D2.
function low(m) { m -= 12; return m > 40 ? m - 12 : m; }

const freq = (m) => 440 * Math.pow(2, (m - 69) / 12);

function env(g, t, a, peak, d, rel) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.setValueAtTime(peak, t + Math.max(a, d - rel));
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
}

function vibrato(ctx, osc, t, f, depth = 0.004, rate = 5.4) {
  const lfo = ctx.createOscillator(), lg = ctx.createGain();
  lfo.frequency.value = rate;
  lg.gain.setValueAtTime(0, t);
  lg.gain.linearRampToValueAtTime(f * depth, t + 0.35);
  lfo.connect(lg).connect(osc.frequency);
  return lfo; // started together with the voice's other nodes
}

let noiseBuf = null;
function noise(ctx) {
  if (noiseBuf) return noiseBuf;
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}

function voice(ctx, out, id, midi, t, dur, vel) {
  const f = freq(midi);
  const g = ctx.createGain();
  g.connect(out);
  const nodes = [];
  const osc = (type, fr, detune = 0) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = fr; o.detune.value = detune; nodes.push(o); return o; };
  const filter = (type, fr, q = 0.7) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = fr; b.Q.value = q; return b; };
  const v = vel * 0.22;

  if (["violin", "viola", "cello", "bass"].includes(id)) {
    const lp = filter("lowpass", Math.min(f * 7, 6000), 0.9);
    const o1 = osc("sawtooth", f, -6), o2 = osc("sawtooth", f, 7);
    o1.connect(lp); o2.connect(lp); lp.connect(g);
    nodes.push(vibrato(ctx, o1, t, f), vibrato(ctx, o2, t, f));
    env(g, t, id === "bass" ? 0.12 : 0.09, v * (id === "bass" ? 1.2 : 0.8), dur, 0.18);
  } else if (id === "harp") {
    const o1 = osc("triangle", f), o2 = osc("sine", f * 2);
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o1.connect(g); o2.connect(g2).connect(g);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v * 1.1, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(dur, 2.2));
  } else if (id === "flute") {
    const o = osc("sine", f), o2 = osc("triangle", f);
    const g2 = ctx.createGain(); g2.gain.value = 0.18;
    o.connect(g); o2.connect(g2).connect(g); nodes.push(vibrato(ctx, o, t, f, 0.005, 5));
    const n = ctx.createBufferSource(); n.buffer = noise(ctx); n.loop = true;
    const bp = filter("bandpass", f * 2, 1.5), ng = ctx.createGain(); ng.gain.value = 0.05;
    n.connect(bp).connect(ng).connect(g); nodes.push(n);
    env(g, t, 0.06, v * 0.9, dur, 0.12);
  } else if (id === "oboe") {
    const o = osc("sawtooth", f);
    const bp = filter("bandpass", 1300, 1.6), hp = filter("highpass", f * 0.9);
    o.connect(hp).connect(bp).connect(g); nodes.push(vibrato(ctx, o, t, f, 0.003, 5.6));
    env(g, t, 0.04, v * 1.6, dur, 0.1);
  } else if (id === "clarinet") {
    const o = osc("square", f); const lp = filter("lowpass", f * 4);
    o.connect(lp).connect(g); env(g, t, 0.05, v * 0.55, dur, 0.12);
  } else if (id === "bassoon") {
    const o = osc("sawtooth", f); const lp = filter("lowpass", f * 3.2), bp = filter("peaking", 480, 2); bp.gain.value = 6;
    o.connect(lp).connect(bp).connect(g); env(g, t, 0.03, v * 0.8, dur, 0.08);
  } else if (["horn", "trumpet", "trombone", "tuba"].includes(id)) {
    const bright = { horn: 3, trumpet: 9, trombone: 5, tuba: 2.6 }[id];
    const o = osc("sawtooth", f); const lp = filter("lowpass", f * 1.2, 1.2);
    lp.frequency.setValueAtTime(f * 1.2, t); lp.frequency.exponentialRampToValueAtTime(Math.min(f * bright, 9000), t + 0.09);
    lp.frequency.exponentialRampToValueAtTime(Math.min(f * bright * 0.7, 9000), t + 0.4);
    o.connect(lp).connect(g);
    if (id !== "tuba") nodes.push(vibrato(ctx, o, t, f, 0.002, 5));
    env(g, t, 0.05, v * (id === "trumpet" ? 0.75 : id === "tuba" ? 1.3 : 0.9), dur, 0.15);
  } else if (id === "timpani") {
    const o = osc("sine", f * 1.04);
    o.frequency.setValueAtTime(f * 1.04, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.15);
    o.connect(g);
    const n = ctx.createBufferSource(); n.buffer = noise(ctx);
    const lp = filter("lowpass", 900), ng = ctx.createGain();
    ng.gain.setValueAtTime(v * 1.2, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    n.connect(lp).connect(ng).connect(out); nodes.push(n);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v * 3, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    dur = 1.7;
  }
  nodes.forEach((n) => { n.start(t); n.stop(t + dur + 0.2); });
  return nodes;
}

// One recorded note. Sustained instruments are held for the note's length and
// faded; harp and timpani ring out naturally.
function sampleVoice(ctx, out, id, buf, t, dur, vel) {
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain(); src.connect(g).connect(out);
  const peak = Math.max(0.05, vel) * 0.85;
  const ring = id === "harp" || id === "timpani";
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + (ring ? 0.005 : 0.03));
  let end;
  if (ring) end = t + Math.min(buf.duration, 3.2);
  else {
    const hold = Math.min(dur, buf.duration - 0.15);
    g.gain.setValueAtTime(peak, t + Math.max(0.04, hold - 0.05));
    g.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.28);
    end = t + hold + 0.3;
  }
  src.start(t); src.stop(end);
  return [src];
}

function impulse(ctx, seconds = 2.4) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
  }
  return buf;
}

class Orchestra {
  constructor() { this.ctx = null; this.active = []; this.timer = null; this.files = {}; this.onend = null; this.samples = {}; }

  // Fetches and decodes every note each part needs. Returns when all are in (or failed).
  loadSamples(ids) {
    if (this.loading) return this.loading;
    this.setup();
    const jobs = [];
    for (const id of ids) {
      if (!GM[id]) continue;
      const notes = [...new Set(part(id).map((n) => n[2]))];
      this.samples[id] = {};
      for (const m of notes) {
        jobs.push(fetch(`${SAMPLE_BASE}${GM[id]}-mp3/${noteName(m)}.mp3`)
          .then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
          .then((ab) => new Promise((res, rej) => this.ctx.decodeAudioData(ab, res, rej)))
          .then((buf) => { this.samples[id][m] = buf; })
          .catch(() => {}));
      }
    }
    this.loading = Promise.all(jobs);
    return this.loading;
  }

  async init(ids) {
    // Optional recordings dropped into /public/audio/ (listed by the server).
    try {
      const files = [];
      for (const id of ids) { const f = files.find((n) => n.replace(/\.[^.]+$/, "") === id); if (f) this.files[id] = `/audio/${f}`; }
    } catch {}
  }

  setup() {
    if (this.ctx) return;
    const ctx = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = ctx.createGain(); this.master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    const verb = ctx.createConvolver(); verb.buffer = impulse(ctx);
    const wet = ctx.createGain(); wet.gain.value = 0.28;
    this.bus = ctx.createGain();
    this.bus.connect(this.master); this.bus.connect(verb).connect(wet).connect(this.master);
    this.master.connect(comp).connect(ctx.destination);
  }

  get duration() { return 20 * BEAT + 1.5; }

  stop() {
    clearTimeout(this.timer);
    for (const n of this.active) { try { n.stop ? n.stop() : n.pause(); } catch {} }
    this.active = [];
  }

  play(ids) {
    this.stop();
    this.setup();
    this.ctx.resume();
    const t0 = this.ctx.currentTime + 0.08;
    // In a full ensemble, quieten each part a little.
    const out = this.ctx.createGain(); out.gain.value = ids.length > 1 ? 0.55 : 1; out.connect(this.bus);
    for (const id of ids) {
      if (this.files[id]) {
        const a = new Audio(this.files[id]); a.play().catch(() => {}); this.active.push(a); continue;
      }
      const bank = this.samples[id] || {};
      for (const [beat, len, midi, vel] of part(id)) {
        const t = t0 + beat * BEAT, d = len * BEAT * 0.98;
        this.active.push(...(bank[midi] ? sampleVoice(this.ctx, out, id, bank[midi], t, d, vel) : voice(this.ctx, out, id, midi, t, d, vel)));
      }
    }
    this.timer = setTimeout(() => { this.active = []; this.onend && this.onend(); }, this.duration * 1000);
  }
}

let state = { slideIndex: 0, messages: [], votes: {}, participants: 0, online: 0, __pins: {}, moderate: false, ended: false, reviews: 0, rating: null, submissions: 0 };

function qrSvg(url) {

}

  document.title = "Presenter · Hephzibah Academy";
  const config = await getJson("/api/config").catch(() => ({}));
  const last = store.get("hephzibah-host");
  document.body.className = "";
  app.innerHTML = `
  <header class="site-header"><div class="wrap">
    <a class="brand" href="/">${LOGO}<span class="brand-name"><b>Hephzibah</b><span>ACADEMY</span></span></a>

  </div></header>
  <main class="setup">
    <p class="eyebrow">${t("Presenter", "발표자")}</p>
    <h1 class="h2">${escape(t(deck.title, deck.ko.title))}</h1>
    <p class="lead" style="font-size:20px;margin-top:14px">${escape(t(deck.track, deck.ko.track))} · ${t("slides", "슬라이드")} ${deck.slides.length} · ~${deck.minutes}${t(" min", "분")}</p>
    <form id="start" style="margin-top:40px">
      ${config.passcodeRequired ? `<label class="field"><span>${t("Presenter passcode", "발표자 비밀번호")}</span><input class="input" name="passcode" type="password" autocomplete="current-password" required></label>` : ""}
      <button class="btn full" type="submit" style="width:100%">${t("Start live session", "실시간 발표 시작")} ${ARROW}</button>

    </form>
    ${last && last.lectureId === lectureId ? `<button class="btn ghost" id="resume" style="width:100%;margin-top:4px">${t("Resume room", "이어서 진행")} ${escape(last.code)}</button>` : ""}
    <p class="muted" style="font-size:14px;margin-top:28px">${t("Open this on the projector. Students join from their phones with the code or QR on screen. Keys: ←/→ move · N notes · Q show QR · F fullscreen.", "프로젝터에 띄우세요. 학생들은 화면의 코드나 QR로 휴대폰에서 입장해요. 키: ←/→ 이동 · N 노트 · Q QR 보기 · F 전체 화면.")}</p>
    <button class="lang-btn" id="langSetup" type="button" style="margin-top:12px">${t("한국어", "English")}</button>
  </main>`;
  app.querySelector("#langSetup").onclick = () => { setLang(getLang() === "ko" ? "en" : "ko"); showSetup(); };
  app.querySelector("#start").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true;
    try {
      const passcode = e.target.passcode ? e.target.passcode.value : undefined;
      const r = await api("/api/rooms", { lectureId, passcode });
      room = { code: r.code, hostKey: r.hostKey, lectureId };
      store.set("hephzibah-host", room);
      history.replaceState(null, "", `/present?lecture=${lectureId}&room=${r.code}`);
      startStage();
    } catch (err) { app.querySelector("#err").textContent = err.message; btn.disabled = false; }
  });
  const resume = app.querySelector("#resume");
  if (resume) resume.addEventListener("click", async () => {
    try { await api(`/api/rooms/${last.code}`); room = last; history.replaceState(null, "", `/present?lecture=${lectureId}&room=${last.code}`); startStage(); }
    catch { store.del("hephzibah-host"); resume.textContent = t("That room has expired — start a new one", "그 방은 끝났어요. 새로 시작해 주세요"); resume.disabled = true; }
  });
}

function escape(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ---------------- Stage ----------------
function startStage() {
  document.body.className = "stage-body";
  document.title = `${t(deck.title, deck.ko.title)} · Hephzibah Academy`;
  app.innerHTML = `
  <header class="topbar">
    <a class="brand" href="#" title="Hephzibah Academy">${LOGO}<span class="brand-name"><b>Hephzibah</b><span>ACADEMY</span></span></a>
    <div class="joinline">${room ? `${t("Join at", "입장:")} <u>${escape(joinHost())}</u><b>${room.code}</b>` : `<span class="muted">${t("Arrow keys to move · N for notes · F for fullscreen", "화살표로 이동 · N 노트 · F 전체 화면")}</span>`}</div>
    <span class="count" id="count">${room ? `<span class="dot"></span><span>0 ${t("joined", "명 입장")}</span>` : ""}</span>
  </header>
  <div class="stage" id="stage"></div>
  <footer class="bottombar">
    <div style="display:flex;align-items:center;gap:16px;flex:1;min-width:0">
      <span class="slide-pos" id="pos"></span><div class="progress"><i id="bar"></i></div>
      <span class="muted hide-sm" id="section" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
    </div>
    <div class="controls">
      ${room ? `<button class="ctl hide-sm" id="mod" aria-pressed="false" title="${t("Review messages before they appear", "화면에 띄우기 전에 검토")}">${t("Review first", "검토 후 표시")}</button>
      <button class="ctl hide-sm" id="queue">${t("Queue", "대기열")}<span class="badge" id="qcount" hidden>0</span></button>
      <button class="ctl hide-sm" id="qr">QR</button>
      <a class="ctl hide-sm" id="export" href="#" download>${t("Export", "내보내기")}</a>` : ""}
      <button class="ctl hide-sm" id="notes">${t("Notes", "노트")}</button>
      <button class="ctl" id="lang">${t("한국어", "English")}</button>
      <button class="ctl" id="prev" aria-label="${t("Previous slide", "이전 슬라이드")}">←</button>
      <button class="ctl" id="next" aria-label="${t("Next slide", "다음 슬라이드")}">→</button>
    </div>
  </footer>
  <aside class="drawer" id="drawer" hidden></aside>
  <div class="overlay" id="qrOverlay" hidden></div>`;

  if (room) {
    document.getElementById("export").href = `/api/rooms/${room.code}/export?key=${encodeURIComponent(room.hostKey)}`;
    document.getElementById("mod").onclick = () => hostOp({ op: "moderate", value: !state.moderate });
    document.getElementById("queue").onclick = () => toggleDrawer("queue");
    document.getElementById("qr").onclick = toggleQr;
  }
  document.getElementById("notes").onclick = () => toggleDrawer("notes");
  document.getElementById("lang").onclick = () => { setLang(getLang() === "ko" ? "en" : "ko"); startStage(); };
  document.getElementById("prev").onclick = () => go(state.slideIndex - 1);
  document.getElementById("next").onclick = forward;
  if (!keysBound) { document.addEventListener("keydown", onKey); keysBound = true; }
  if (room && !connected && !demo) { connected = true; connect(); }
  renderedSlide = -1;
  render();
}

function onKey(e) {
  if (e.target.closest("input, textarea")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); forward(); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(state.slideIndex - 1); }
  else if (e.key === "n" || e.key === "N") toggleDrawer("notes");
  else if ((e.key === "q" || e.key === "Q") && room) toggleQr();
  else if (e.key === "f" || e.key === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  else if (e.key === "Escape") { document.getElementById("qrOverlay").hidden = true; document.getElementById("drawer").hidden = true; }
}

// Slides with "reveal": true show their list items one click at a time.
function forward() {
  const nextStep = document.querySelector("#stage .step:not(.shown)");
  if (nextStep) { nextStep.classList.add("shown"); autoReveal(); return; }
  go(state.slideIndex + 1);
}

async function go(i) {
  if (i < 0 || i >= deck.slides.length || i === state.slideIndex) return;
  state.slideIndex = i; // optimistic
  render();
  if (room) hostOp({ op: "slide", index: i });
}

async function hostOp(body) {
  if (demo) { if (body.op === "status") { const m = state.messages.find((x) => x.id === body.id); if (m) m.status = body.status; update(); } return; }
  try { await api(`/api/rooms/${room.code}/host`, { key: room.hostKey, ...body }); }
  catch (err) { toast(err.message); }
}

function connect() {
  const es = new EventSource(`/api/rooms/${room.code}/stream?key=${encodeURIComponent(room.hostKey)}`);
  es.onmessage = (ev) => {
    const next = JSON.parse(ev.data);
    const slideChanged = next.slideIndex !== state.slideIndex;
    state = next;
    if (slideChanged) render(); else update();
  };
  es.onerror = () => {
    // EventSource reconnects automatically. If the room is gone (server restart), say so.
    api(`/api/rooms/${room.code}`).catch((err) => { if (err.status === 404) { es.close(); store.del("hephzibah-host"); toast(t("This room has ended (server restarted). Start a new session.", "방이 종료되었어요(서버 재시작). 새로 시작해 주세요.")); } });
  };
}

// ---------------- Rendering ----------------
function render() {
  const slide = tr(deck.slides[state.slideIndex]);
  if (renderedSlide !== state.slideIndex) orchestra.stop();
  renderedSlide = state.slideIndex;
  const stage = document.getElementById("stage");
  stage.replaceChildren(h("div", { class: "canvas" }, buildSlide(slide), slideLogo()));
  fitStage();
  document.getElementById("pos").textContent = `${String(state.slideIndex + 1).padStart(2, "0")} / ${deck.slides.length}`;
  document.getElementById("bar").style.width = `${((state.slideIndex + 1) / deck.slides.length) * 100}%`;
  document.getElementById("section").textContent = slide.section;
  const drawer = document.getElementById("drawer");
  if (!drawer.hidden && drawer.dataset.mode === "notes") fillNotes();
  update();
  autoReveal();
  if (demo) demoSlide(slide);
}

// Items that used to need a click ("reveal" lists, "titleSteps" titles) now appear on their own,
// slowly, one after another. Pressing → still shows the next one right away.
let revealTimer = null;
function autoReveal() {
  clearTimeout(revealTimer);
  const tick = (first) => {
    const next = document.querySelector("#stage .step:not(.shown)");
    if (!next) return;
    revealTimer = setTimeout(() => {
      const n = document.querySelector("#stage .step:not(.shown)");
      if (n) n.classList.add("shown");
      tick(false);
    }, (first ? 900 : next.classList.contains("slow") ? 1500 : 1200) * (demo ? 0.5 : 1)); // demo runs faster
  };
  tick(true);
}

function head(slide, compact) {
  return h("div", { class: "content" },
    h("p", { class: "eyebrow", text: slide.eyebrow }),
    h("h1", { class: "title" + (slide.small ? " small" : "") }, slide.titleSteps ? titleSteps(slide.title) : lines(slide.title)),
    slide.subtitle ? h("p", { class: "subtitle" + (slide.titleSteps ? " step slow" : ""), text: slide.subtitle }) : null);
}

// "titleSteps": true — each sentence of the title appears on its own click, slowly.
function titleSteps(text) {
  const frag = document.createDocumentFragment();
  String(text).split("\n").forEach((line, i) => {
    if (i) frag.append(document.createElement("br"));
    line.split(/(?<=[.!?])\s+/).forEach((part, j) => { if (j) frag.append(" "); frag.append(h("span", { class: "step slow", text: part })); });
  });
  return frag;
}

  if (room) {
    document.getElementById("count").innerHTML = `<span class="dot"></span><span>${state.participants} ${t("joined", "명 입장")}</span>`;
    const mod = document.getElementById("mod"); mod.setAttribute("aria-pressed", String(state.moderate));
    const pending = state.messages.filter((m) => m.status === "pending").length;
    const qc = document.getElementById("qcount"); qc.hidden = !pending; qc.textContent = pending;
    const drawer = document.getElementById("drawer");
    if (!drawer.hidden && drawer.dataset.mode === "queue") fillQueue();
  }

  const wall = document.getElementById("wall");
  if (wall) {
    const key = wall.dataset.slide;
    const msgs = state.messages.filter((m) => m.slideId === key && m.status === "shown");
    const have = new Set([...wall.querySelectorAll(".msg")].map((n) => Number(n.dataset.id)));
    const want = new Set(msgs.map((m) => m.id));
    if (wall.classList.contains("cloud")) renderCloud(wall, msgs);
    else wall.querySelectorAll(".msg").forEach((n) => { if (!want.has(Number(n.dataset.id))) n.remove(); });
    if (!wall.classList.contains("cloud")) for (const m of msgs) if (!have.has(m.id)) wall.prepend(msgCard(m, true));
    let empty = wall.querySelector(".wall-empty");
    if (!msgs.length && !empty) wall.append(h("p", { class: "wall-empty", text: room ? t("Waiting for the first answer…", "첫 답을 기다리고 있어요…") : t("Answers will appear here during a live session.", "실시간 발표 중에 답이 여기에 나타나요.") }));
    if (msgs.length && empty) empty.remove();
    document.getElementById("wallCount").textContent = msgs.length ? String(msgs.length) : "";
  }

  const poll = document.getElementById("poll");
  if (poll) {
    const tally = state.votes[slide.id] || {};
    const total = Object.values(tally).reduce((a, b) => a + b, 0);
    poll.querySelectorAll(".opt").forEach((o) => {
      const n = tally[o.dataset.value] || 0;
      o.querySelector(".num").textContent = total ? `${n} · ${Math.round((n / total) * 100)}%` : "0";
      o.querySelector(".bar i").style.width = total ? `${(n / total) * 100}%` : "0";
    });
    document.getElementById("wallCount").textContent = total ? `${total}${t(total === 1 ? " vote" : " votes", "표")}` : "";
  }

  const orch = document.getElementById("orch");
  if (orch && room) orch.querySelectorAll(".inst").forEach((b) => {
    const n = state.__pins[b.dataset.id] || 0;
    b.querySelector(".inroom").textContent = n ? t(`${n} in the room`, `${n}명 참여`) : insFamily(b.dataset.id);
  });

  if (room && deck.pseudonyms !== "bible") renderPit();

  const rs = document.getElementById("reviewStats");
  if (rs) rs.textContent = state.reviews ? t(`${state.reviews} reviews · ★ ${state.rating} · ${state.submissions} reflections submitted`, `리뷰 ${state.reviews}개 · ★ ${state.rating} · 성찰 ${state.submissions}개 제출`) : "";
}

// Orchestra seating: every student who joins takes a small seat in their section,
// laid out like an orchestra (strings in front, then woodwinds, brass, percussion).
const PIT_ROWS = ["strings", "woodwinds", "brass", "percussion"];
function renderPit() {
  let pit = document.getElementById("pit");
  if (!pit) { pit = h("div", { class: "pit", id: "pit", "aria-hidden": "true" }, h("i", { class: "podium" })); document.body.append(pit); }
  const rows = PIT_ROWS.map(() => []);
  for (const ins of __pins) {
    if (ins.kind === "bible") continue;
    const r = Math.max(0, PIT_ROWS.indexOf(ins.family.toLowerCase()));
    for (let i = 0; i < (state.__pins[ins.id] || 0); i++) rows[r].push(`${ins.id}:${i}`);
  }
  const keep = new Set();
  rows.forEach((seats, r) => {
    // Seats fill each row from the middle outwards, like an orchestra around the conductor.
    const R = 26 + r * 17, k = seats.length;
    const step = Math.min(17 / R, (Math.PI * 0.9) / Math.max(1, k - 1));
    seats.forEach((key, i) => {
      const a = Math.PI * 1.5 + (i - (k - 1) / 2) * step;
      let n = pit.querySelector(`[data-seat="${key}"]`);
      if (!n) { n = avatar(key.split(":")[0], 18); n.dataset.seat = key; n.classList.add("seat"); pit.append(n); }
      n.style.left = `calc(50% + ${(R * 1.5 * Math.cos(a)).toFixed(1)}px)`;
      n.style.top = `calc(100% + ${(R * Math.sin(a)).toFixed(1)}px)`;
      keep.add(key);
    });
  });
  pit.querySelectorAll(".seat").forEach((n) => { if (!keep.has(n.dataset.seat)) n.remove(); });
  pit.hidden = !keep.size;
}

// Word cloud: the same answer typed by several people grows bigger.
function renderCloud(wall, msgs) {
  const norm = (x) => x.toLowerCase().replace(/[\s.,!?~'"“”‘’·]+/g, " ").trim();
  const groups = new Map();
  for (const m of msgs) {
    const k = norm(m.text); if (!k) continue;
    const g = groups.get(k) || { text: m.text.trim(), n: 0, first: m.id };
    g.n++; groups.set(k, g);
  }
  const list = [...groups.values()].sort((a, b) => b.n - a.n || a.first - b.first);
  const max = Math.max(1, ...list.map((g) => g.n));
  const old = new Map([...wall.querySelectorAll(".cw")].map((n) => [n.dataset.k, n]));
  const frag = [];
  for (const g of list) {
    const k = norm(g.text);
    const size = 18 + (max > 1 ? (g.n - 1) / (max - 1) : 0) * 46 + Math.min(g.n - 1, 4) * 2;
    let n = old.get(k);
    if (!n) n = h("span", { class: "cw", "data-k": k });
    n.replaceChildren(g.text, g.n > 1 ? h("sup", { text: "×" + g.n }) : "");
    n.style.fontSize = `clamp(14px, ${(size / 13).toFixed(2)}cqw, ${Math.round(size * 1.3)}px)`;
    n.classList.toggle("hot", g.n === max && max > 1);
    frag.push(n);
  }
  wall.querySelectorAll(".cw").forEach((n) => { if (!frag.includes(n)) n.remove(); });
  for (const n of frag) wall.append(n);
}

function msgCard(m, canHide) {
  const ins = instrumentById(m.avatarId);
  const card = h("article", { class: "msg", "data-id": m.id },
    h("p", { text: m.text }),
    h("div", { class: "who" }, avatar(m.avatarId, 26), h("span", { text: aliasText(m.alias, m.avatarId) })));
  if (canHide && room) card.append(h("button", { class: "x", type: "button", title: t("Hide from screen", "화면에서 숨기기"), onclick: () => hostOp({ op: "status", id: m.id, status: "hidden" }) }, t("Hide", "숨기기")));
  return card;
}

function markPlaying(ids) {
  document.querySelectorAll(".inst").forEach((b) => b.classList.toggle("playing", ids.includes(b.dataset.id)));
}
function playSolo(id) {
  orchestra.play([id]); markPlaying([id]);
  orchestra.onend = () => markPlaying([]);
}
function playAll() {
  const ids = __pins.map((i) => i.id);
  orchestra.play(ids); markPlaying(ids);
  orchestra.onend = () => markPlaying([]);
}

// ---------------- Drawer ----------------
function toggleDrawer(mode) {
  const d = document.getElementById("drawer");
  if (!d.hidden && d.dataset.mode === mode) { d.hidden = true; return; }
  d.dataset.mode = mode; d.hidden = false;
  mode === "notes" ? fillNotes() : fillQueue();
}
function fillNotes() {
  const slide = tr(deck.slides[state.slideIndex]);
  const d = document.getElementById("drawer");
  d.replaceChildren(h("h3", { text: `${t("Speaker notes", "발표자 노트")} · ${state.slideIndex + 1}` }), h("div", { class: "notes" }, (slide.notes || []).map((n) => h("p", { text: n }))));
}
function fillQueue() {
  const d = document.getElementById("drawer");
  const pending = state.messages.filter((m) => m.status === "pending");
  const hidden = state.messages.filter((m) => m.status === "hidden");
  const qa = state.messages.filter((m) => m.channel === "qa" && m.status === "shown");
  d.replaceChildren(
    h("h3", { text: `${t("Waiting for review", "검토 대기")} (${pending.length})` }),
    pending.length > 1 ? h("button", { class: "ctl", style: "margin-bottom:12px", onclick: () => hostOp({ op: "approveAll" }) }, t("Approve all", "모두 승인")) : null,
    h("div", { class: "pending" }, pending.length ? pending.map((m) => {
      const c = msgCard(m, false);
      c.append(h("div", { class: "row" }, h("button", { class: "ctl", onclick: () => hostOp({ op: "status", id: m.id, status: "shown" }) }, t("Show", "표시")),
        h("button", { class: "ctl", onclick: () => hostOp({ op: "status", id: m.id, status: "hidden" }) }, t("Hide", "숨기기"))));
      return c;
    }) : h("p", { class: "muted", text: state.moderate ? t("Nothing waiting.", "대기 중인 메시지가 없어요.") : t("“Review first” is off — messages appear immediately.", "“검토 후 표시”가 꺼져 있어 메시지가 바로 나타나요.") })),
    h("h3", { style: "margin-top:28px", text: `${t("Audience questions", "청중 질문")} (${qa.length})` }),
    h("div", {}, qa.length ? qa.map((m) => msgCard(m, true)) : h("p", { class: "muted", text: t("Students can ask questions from their phones anytime.", "학생들은 언제든 휴대폰으로 질문할 수 있어요.") })),
    hidden.length ? h("h3", { style: "margin-top:28px", text: `${t("Hidden", "숨김")} (${hidden.length})` }) : null,
    h("div", {}, hidden.map((m) => { const c = msgCard(m, false); c.append(h("button", { class: "ctl", onclick: () => hostOp({ op: "status", id: m.id, status: "shown" }) }, t("Show again", "다시 표시"))); return c; })));
}

function toast(text) {
  const el = h("div", { class: "toast", role: "status", text });
  document.body.append(el); setTimeout(() => el.remove(), 4000);
}

// Protected lecture: ask for the admin password, then reload.
function showLock() {
  document.title = "Hephzibah Academy";
  app.innerHTML = `
  <header class="site-header"><div class="wrap">
    <a class="brand" href="/">${LOGO}<span class="brand-name"><b>Hephzibah</b><span>ACADEMY</span></span></a>
  </div></header>
  <main class="setup">
    <p class="eyebrow">${t("Admin", "관리자")}</p>
    <h1 class="h2">${t("This lecture is locked.", "이 강의는 잠겨 있어요.")}</h1>
    <form id="unlock" style="margin-top:32px">
      <label class="field"><span>${t("Admin password", "관리자 암호")}</span><input class="input" name="pw" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">${t("Unlock", "열기")}</button>
      <p class="error" role="alert"></p>
    </form>
  </main>`;
  const f = app.querySelector("#unlock");
  f.onsubmit = async (e) => {
    e.preventDefault();
    try { await api("/api/admin/login", { passcode: f.pw.value }); location.reload(); }
    catch (err) { f.querySelector(".error").textContent = t("Incorrect password.", "암호가 맞지 않아요."); }
  };
}

// ---------------- Demo mode ----------------
// For introducing the lecture: a pretend class joins one by one, and answers,
// votes and reviews arrive over a few seconds on each slide, as in a real session.
let demoTimers = [], demoNextId = 1;
const demoPeople = [];
const rnd = (a, b) => a + Math.random() * (b - a);

function demoStart() {
  room = { code: "HZ27", hostKey: "demo", lectureId };
  const pool = __pins.filter((i) => i.kind !== "bible");
  const bible = deck.pseudonyms === "bible";
  const names = bible ? __pins.filter((i) => i.kind === "bible") : pool;
  let tm = 800;
  for (let i = 0; i < 24; i++) {
    tm += rnd(250, 750);
    setTimeout(() => {
      const ins = names[(i * 5 + 3) % names.length];
      const n = demoPeople.filter((p) => p.avatarId === ins.id).length + 1;
      demoPeople.push({ avatarId: ins.id, alias: n > 1 ? `${ins.name} ${n}` : ins.name });
      state.participants = state.online = demoPeople.length;
      state.__pins[ins.id] = (state.__pins[ins.id] || 0) + 1;
      update();
    }, tm);
  }
}

function demoSlide(slide) {
  demoTimers.forEach(clearTimeout); demoTimers = [];
  const later = (ms, fn) => demoTimers.push(setTimeout(() => { fn(); update(); }, ms));
  const person = () => demoPeople[Math.floor(Math.random() * demoPeople.length)] || { avatarId: "violin", alias: "Violin" };
  const ix = slide.interaction;
  if (!ix) return;
  if (ix.type === "choice" && !state.votes[slide.id]) {
    const tally = (state.votes[slide.id] = {});
    const weights = ix.options.map((o, i) => (ix.options.length - i) * rnd(0.6, 1.4));
    const sum = weights.reduce((a, b) => a + b, 0);
    let tm = 400;
    for (let v = 0; v < 22; v++) {
      tm += rnd(100, 330);
      let x = Math.random() * sum, k = 0;
      while (x > weights[k] && k < weights.length - 1) x -= weights[k++];
      const val = ix.options[k].value;
      later(tm, () => (tally[val] = (tally[val] || 0) + 1));
    }
  }
  const answers = slide.demo || [];
  const key = ix.channel === "qa" ? "qa" : slide.id;
  if ((ix.type === "text" || ix.type === "review") && answers.length && !state.messages.some((m) => m.slideId === key)) {
    let tm = 500;
    for (const text of answers) {
      tm += rnd(ix.display === "cloud" ? 180 : 450, ix.display === "cloud" ? 450 : 1000);
      later(tm, () => { const p = person(); state.messages.push({ id: demoNextId++, slideId: key, channel: ix.channel || "slide", status: "shown", text, alias: p.alias, avatarId: p.avatarId }); });
    }
    if (ix.type === "review") {
      let n = 0, sumR = 0;
      for (let i = 0; i < 14; i++) later(600 + i * 350, () => { n++; sumR += Math.random() < 0.75 ? 5 : 4; state.reviews = n; state.rating = (sumR / n).toFixed(1); state.submissions = Math.max(0, n - 3); });
    }
  }
}
