<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My User Manual · Hephzibah Academy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2213%22%20fill%3D%22%23fafaf7%22%2F%3E%3Cpath%20d%3D%22M10%2022h11v12h17V12h13v41H38V42H21v11H10z%22%20fill%3D%22%23111a2e%22%2F%3E%3C%2Fsvg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Hephzibah Academy — shared design system */
:root {
  --paper: #fafaf7;
  --paper-2: #f0efea;
  --ink: #111a2e;
  --ink-2: #3a4256;
  --muted: #6b7183;
  --rule: #111a2e;
  --hair: rgba(17, 26, 46, 0.14);
  --accent: #e4c58c;
  --ok: #1f9d55;
  --radius: 6px;
  --gutter: clamp(16px, 4.2vw, 64px);
  --font: "Plus Jakarta Sans", "Noto Sans KR", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
img, svg { display: block; max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 var(--gutter); }

/* ---------- Header ---------- */
.site-header { border-bottom: 1px solid var(--rule); }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 104px; }
.brand { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 52px; height: 52px; flex: none; }
.brand-name { display: flex; flex-direction: column; line-height: 1; }
.brand-name b { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.brand-name span { font-size: 18px; font-weight: 600; letter-spacing: 0.22em; margin-top: 6px; }
.nav { display: flex; align-items: center; gap: clamp(20px, 3.6vw, 56px); font-size: 17px; font-weight: 500; }
.nav a { text-decoration: none; padding: 6px 0; border-bottom: 1.5px solid transparent; }
.nav a:hover, .nav a[aria-current="page"] { border-bottom-color: var(--ink); }
.nav .divider { width: 1px; height: 28px; background: var(--ink); }
.nav .login { display: inline-flex; align-items: center; gap: 8px; }
.arrow { width: 0.9em; height: 0.9em; flex: none; }
.menu-btn { display: none; background: none; border: 1px solid var(--hair); border-radius: var(--radius); padding: 8px 12px; cursor: pointer; }

@media (max-width: 760px) {
  .site-header .wrap { min-height: 76px; }
  .brand-mark { width: 38px; height: 38px; }
  .brand-name b { font-size: 22px; }
  .brand-name span { font-size: 13px; }
  .menu-btn { display: block; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 76px; flex-direction: column; align-items: stretch; gap: 0;
    background: var(--paper); border-bottom: 1px solid var(--rule); padding: 8px var(--gutter) 16px; z-index: 10; }
  .nav.open { display: flex; }
  .nav a { padding: 14px 0; border-bottom: 1px solid var(--hair); }
  .nav .divider { display: none; }
  .site-header { position: relative; }
}

/* ---------- Type ---------- */
.eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; margin: 0 0 28px; }
.display { font-size: clamp(46px, 8.2vw, 122px); line-height: 0.98; letter-spacing: -0.045em; font-weight: 800; margin: 0; }
.h2 { font-size: clamp(32px, 4.4vw, 60px); line-height: 1.05; letter-spacing: -0.035em; font-weight: 800; margin: 0; }
.h3 { font-size: clamp(22px, 2.2vw, 30px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 700; margin: 0; }
.lead { font-size: clamp(19px, 2vw, 30px); line-height: 1.4; color: var(--ink); margin: 28px 0 0; font-weight: 400; }
.muted { color: var(--muted); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 36px; border-radius: var(--radius);
  background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600; font-size: 18px; border: 1px solid var(--ink);
  cursor: pointer; transition: transform .15s ease, background .15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--paper-2); }
.btn.small { padding: 11px 20px; font-size: 15px; }

/* ---------- Hero ---------- */
.hero .wrap { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 40px; padding-top: clamp(56px, 10vh, 120px); padding-bottom: clamp(56px, 12vh, 128px); }
.hero .vertical { writing-mode: vertical-rl; font-size: 14px; letter-spacing: 0.34em; font-weight: 600; border-left: 1px solid var(--ink);
  padding-left: 28px; align-self: start; height: 384px; display: flex; align-items: center; }
.hero .cta { margin-top: 52px; }
@media (max-width: 760px) { .hero .vertical { display: none; } .hero .wrap { grid-template-columns: 1fr; } }

/* ---------- Pillars ---------- */
.pillars { border-top: 1px solid var(--rule); }
.pillars .wrap { display: grid; grid-template-columns: repeat(3, 1fr); }
.pillar { padding: 28px 24px 32px 0; display: flex; gap: 22px; align-items: baseline; }
.pillar .num { font-size: 16px; font-weight: 600; letter-spacing: 0.18em; }
.pillar h3 { font-size: clamp(24px, 2.4vw, 34px); letter-spacing: -0.02em; margin: 0; font-weight: 700; }
.pillar p { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; max-width: 30ch; }
@media (max-width: 760px) { .pillars .wrap { grid-template-columns: 1fr; } .pillar { border-bottom: 1px solid var(--hair); } }

/* ---------- Sections ---------- */
.section { border-top: 1px solid var(--rule); padding: clamp(56px, 9vw, 120px) 0; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 48px; }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(32px, 6vw, 96px); }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
.prose p { font-size: 19px; line-height: 1.65; margin: 0 0 18px; color: var(--ink-2); max-width: 62ch; }
.quote { font-size: clamp(22px, 2.4vw, 32px); line-height: 1.35; letter-spacing: -0.015em; font-weight: 500; margin: 0; }
.quote cite { display: block; margin-top: 18px; font-style: normal; font-size: 14px; letter-spacing: 0.24em; text-transform: uppercase; font-weight: 600; }

/* ---------- Lecture cards ---------- */
.tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; padding: 6px 10px;
  border: 1px solid var(--ink); border-radius: 999px; }
.tag.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: 1px; }
.card { display: grid; grid-template-columns: auto 1fr auto; gap: clamp(20px, 4vw, 56px); align-items: start; padding: 36px 0;
  border-top: 1px solid var(--rule); text-decoration: none; color: inherit; }
.card:last-child { border-bottom: 1px solid var(--rule); }
.card .num { font-size: 16px; font-weight: 600; letter-spacing: 0.18em; padding-top: 10px; }
.card h3 { font-size: clamp(30px, 3.6vw, 52px); letter-spacing: -0.035em; line-height: 1.05; margin: 12px 0 10px; font-weight: 800; }
.card p { margin: 0; color: var(--ink-2); max-width: 60ch; font-size: 17px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 18px; font-size: 14px; color: var(--muted); font-weight: 500; }
.card .go { width: 56px; height: 56px; border: 1px solid var(--ink); border-radius: 50%; display: grid; place-items: center; transition: background .15s, color .15s; }
a.card:hover .go { background: var(--ink); color: var(--paper); }
.card.disabled { opacity: .5; }
@media (max-width: 760px) { .card { grid-template-columns: 1fr; } .card .go { display: none; } }

.tabs { display: flex; gap: 10px; flex-wrap: wrap; }
.tabs button { background: transparent; border: 1px solid var(--ink); border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 15px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tabs button:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- Footer ---------- */
.site-footer { border-top: 1px solid var(--rule); }
.site-footer .wrap { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-top: 28px; padding-bottom: 32px;
  font-size: 14px; letter-spacing: 0.1em; font-weight: 500; }
.site-footer .right { letter-spacing: 0.22em; text-transform: uppercase; }

/* ---------- Forms ---------- */
.field { display: block; margin-bottom: 18px; }
.field > span { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px; }
.input, textarea.input { width: 100%; background: #fff; border: 1px solid var(--hair); border-radius: var(--radius); padding: 14px 16px; font-size: 17px; }
.input:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px rgba(17,26,46,.12); }
textarea.input { resize: vertical; min-height: 104px; line-height: 1.45; }
.error { color: #b42318; font-size: 15px; margin: 10px 0 0; min-height: 1.4em; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* Instrument badge (score abbreviation, tinted by family) */
.avatar { --size: 44px; width: var(--size); height: var(--size); border-radius: 50%; flex: none; display: inline-grid; place-items: center; background: var(--ink); color: var(--paper); line-height: 1;
  font-weight: 700; font-size: calc(var(--size) * 0.38); letter-spacing: -0.01em; font-style: italic; font-family: Georgia, "Times New Roman", serif; }
.avatar[data-family="strings"] { background: #1d3a6b; }
.avatar[data-family="woodwinds"] { background: #2f6b4f; }
.avatar[data-family="brass"] { background: #a8741a; }
.avatar[data-family="percussion"] { background: #8e3b2e; }

/* Light and Salt */
.verse p { margin: 0; }
.salt-light { display: grid; grid-template-columns: 1fr 1fr; margin-top: 40px; border-top: 1px solid var(--rule); }
.salt-light > div { padding: 22px 24px 0 0; }
.salt-light .num { font-size: 13px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
.salt-light p { margin: 8px 0 0; color: var(--ink-2); font-size: 16px; max-width: 34ch; }
@media (max-width: 600px) { .salt-light { grid-template-columns: 1fr; } }
.hero-ref { margin: 28px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
.hero-ref a { text-decoration: none; border-bottom: 1px solid currentColor; }
.card[hidden] { display: none; }

/* Hephzibah × Beulah lockup */
.lockup { display: flex; align-items: center; gap: clamp(18px, 3vw, 36px); flex-wrap: wrap; }
.lk { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.lk-mark { width: 30px; height: 30px; flex: none; }
.lk-name { display: flex; flex-direction: column; line-height: 1; }
.lk-name b { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.lk-name span { font-size: 10px; font-weight: 600; letter-spacing: 0.22em; margin-top: 4px; }
.lk-sep { width: 1px; height: 30px; background: var(--ink); }
.lockup.big .lk-mark { width: 48px; height: 48px; }
.lockup.big .lk-name b { font-size: 28px; }
.lockup.big .lk-name span { font-size: 13px; margin-top: 6px; }
.lockup.big .lk-sep { height: 48px; }
.site-footer .footer-brands { padding-top: 32px; padding-bottom: 0; }

/* Town on a hill illustration */
.hill-art { width: 100%; max-width: 420px; height: auto; color: var(--ink); margin-top: clamp(28px, 4vw, 48px); overflow: visible; }
.hill-art .glow { transform-origin: 240px 132px; animation: glow 4.5s ease-in-out infinite; }
.hill-art .rays { animation: rays 4.5s ease-in-out infinite; }
@keyframes glow { 50% { transform: scale(1.12); opacity: .75; } }
@keyframes rays { 50% { opacity: .2; } }
.mission { margin: 24px 0 0; font-size: clamp(18px, 1.6vw, 22px); line-height: 1.5; color: var(--ink-2); max-width: 36ch; }
.mission b { color: var(--ink); }

/* Yellow light accents */
.brand-mark .lamp, .lk-mark .lamp { fill: var(--accent); filter: drop-shadow(0 0 2.5px rgba(214, 235, 0, 0.95)); }
.spark { display: inline-block; width: 0.13em; height: 0.13em; margin-left: 0.12em; border-radius: 50%;
  background: var(--accent); animation: blink 3s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

/* Hephzibah & Beulah names (Isaiah 62:4) */
.names2 { margin: 8px 0 0; border-top: 1px solid var(--rule); }
.names2 > div { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: baseline; gap: 24px; padding: clamp(18px, 3vw, 36px) 0; border-bottom: 1px solid var(--rule); }
.names2 dt { font-size: clamp(52px, 9vw, 140px); font-weight: 800; letter-spacing: -0.05em; line-height: 0.95; }
.names2 dd { margin: 0; font-size: clamp(18px, 2vw, 28px); color: var(--ink-2); letter-spacing: -0.01em; }
.names2-verse { margin: 28px 0 0; max-width: 60ch; color: var(--muted); font-size: 16px; }
.names2-verse cite { font-style: normal; font-weight: 700; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; margin-left: 8px; }
@media (max-width: 640px) { .names2 > div { grid-template-columns: 1fr; gap: 8px; } }
.names2 .heb { display: block; margin-top: 12px; font-size: 18px; font-weight: 500; letter-spacing: 0; color: var(--muted); font-family: "Noto Sans Hebrew", "Arial Hebrew", "David", var(--font); direction: rtl; text-align: left; unicode-bidi: isolate; }
.names2-lead { margin: 32px 0 0; font-size: clamp(20px, 2vw, 28px); font-weight: 700; letter-spacing: -0.02em; }
.names2-lead + .names2-verse { margin-top: 10px; }
.spark.sm { width: 0.45em; height: 0.45em; margin-left: 0; vertical-align: 0.05em; }

/* Language toggle */
.lang-btn { background: transparent; border: 1px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.lang-btn:hover { background: var(--ink); color: var(--paper); }
html[lang="ko"] body { word-break: keep-all; }
@media (max-width: 760px) { .nav .lang-btn { margin-top: 12px; align-self: flex-start; } }
.names2-lead { max-width: 40ch; }

/* Navigation: tighter on mid widths, collapse to the Menu button below 1080px */
.nav a { white-space: nowrap; }
@media (max-width: 1320px) { .nav { gap: 24px; font-size: 16px; } }
@media (max-width: 1080px) {
  .site-header { position: relative; }
  .menu-btn { display: block; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; align-items: stretch; gap: 0;
    background: var(--paper); border-bottom: 1px solid var(--rule); padding: 8px var(--gutter) 16px; z-index: 10; }
  .nav.open { display: flex; }
  .nav a { padding: 14px 0; border-bottom: 1px solid var(--hair); }
  .nav .divider { display: none; }
  .nav .lang-btn { margin-top: 12px; align-self: flex-start; }
}
.later { margin: 14px 0 0; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.card:has(+ .later) { border-bottom: 1px solid var(--rule); }

/* About: Hephzibah + Beulah pairing */
.names2 dd { display: grid; gap: 6px; }
.names2 .nm-mean { font-size: clamp(20px, 2vw, 28px); color: var(--ink); letter-spacing: -0.01em; }
.names2 .nm-tag { font-size: 16px; color: var(--ink-2); }
.names2 .nm-role { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.names2 > .names2-plus { display: block; border-bottom: 0; padding: 0; margin: -14px 0; font-size: 28px; font-weight: 300; color: var(--muted); line-height: 1; }
.names2 > .names2-plus { display: grid; place-items: center; width: 34px; height: 34px; margin: -17px 0; position: relative; z-index: 1;
  border: 1px solid var(--rule); border-radius: 50%; background: var(--paper); font-size: 20px; font-weight: 400; color: var(--ink); }
.names2 > .names2-plus { grid-template-columns: 1fr; gap: 0; padding: 0; line-height: 1; }
.avatar[data-family="bible"] { background-color: var(--paper-2); background-size: 400% 300%; background-repeat: no-repeat; border: 1px solid var(--hair); }

[hidden] { display: none !important; }

/* ===== Subtle motion ===== */
:root { --ease: cubic-bezier(.2,.7,.1,1); }
.m-on .display .w { display: inline-block; opacity: 0; transform: translateY(.35em); animation: m-rise .9s var(--ease) forwards; }
@keyframes m-rise { to { opacity: 1; transform: none; } }
.m-on .hero .eyebrow, .m-on .hero-ref, .m-on .hero .cta { opacity: 0; animation: m-fade .9s var(--ease) forwards; }
.m-on .hero .eyebrow { animation-delay: .05s; }
.m-on .hero-ref { animation-delay: .75s; }
.m-on .hero .cta { animation-delay: .9s; }
@keyframes m-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* header rule draws in */
.m-on .site-header { border-bottom-color: transparent; position: relative; }
.m-on .site-header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--rule); transform: scaleX(0); transform-origin: left; animation: m-draw 1.4s .2s var(--ease) forwards; }
@keyframes m-draw { to { transform: scaleX(1); } }
/* vertical text line */
.m-on .hero .vertical { border-left-color: transparent; position: relative; }
.m-on .hero .vertical::before { content: ""; position: absolute; left: -1px; top: 0; width: 1px; height: 100%; background: var(--ink); transform: scaleY(0); transform-origin: top; animation: m-drawy 1.6s .5s var(--ease) forwards; }
.m-on .hero .vertical { opacity: 0; animation: m-fade 1.2s .6s var(--ease) forwards; }
@keyframes m-drawy { to { transform: scaleY(1); } }
/* scroll reveals */
.m-on .rv { opacity: 0; transform: translateY(18px); transition: opacity .9s var(--ease), transform .9s var(--ease); transition-delay: var(--d, 0s); }
.m-on .rv.in { opacity: 1; transform: none; }
.m-on .rule-draw { position: relative; border-top-color: transparent !important; }
.m-on .rule-draw::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px; background: var(--rule); transform: scaleX(0); transform-origin: left; transition: transform 1.3s var(--ease); }
.m-on .rule-draw.in::before { transform: scaleX(1); }
/* hill line drawing */
.m-on .hill-art g[fill="none"] path { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); transition: stroke-dashoffset 2.2s var(--ease); }
.m-on .hill-art.in g[fill="none"] path { stroke-dashoffset: 0; }
.m-on .hill-art g[fill="none"] path:nth-child(2) { transition-delay: .9s; }
.m-on .hill-art g[fill="none"] path:nth-child(3) { transition-delay: 1.1s; }
.m-on .hill-art g[fill="none"] path:nth-child(4) { transition-delay: 1.3s; }
.m-on .hill-art rect, .m-on .hill-art .glow, .m-on .hill-art .rays { opacity: 0; transition: opacity 1.2s ease 2.2s; }
.m-on .hill-art.in rect, .m-on .hill-art.in .rays { opacity: 1; }
.m-on .hill-art:not(.in) .glow, .m-on .hill-art:not(.in) .rays { animation: none; }
.m-on .hill-art.in .glow { opacity: 1; animation-delay: 2.4s; }
.m-on .hill-art.in .rays { animation-delay: 2.4s; }
/* big names slide */
.m-on .names2 dt { transition: transform 1.1s var(--ease), opacity 1.1s var(--ease); }
.m-on .names2 > div.rv:not(.in) dt { transform: translateX(-24px); }
/* hover micro-interactions */
.card { transition: background .3s ease, transform .3s var(--ease); }
a.card:hover { background: rgba(17,26,46,.025); }
a.card:hover h3 { transform: translateX(4px); }
.card h3 { transition: transform .35s var(--ease); }
.btn .arrow, .go .arrow { transition: transform .3s var(--ease); }
.btn:hover .arrow, a.card:hover .go .arrow { transform: translate(2px,-2px); }
.nav a { background-image: linear-gradient(var(--ink), var(--ink)); background-size: 0 1px; background-repeat: no-repeat; background-position: 0 100%; border-bottom-color: transparent !important; transition: background-size .35s var(--ease); }
.nav a:hover, .nav a[aria-current="page"] { background-size: 100% 1px; }
@media (prefers-reduced-motion: reduce) {
  .m-on .display .w, .m-on .hero .eyebrow, .m-on .hero-ref, .m-on .hero .cta, .m-on .hero .vertical, .m-on .rv { opacity: 1 !important; transform: none !important; animation: none !important; transition: none !important; }
  .m-on .site-header::after, .m-on .hero .vertical::before, .m-on .rule-draw::before { transform: none !important; animation: none !important; }
  .m-on .hill-art g[fill="none"] path { stroke-dashoffset: 0 !important; } .m-on .hill-art rect, .m-on .hill-art .rays, .m-on .hill-art .glow { opacity: 1 !important; }
}


/* ===== Warm tone ===== */
:root {
  --paper: #fbf8f2; --paper-2: #f3ece1; --ink: #1b2133; --ink-2: #4b4640; --muted: #8b8276;
  --rule: #2a2a33; --hair: rgba(120, 92, 55, 0.18); --accent: #e4c58c;
  --serif: "Fraunces", "Gowun Batang", Georgia, serif;
}
html body { background: var(--paper); }
html .hero { background: radial-gradient(60% 70% at 92% 8%, rgba(228,197,140,0.09), rgba(228,197,140,0.0) 70%); }
html .site-header { background: transparent; }
html .quote, html .names2-verse, html .names2-lead, html .mission b {
  font-family: var(--serif); font-weight: 400; letter-spacing: -0.005em; }
html .quote p { font-style: italic; font-size: clamp(22px, 2.3vw, 31px); line-height: 1.45; }
html .names2-lead { font-size: clamp(22px, 2.2vw, 30px); font-style: italic; }
html .names2-verse { font-size: 18px; font-style: italic; }
html .mission b { font-size: 1.12em; font-style: italic; }
html[lang="ko"] .quote p, html[lang="ko"] .names2-lead, html[lang="ko"] .names2-verse { font-style: normal; font-family: "Gowun Batang", serif; }
html #light-and-salt { background: linear-gradient(180deg, #f6eee1, #f9f4ea); border-top-color: transparent; }
html #light-and-salt .hill-art .glow { opacity: .95; }
html .btn { border-radius: 12px; }
html .btn:not(.ghost) { background: #1b2133; box-shadow: 0 6px 18px rgba(27,33,51,.14); }
html .card { border-radius: 0; }
html a.card:hover { background: rgba(228,197,140,0.04); }
html .tag { border-color: var(--hair); background: #fffaf0; }
html .pillars { background: #fdfaf4; }
html .pillar h3 { font-weight: 700; }
html .site-footer { background: #f4ede2; }
html .input { border-radius: 10px; background: #fffdf8; }
html .lang-btn { border-color: var(--hair); background: #fffaf0; }
html .spark { background: var(--accent); box-shadow: 0 0 .12em rgba(228,197,140,0.42); }
html .lang-btn:hover { background: var(--ink); color: var(--paper); }

/* ===== Door illustration (hero) ===== */
.hero .wrap { grid-template-columns: minmax(0,1fr) auto auto; align-items: center; }
.door-art { width: clamp(260px, 30vw, 440px); height: auto; overflow: visible; color: var(--ink); }
.door-art .door-glow { opacity: 0; animation: doorGlow 2.4s 1.4s ease forwards, doorBreath 6s 3.8s ease-in-out infinite; transform-origin: 240px 190px; }
@keyframes doorGlow { to { opacity: 1; } }
@keyframes doorBreath { 50% { transform: scale(1.06); opacity: .8; } }
@media (max-width: 900px) { .hero .wrap { grid-template-columns: 1fr; } .hero .vertical { display: none; } .door-art { width: min(320px, 80vw); margin: 8px auto 0; } }
@media (prefers-reduced-motion: reduce) { .door-art .door-glow { opacity: 1; animation: none; } }
.site-footer .wrap.legal { padding-top: 0; padding-bottom: 24px; font-size: 13px; color: var(--muted); }
/* Course reviews */
.rv-sum { display: flex; align-items: baseline; gap: 12px; margin: 0 0 20px; }
.rv-sum b { font-size: 44px; letter-spacing: -0.04em; line-height: 1; }
.rv-stars { color: #c9a35f; letter-spacing: 2px; }
.rv-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.rv-list li { background: #fffdf9; border: 1px solid var(--hair); border-radius: 14px; padding: 16px; display: grid; gap: 8px; }
.rv-list p { margin: 0; }
.rv-list small { color: var(--muted); }
.instructor { display: flex; gap: 16px; align-items: center; }
.instructor .ph { width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 700; font-size: 22px; flex: none; }
.instructor b { display: block; font-size: 19px; }
.instructor span { color: var(--muted); font-size: 15px; }
.hero-intro { margin: 18px 0 0; font-size: clamp(17px, 1.6vw, 22px); color: var(--ink-2); max-width: 32ch; }
.lang-btn.lang-mobile { display: none; }
@media (max-width: 1080px) {
  .lang-btn.lang-mobile { display: inline-block; margin-left: auto; margin-right: 10px; }
  .nav .lang-btn { display: none; }
}

/* ---------- Presenter stage ---------- */
body.stage-body { height: 100vh; height: 100dvh; overflow: hidden; }
body.stage-body #app { height: 100%; display: flex; flex-direction: column; }
.topbar, .bottombar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 clamp(16px, 2.6cqw, 40px); flex: none; }
.topbar { height: 64px; border-bottom: 1px solid var(--rule); }
.bottombar { height: 60px; border-top: 1px solid var(--rule); font-size: 14px; }
.topbar .brand-mark { width: 30px; height: 30px; }
.topbar .brand-name b { font-size: 18px; }
.topbar .brand-name span { font-size: 10px; margin-top: 3px; }
.joinline { font-size: clamp(14px, 1.3cqw, 20px); font-weight: 500; text-align: center; }
.joinline b { font-weight: 800; letter-spacing: 0.14em; background: var(--ink); color: var(--paper); padding: 2px 10px; border-radius: 4px; margin-left: 6px; }
.count { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(31,157,85,.15); }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
.ctl { background: transparent; border: 1px solid var(--hair); border-radius: var(--radius); padding: 7px 12px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; }
.ctl:hover { border-color: var(--ink); }
.ctl[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ctl .badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: #c2410c; color: #fff; font-size: 12px; margin-left: 4px; }
.progress { position: relative; height: 2px; background: var(--hair); flex: 1; max-width: 260px; }
.progress i { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.slide-pos { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: 0.12em; }

.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.slide { position: absolute; inset: 0; padding: clamp(28px, 5cqh, 72px) clamp(24px, 5cqw, 96px); display: grid; animation: slideIn .45s ease both; }
@keyframes slideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.slide .eyebrow { font-size: clamp(12px, 1.1cqw, 16px); margin-bottom: clamp(16px, 3cqh, 36px); }
.slide .title { font-size: clamp(36px, 6.2cqw, 112px); line-height: 1.02; letter-spacing: -0.045em; font-weight: 800; margin: 0; }
.slide.compact .title { font-size: clamp(30px, 4.2cqw, 76px); }
.slide .subtitle { font-size: clamp(17px, 1.9cqw, 32px); line-height: 1.35; margin: clamp(16px, 3cqh, 32px) 0 0; color: var(--ink-2); max-width: 40ch; }
.slide .content { align-self: center; min-width: 0; }
.slide .accent { width: 120px; height: 3px; background: var(--ink); margin-top: clamp(20px, 4cqh, 44px); }

.blist { list-style: none; padding: 0; margin: clamp(20px, 4cqh, 48px) 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); border-top: 1px solid var(--rule); }
.blist li { padding: 18px 20px 18px 0; display: flex; gap: 16px; align-items: baseline; font-size: clamp(17px, 1.7cqw, 28px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
.blist li span { font-size: 0.6em; letter-spacing: 0.16em; font-weight: 600; color: var(--muted); }
.reframe { margin-top: clamp(20px, 4cqh, 48px); border-top: 1px solid var(--rule); }
.reframe div { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--hair); font-size: clamp(18px, 2cqw, 34px); font-weight: 600; letter-spacing: -0.015em; }
.reframe .from { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.photo-slot { border: 1px dashed var(--muted); border-radius: var(--radius); display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); min-height: 40cqh; }

/* Split layout: prompt + live wall */
.slide.split-live { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.25fr); gap: clamp(24px, 4cqw, 72px); }
.wall-wrap { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--rule); padding-left: clamp(20px, 3cqw, 48px); }
.wall-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; padding-bottom: 14px; }
.wall { flex: 1; min-height: 0; overflow-y: auto; columns: 2 260px; column-gap: 16px; scrollbar-width: thin; padding-bottom: 12px; }
.msg { break-inside: avoid; background: #fff; border: 1px solid var(--hair); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; position: relative;
  animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: none; } }
.msg p { margin: 0 0 12px; font-size: clamp(17px, 1.55cqw, 26px); line-height: 1.32; font-weight: 500; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.msg .who { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.msg .x { position: absolute; top: 8px; right: 8px; border: 0; background: var(--paper-2); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; opacity: 0; }
.msg:hover .x, .msg .x:focus-visible { opacity: 1; }
.wall-empty { color: var(--muted); font-size: clamp(16px, 1.4cqw, 22px); padding: 40px 0; column-span: all; }

/* Poll */
.poll { display: grid; gap: clamp(10px, 1.6cqh, 18px); }
.poll .opt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; font-size: clamp(16px, 1.6cqw, 26px); font-weight: 600; }
.poll .bar { grid-column: 1 / -1; height: 12px; background: var(--paper-2); border-radius: 999px; overflow: hidden; }
.poll .bar i { display: block; height: 100%; background: var(--ink); border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.poll .num { font-variant-numeric: tabular-nums; color: var(--muted); }

/* Cover QR */
.qr-box { background: #fff; border: 1px solid var(--hair); border-radius: 14px; padding: 18px; width: min(34cqh, 320px); }
.qr-box svg { width: 100%; height: auto; }
.qr-cap { text-align: center; margin-top: 12px; font-weight: 600; font-size: 15px; }
.qr-cap b { letter-spacing: 0.14em; }

/* Orchestra */
.orch { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: clamp(16px, 3cqh, 32px); }
.inst { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #fff; border: 1px solid var(--hair); border-radius: 12px; cursor: pointer; text-align: left; transition: transform .15s, border-color .15s, box-shadow .15s; }
.inst:hover { border-color: var(--ink); transform: translateY(-2px); }
.inst.playing { border-color: var(--ink); box-shadow: 0 0 0 3px var(--ink); }
.inst.playing .avatar { animation: beat .71s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.12); } }
.inst b { display: block; font-size: 16px; }
.inst small { color: var(--muted); font-size: 12px; font-weight: 600; }
.orch-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; align-items: center; }

/* Video */
.slide.video { grid-template-rows: auto minmax(0, 1fr); gap: 16px; padding-top: clamp(16px, 3cqh, 32px); padding-bottom: clamp(16px, 3cqh, 32px); }
.video-frame { position: relative; min-height: 0; display: grid; place-items: center; }
.video-frame iframe { width: 100%; height: 100%; max-height: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; background: #000; }

/* Overlays / drawers */
.overlay { position: fixed; inset: 0; background: rgba(250,250,247,.97); display: grid; place-items: center; z-index: 30; }
.overlay[hidden], .drawer[hidden] { display: none; }
.overlay .big { display: grid; grid-template-columns: auto 1fr; gap: 6cqw; align-items: center; padding: 5cqw; }
.overlay .big .qr-box { width: min(60cqh, 520px); }
.drawer { position: fixed; top: 64px; right: 0; bottom: 60px; width: min(460px, 92cqw); background: var(--paper); border-left: 1px solid var(--rule); z-index: 20; overflow-y: auto; padding: 24px; box-shadow: -20px 0 40px rgba(17,26,46,.06); }
.drawer h3 { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; margin: 0 0 12px; }
.drawer .notes p { font-size: 17px; line-height: 1.55; margin: 0 0 14px; }
.drawer .pending .msg { animation: none; }
.drawer .pending .row { display: flex; gap: 8px; }

/* Setup screen */
.setup { max-width: 560px; margin: 0 auto; padding: 8cqh var(--gutter); }

@container (max-width: 860px) {
  .slide.split-live { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .wall-wrap { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 16px; }
}
@media (max-width: 860px) {
  .joinline { display: none; }
  .controls .hide-sm { display: none; }
}

/* ---------- Audience phone ---------- */
body.phone { min-height: 100dvh; }
.phone-head { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; }
.phone-head .me { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.phone-head .code { font-size: 12px; letter-spacing: 0.2em; font-weight: 700; color: var(--muted); }
.phone-main { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
.phone-main .eyebrow { font-size: 12px; margin-bottom: 12px; letter-spacing: .24em; }
.phone-title { font-size: 30px; line-height: 1.08; letter-spacing: -0.035em; font-weight: 800; margin: 0 0 10px; }
.phone-sub { color: var(--ink-2); margin: 0 0 22px; font-size: 16px; }
.panel { background: #fff; border: 1px solid var(--hair); border-radius: 14px; padding: 18px; margin-top: 18px; }
.panel h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: -0.01em; }
.panel p { margin: 0 0 12px; color: var(--ink-2); font-size: 15px; }
.stack { display: grid; gap: 10px; }
.choice { display: block; width: 100%; text-align: left; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--hair); background: #fff; font-size: 17px; font-weight: 600; cursor: pointer; }
.choice[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.full { width: 100%; }
.sent { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.sent li { font-size: 15px; background: var(--paper-2); border-radius: 10px; padding: 10px 12px; }
.sent li small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.reveal { text-align: center; padding: 6cqh 0 2cqh; }
.reveal .avatar { margin: 0 auto 22px; animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
.reveal h1 { font-size: 40px; letter-spacing: -0.04em; margin: 4px 0 6px; line-height: 1; }
.stars { display: flex; gap: 6px; }
.stars button { font-size: 32px; line-height: 1; border: 0; background: none; cursor: pointer; padding: 4px; color: #c9c7bf; }
.stars button.on { color: var(--ink); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-2); margin: 6px 0 16px; }
.check input { margin-top: 3px; width: 18px; height: 18px; flex: none; }
.result { border-top: 1px solid var(--hair); padding: 16px 0; }
.result:first-child { border-top: 0; padding-top: 0; }
.result .dim { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.result h4 { margin: 4px 0 6px; font-size: 20px; letter-spacing: -0.02em; }
.result dl { margin: 10px 0 0; display: grid; gap: 8px; }
.result dt { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
.result dd { margin: 0; font-size: 15px; color: var(--ink-2); }
.scale { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 8px; }
.scale-bar { position: relative; height: 4px; background: var(--paper-2); border-radius: 4px; margin-top: 6px; }
.scale-bar i { position: absolute; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transform: translateX(-50%); }
.steps-dots { display: flex; gap: 6px; margin-bottom: 18px; }
.steps-dots i { height: 3px; flex: 1; background: var(--hair); border-radius: 3px; }
.steps-dots i.on { background: var(--ink); }

/* Quiz (swipe cards) */
.quiz { position: fixed; inset: 0; background: var(--paper); z-index: 40; display: flex; flex-direction: column; }
.quiz[hidden] { display: none; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--hair); font-weight: 600; font-size: 14px; }
.quiz-top button { background: none; border: 0; font-weight: 600; cursor: pointer; padding: 6px; }
.quiz-progress { height: 3px; background: var(--hair); }
.quiz-progress i { display: block; height: 100%; background: var(--ink); transition: width .3s; }
.quiz-body { flex: 1; display: grid; place-items: center; padding: 20px 16px; overflow: hidden; }
.qcard { width: min(100%, 460px); min-height: 300px; background: #fff; border: 1px solid var(--hair); border-radius: 18px; padding: 28px 24px; box-shadow: 0 18px 40px rgba(17,26,46,.08);
  display: flex; flex-direction: column; justify-content: space-between; touch-action: pan-y; user-select: none; cursor: grab; position: relative; }
.qcard .qn { font-size: 12px; font-weight: 700; letter-spacing: .2em; color: var(--muted); }
.qcard .qt { font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: -0.02em; margin: 18px 0; }
.qcard .hint { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; }
.qcard .stamp { position: absolute; top: 18px; padding: 4px 10px; border: 2px solid; border-radius: 6px; font-weight: 800; letter-spacing: .1em; opacity: 0; font-size: 14px; }
.qcard .stamp.yes { right: 18px; color: var(--ok); }
.qcard .stamp.no { left: 18px; color: #b42318; }
.quiz-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px 16px 6px; max-width: 520px; margin: 0 auto; width: 100%; }
.quiz-actions button { padding: 14px 6px; border-radius: 12px; border: 1px solid var(--ink); background: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
.quiz-actions button.sel { background: var(--ink); color: var(--paper); }
.quiz-sub { display: flex; justify-content: space-between; padding: 6px 16px 18px; max-width: 520px; margin: 0 auto; width: 100%; }
.quiz-sub button { background: none; border: 0; color: var(--muted); font-weight: 600; cursor: pointer; padding: 8px 4px; text-decoration: underline; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 10px; font-size: 15px; z-index: 60; max-width: 90cqw; }
.ctl .badge[hidden] { display: none; }
.orch { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); }
/* Fit a 16:9 player inside whatever space the slide leaves */
.video-frame { height: 100%; container-type: size; }
.video-frame iframe { width: min(100cqw, 100cqh * 16 / 9); height: min(100cqh, 100cqw * 9 / 16); max-height: none; aspect-ratio: auto; }

/* Card payoff calculator */
.calc { display: grid; gap: 14px; margin-top: 18px; max-width: 720px; }
.calc-in { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.calc-in .field { margin: 0; }
.calc-out { display: grid; gap: 8px; }
.calc-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 16px; padding: 14px 16px; border: 1px solid var(--hair); border-radius: 10px; background: #fff; }
.calc-row b { font-size: clamp(20px, 2cqw, 30px); letter-spacing: -0.02em; text-align: right; }
.calc-row small { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
.calc-row.strong { border-color: var(--ink); }
.calc-note { margin: 0; color: var(--muted); font-size: 13px; }
@media (max-width: 640px) { body:not(.stage-body) .calc-in { grid-template-columns: 1fr; } }
@container (max-width: 640px) { .calc-in { grid-template-columns: 1fr; } }
.est { display: grid; gap: 10px; }
.est-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: center; }
.est-row.head { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.est-row .input { padding: 10px 12px; font-size: 16px; }
.est-diff { font-weight: 700; font-variant-numeric: tabular-nums; }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checks label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--hair); border-radius: 10px; background: #fff; cursor: pointer; }
.checks input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--ink); flex: none; }
.checks label:has(input:checked) span { text-decoration: line-through; color: var(--muted); }
@container (max-width: 900px) { .calc-in[style] { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }

/* Click-to-reveal list items and stacked lists */
.blist.stack { grid-template-columns: 1fr; }
.blist.stack li { padding: 12px 0; }
.step { opacity: 0; transform: translateY(10px); transition: opacity .5s ease, transform .5s ease; }
.step.shown { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .step { transform: none; transition: none; } }
.photo-fig { margin: 0; }
.photo-fig img { width: 100%; max-height: 64cqh; object-fit: cover; border-radius: 6px; display: block; }

/* ---------- Warm light accents on slides ---------- */
.stage-body .progress i { background: var(--accent); }
.slide .accent { background: var(--accent); }
.slide .blist li span { color: #a88d5c; }
.stage-body .poll .bar i { background: var(--accent); }
.slide .title .spark { font-size: .9em; }
.slide.glow::before { content: ""; position: absolute; inset: -10% -10% auto auto; width: 70%; height: 90%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(228,197,140,0.14), rgba(228,197,140,0.05) 55%, rgba(228,197,140,0.0));
  filter: blur(24px); animation: slideGlow 7s ease-in-out infinite; z-index: 0; }
.slide.glow > * { position: relative; z-index: 1; }
@keyframes slideGlow { 50% { opacity: .7; transform: scale(1.05); } }
.cover-door .door-art { width: clamp(220px, 26cqw, 420px); }
@container (max-width: 900px) { .slide[data-kind="cover"] { grid-template-columns: 1fr !important; } .cover-door .door-art { width: min(260px, 60cqw); margin: 0; } }
@media (prefers-reduced-motion: reduce) { .slide.glow::before { animation: none; } }
.slide-logo { position: absolute; right: clamp(24px, 5cqw, 96px); bottom: clamp(16px, 3cqh, 32px); z-index: 2; display: flex; align-items: center; gap: 8px; color: var(--ink); opacity: .55; pointer-events: none; }
.slide-logo svg { width: 22px; height: 22px; }
.slide-logo span { display: flex; flex-direction: column; line-height: 1; }
.slide-logo b { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
.slide-logo small { font-size: 7.5px; letter-spacing: .28em; margin-top: 2px; font-weight: 600; }

/* Word cloud answers */
.wall.cloud { columns: auto; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; align-items: center; gap: 10px 22px; padding: 12px; }
.cw { font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; color: var(--ink); transition: font-size .6s cubic-bezier(.2,.8,.2,1), color .4s; animation: cwIn .5s ease both; }
.cw sup { font-size: .38em; font-weight: 700; color: #a88d5c; margin-left: 3px; }
.cw.hot { color: #9a8152; text-shadow: 0 0 .5em rgba(228,197,140,0.24); }
@keyframes cwIn { from { opacity: 0; transform: scale(.7); } }

/* Orchestra seating (live sessions): a small seat for every student who joins */
.pit { position: fixed; left: 50%; bottom: 70px; width: 240px; height: 84px; transform: translateX(-50%); z-index: 3; pointer-events: none; }
.pit .podium { position: absolute; left: 50%; bottom: -2px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px rgba(228,197,140,0.49); }
.pit .seat { position: absolute; transform: translate(-50%, -50%); font-size: 6.5px !important; opacity: .92; box-shadow: 0 0 0 1.5px var(--paper); transition: left .6s ease, top .6s ease; animation: seatIn .7s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes seatIn { from { transform: translate(-50%, -50%) scale(0); opacity: 0; } }
@media (max-width: 700px) { .pit { display: none; } }
.step.slow { display: inline-block; transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.1,1), filter 1.1s ease; filter: blur(4px); }
.step.slow.shown { filter: none; }
p.step.slow { display: block; }


/* ===== Candle illustration (preview) ===== */
.candle-art { width: clamp(260px, 30cqw, 440px); height: auto; overflow: visible; }
.candle-art .flame { transform-origin: 240px 146px; transform: scale(0); animation: flameOn .9s 1.2s cubic-bezier(.2,.7,.1,1) forwards, flicker 2.6s 2.1s ease-in-out infinite; }
@keyframes flameOn { to { transform: scale(1); } }
@keyframes flicker { 0%,100% { transform: scale(1) rotate(0deg); } 25% { transform: scale(1.03,.97) rotate(-1.5deg); } 50% { transform: scale(.98,1.04) rotate(1deg); } 75% { transform: scale(1.02,.99) rotate(-.5deg); } }
.candle-art .candle-glow, .candle-art .candle-floor { opacity: 0; transform-origin: 240px 130px; animation: candleGlow 2s 1.4s ease forwards, glowBreath 4.5s 3.4s ease-in-out infinite; }
@keyframes candleGlow { to { opacity: 1; } }
@keyframes glowBreath { 50% { transform: scale(1.07); opacity: .78; } }
@media (prefers-reduced-motion: reduce) { .candle-art .flame { transform: none; animation: none; } .candle-art .candle-glow, .candle-art .candle-floor { opacity: 1; animation: none; } }
.candle-art .twinkle { transform-box: fill-box; transform-origin: center; opacity: 0; animation: twinkle 3.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); } 45% { opacity: .95; transform: scale(1) rotate(20deg); } 60% { opacity: .7; } }
.cover-door .candle-art { width: clamp(240px, 30cqw, 460px); }
.slide .title.candle-title { font-size: clamp(30px, 4.6cqw, 80px); }
@media (prefers-reduced-motion: reduce) { .candle-art .twinkle { animation: none; opacity: .8; transform: none; } }
.slide .title.small { font-size: clamp(28px, 4.4cqw, 76px); line-height: 1.12; }

/* The slide canvas: slides size themselves to the canvas (cq units), not the window.
   On phones and portrait screens the canvas stays 16:9 (1280×720) and is scaled to fit. */
.canvas { position: absolute; inset: 0; container-type: size; }
body.fit .stage { background: var(--paper-2); }
body.fit .canvas { inset: auto; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: center; background: var(--paper); box-shadow: 0 10px 40px rgba(27,33,51,.12); }

        [6, 32, 58, 84, 110, 136, 162],
        [6, 26, 54, 82, 110, 138, 166],
        [6, 30, 58, 86, 114, 142, 170]
    ],

    G15 : (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    getBCHTypeInfo : function(data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );

    },

        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );    
        }
        return (data << 12) | d;
    },

    getBCHDigit : function(data) {

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;
        }

        return digit;
    },

    getPatternPosition : function(typeNumber) {
        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
    },

    getMask : function(maskPattern, i, j) {
        
        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 27) {

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

module.exports = QRUtil;

,"title":"이상했던 나.","subtitle":"","body":["나는 부끄럼도 많이 타고","사람들 앞에 나서는 것도 힘들어하고","열정적인 것도 없고","그닥 하고 싶은 것도 없었다.","그리고, 질문이 많았다."],"notes":["→를 누를 때마다 한 줄씩 나타납니다.","솔직하게 나누세요. 그게 저였습니다."]}},{"id":"s04","section":"01 Opening: who am I?","kind":"question","eyebrow":"But one question was always there","title":"Why?","subtitle":"","body":["Why do I study?","Why do I earn money?","Why do I do that work?","What do I want?"],"notes":["I heard it all the time: study hard, get a good job, make money. Then at some point, a question showed up — “Why?”","That doesn’t mean study or money don’t matter. I just started wondering why they mattered to me, and what I really wanted.","Have you ever asked something like that? Don’t ask for answers — just give them a moment to think."],"ko":{"section":"01 시작: 나는 어떤 사람일까?","eyebrow":"하지만 항상 있었던 질문은","title":"왜?","subtitle":"","body":["왜 공부할까?","왜 돈을 벌까?","왜 그 일을 할까?","나는 무엇을 원할까?"],"notes":["공부를 잘하고, 좋은 직업을 갖고, 돈을 벌어야 한다는 말은 정말 많이 들었어요. 그런데 어느 순간 '왜?'라는 질문이 생겼습니다.","공부나 돈이 중요하지 않다는 뜻은 아닙니다. 나에게 왜 중요한지, 내가 정말 원하는 것이 무엇인지 궁금해진 거예요.","여러분도 비슷한 질문을 해 본 적이 있나요? 대답을 요구하지 않고 잠깐 생각할 시간을 줍니다."]},"reveal":true,"layout":"stack","glow":true},{"id":"s05","section":"01 Opening: who am I?","kind":"statement","eyebrow":"Imagining my future self","title":"If I get into a good school,\nthen what?","subtitle":"","body":["Study hard and get into a good school.","At a good school, land a good job.","Work hard and buy a house.","Have children.","Work even harder.","And then one day, when I’m a grandfather — what about me?"],"notes":["The lines appear one by one. Read each slowly.","Pause after the last line."],"ko":{"section":"01 시작: 나는 어떤 사람일까?","eyebrow":"앞으로의 나를 상상하면","title":"좋은 학교에 가면,\n그다음은?","subtitle":"","body":["열심히 공부해서 좋은 학교 가고","좋은 학교 가서 좋은 직장 가고","열심히 일해서 집 사고","아이를 낳고","더 열심히 일하고","그러다 나중에 할아버지가 된다면… 과연 나는?"],"notes":["한 줄씩 나타납니다. 천천히 읽어 주세요.","마지막 줄 뒤에 잠깐 멈춥니다."]},"reveal":true,"layout":"stack"},{"id":"s05b","section":"01 Opening: who am I?","kind":"statement","glow":true,"eyebrow":"The question","title":"Was I made just to\nkeep running hard?","subtitle":"","body":[],"notes":["[Pause 3 seconds] Let the question sit."],"ko":{"section":"01 시작: 나는 어떤 사람일까?","eyebrow":"질문","title":"나는 그냥 열심히\n달려가기 위해 지어졌을까?","subtitle":"","body":[],"notes":["[3초 멈춤] 질문이 머물도록 잠시 기다립니다."]}},{"id":"s06","section":"01 Opening: who am I?","kind":"statement","eyebrow":"The question that stopped me","title":"Do I work to live?\nOr live to work?","subtitle":"Someday, looking back — what kind of life do I want to say it was?","body":[],"notes":["I pictured it: make money, get a place, buy clothes, buy a car, go back to work. And this question came up.","Am I working in order to live, or living in order to work? When I look back at the end, what do I want to remain?","[Pause 3 seconds] The question didn’t lead straight to an answer. But I couldn’t just walk past it."],"ko":{"section":"01 시작: 나는 어떤 사람일까?","eyebrow":"멈춰 서게 만든 질문","title":"살아가기 위해 일할까?\n일하기 위해 살아갈까?","subtitle":"언젠가 돌아봤을 때, 어떤 삶이었다고 말하고 싶을까?","body":[],"notes":["돈을 벌고, 집을 구하고, 옷을 사고, 차를 사고, 다시 일하는 모습을 상상했습니다. 그러다가 이 질문이 생겼어요.","나는 살아가기 위해 일하는 걸까, 일을 하기 위해 살아가는 걸까? 마지막에 내 삶을 돌아보면 무엇이 남으면 좋을까?","[3초 멈춤] 이 질문이 바로 답으로 이어지지는 않았어요. 하지만 그냥 지나치기는 어려웠습니다."]}},{"id":"s07","section":"02 What I met in Kenya","kind":"number","eyebrow":"Carrying that question","title":"So for a while,\nI stopped.","subtitle":"I took a year off from school.","body":["Time spent stepping off the expected path"],"notes":["I took a one-year leave from school and stepped off the road I’d always been on.","That doesn’t mean you need to take time off or travel far. In my story, that pause became a chance to look more deeply at the question.","Before moving to Kenya, lightly ask: “Has anyone here been to Kenya?” — a quick show of hands, not a formal activity."],"ko":{"section":"02 케냐에서 만난 장면","eyebrow":"질문을 안고","title":"그래서 잠깐,\n멈췄습니다.","subtitle":"학교를 1년 쉬었습니다.","body":["정해진 길에서 잠시 벗어나 본 시간"],"notes":["저는 학교를 1년 휴학했습니다. 늘 가던 방향에서 잠시 벗어나 보게 되었어요.","여러분도 휴학을 하거나 멀리 떠나야 한다는 뜻은 아닙니다. 제 이야기에서는 그 멈춤이 질문을 더 깊이 들여다보는 계기가 되었어요.","케냐로 넘어가기 전에 '혹시 케냐에 가 본 사람 있나요?' 하고 가볍게 손을 들어 보도록 합니다. 두 번째 정식 입력 활동으로 세지 않는 짧은 현장 대화입니다."]}},{"id":"s08","section":"02 What I met in Kenya","kind":"photo","eyebrow":"KENYA","title":"A small room in Kenya,\nand a question.","subtitle":"I started to see the things I took for granted in a new way.","body":[],"photo":{"label":"Your own photo from Kenya","note":"Optional. Use only your own photo; don’t show identifiable children without consent. Without a photo, this slide works as text.","src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAPAA7ADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwB4dW8tv73zU9vm+ZdtZENy1nMscjboz/F6VfhmVv4ty1+Wyjyn2/KSLubdtpzL91m+9Snb8zLt+anYZv4lWkSLBu+Zt3zUjvHJ97/dFMUrD/FtqW4XdF/tLRYCsyf3tzelQuFXcrfez95qvKzNtVqrunztuVW9GpxKKjWPmRbWb5ap7GhmVlXaq1stt+WPb8y1AYWm+VVqoyAijvFba33W7rWjDMs3zLWNd2bRy7l+XBqW2u2XarLtk/2aJRJ5TZRmXczfxdKjn2/Lu/76qNJmk+VWp2xm+X73+9UAShVX/aqvcK0lTNEy/Nu+7SM27azUAQpCy7t3y/7NVLu1abcyrujxzV12b7yt2qulw00LKy7WU7auIGcHkt5VVtzR/wB5u1aEM6t8qt83+zVeaDdt2qzbvmNVQzR7flbbn7q1ctQNdXZtzMvl7flFP3t91vu5qtbzed95qsMytu/2agBSit8u77tMAbyty+v8VPT/AHtu6npuXdtbcv8AdoFIhmG3b8v3v4q7DwRYL9nkvWVd33Eb
